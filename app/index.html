<style>
/* Layout: phiếu ôn thi — one centered answer sheet, sticky tab rail, bubbles like an OMR answer form, red pen for corrections */
:root {
  --paper: #EEF2F6;
  --sheet: #FFFFFF;
  --ink: #18264A;
  --muted: #5A6782;
  --line: #D3DBE6;
  --accent: #2547A8;
  --accent-soft: #E3E9F8;
  --red: #C2362F;
  --red-soft: #FBE9E7;
  --ok: #2B7A4B;
  --ok-soft: #E3F3E9;
  --font-display: "Lora", Georgia, "Times New Roman", serif;
  --font-body: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --font-ipa: "Noto Sans", "Segoe UI", "Lucida Sans Unicode", sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1320; --sheet: #161D2C; --ink: #E3E8F2; --muted: #9AA6BD; --line: #2A3448;
    --accent: #8AA4F2; --accent-soft: #1F2A47; --red: #F1857B; --red-soft: #3A1F1F;
    --ok: #74CC98; --ok-soft: #173326; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E1320; --sheet: #161D2C; --ink: #E3E8F2; --muted: #9AA6BD; --line: #2A3448;
  --accent: #8AA4F2; --accent-soft: #1F2A47; --red: #F1857B; --red-soft: #3A1F1F;
  --ok: #74CC98; --ok-soft: #173326; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.wrap { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { padding-block: 28px 12px; display: grid; gap: 14px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1 { font-family: var(--font-display); font-size: clamp(26px, 5vw, 36px); line-height: 1.15; margin: 0; text-wrap: balance; }
h2 { font-family: var(--font-display); font-size: 22px; margin: 0; text-wrap: balance; }
h3 { font-size: 15px; margin: 0; font-weight: 700; }
.goal { display: flex; flex-wrap: wrap; gap: 8px 18px; color: var(--muted); font-size: 13.5px; }
.goal b { color: var(--ink); font-variant-numeric: tabular-nums; }
.days { display: flex; gap: 6px; flex-wrap: wrap; }
.day-btn { font: inherit; font-weight: 600; border: 1.5px solid var(--line); background: var(--sheet); color: var(--ink); border-radius: 999px; padding: 4px 12px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.day-btn[aria-pressed="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.day-btn .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.day-btn .dot.ready { background: var(--ok); }
nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); }
nav.tabs .wrap { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tab { font: inherit; font-size: 14px; font-weight: 500; white-space: nowrap; border: 0; background: none; color: var(--muted); padding: 11px 10px 9px; border-bottom: 2.5px solid transparent; cursor: pointer; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 700; }
.tab.global { margin-left: auto; }
.tab.global ~ .tab.global { margin-left: 0; }
main { padding-block: 22px 60px; display: grid; gap: 18px; }
.sheet { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 22px clamp(16px, 4vw, 28px); display: grid; gap: 16px; min-width: 0; }
.head-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.meta { color: var(--muted); font-size: 13px; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
td.formula { font-weight: 600; color: var(--accent); white-space: nowrap; }
.ipa { font-family: var(--font-ipa); color: var(--muted); font-size: 13.5px; }
ul.plain { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.trap { border-left: 3px solid var(--red); padding: 4px 0 4px 14px; display: grid; gap: 4px; }
.wrong { color: var(--red); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.right { color: var(--ok); font-weight: 600; }
.btn { font: inherit; font-weight: 600; font-size: 14px; border-radius: 8px; padding: 8px 16px; cursor: pointer; border: 1.5px solid var(--ink); background: var(--ink); color: var(--sheet); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn:disabled { opacity: .45; cursor: default; }
.btn:focus-visible, .tab:focus-visible, .day-btn:focus-visible, .opt input:focus-visible + .bubble, textarea:focus-visible, input[type=text]:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.score { font-family: var(--font-display); font-size: 22px; font-weight: 700; color: var(--red); font-variant-numeric: tabular-nums; }
.q { display: grid; grid-template-columns: 34px 1fr; gap: 4px 10px; padding-block: 12px; border-bottom: 1px dashed var(--line); }
.q:last-of-type { border-bottom: 0; }
.qn { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted); padding-top: 1px; }
.qtype { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 6px 14px; margin-top: 6px; grid-column: 2; }
.opt { display: flex; align-items: flex-start; gap: 8px; cursor: pointer; padding: 3px 4px; border-radius: 6px; }
.opt input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.bubble { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--muted); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--muted); }
.opt input:checked + .bubble { background: var(--ink); border-color: var(--ink); color: var(--sheet); }
.opt.is-correct .bubble { box-shadow: 0 0 0 3px var(--ok); }
.opt.is-wrong .bubble { background: var(--red); border-color: var(--red); color: var(--sheet); }
.opt.is-wrong span:last-child { color: var(--red); text-decoration: line-through; }
.feedback { grid-column: 2; font-size: 14px; margin-top: 6px; padding: 8px 12px; border-radius: 8px; }
.feedback.ok { background: var(--ok-soft); }
.feedback.bad { background: var(--red-soft); }
.feedback .tag { font-size: 12px; font-weight: 600; color: var(--muted); }
.evidence { font-style: italic; color: var(--muted); }
.passage { font-family: var(--font-display); font-size: 16.5px; line-height: 1.75; max-width: 65ch; display: grid; gap: 12px; }
.passage p { margin: 0; }
.passage .pn { font-family: var(--font-body); font-size: 12px; color: var(--muted); font-weight: 600; margin-right: 6px; }
mark { background: var(--accent-soft); color: inherit; padding: 0 2px; border-radius: 3px; }
.timer { font-family: var(--font-display); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.timer.low { color: var(--red); }
input[type=text], textarea { font: inherit; width: 100%; border: 1.5px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--paper); color: var(--ink); }
textarea { min-height: 90px; resize: vertical; }
.paper-title { font-size: 15px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 28px 4px 10px; }
.tq { display: grid; gap: 6px; padding-block: 12px; border-bottom: 1px dashed var(--line); }
.tq .start { display: flex; gap: 8px; align-items: center; }
.tq .start b { white-space: nowrap; }
.checklist { display: grid; gap: 0; }
.ck { display: grid; grid-template-columns: 26px 110px 1fr; gap: 10px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.ck input { accent-color: var(--accent); width: 17px; height: 17px; }
.ck .t { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13.5px; }
.ck.done .what { color: var(--muted); text-decoration: line-through; }
.ck.rest { cursor: default; }
.ck.rest .what { color: var(--muted); font-style: italic; }
.card-stage { display: grid; place-items: center; gap: 14px; }
.flash { width: min(100%, 440px); min-height: 190px; border: 1.5px solid var(--line); border-radius: var(--r); background: var(--paper); display: grid; place-items: center; text-align: center; padding: 22px; cursor: pointer; gap: 6px; font: inherit; color: var(--ink); }
.flash .big { font-family: var(--font-display); font-size: 26px; font-weight: 700; }
tr.known-row td { opacity: .5; }
tr.known-row td:first-child { opacity: 1; }
.ck-known { accent-color: var(--ok); width: 17px; height: 17px; cursor: pointer; }
.btn.ok { background: var(--ok); border-color: var(--ok); color: var(--sheet); }
.toggle { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); cursor: pointer; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 12.5px; font-weight: 600; padding: 2px 10px; border-radius: 999px; background: var(--red-soft); color: var(--red); }
.chip.n { background: var(--accent-soft); color: var(--accent); }
.ai-out { white-space: pre-wrap; font-size: 14px; background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; }
.ai-out:empty { display: none; }
.intro-line { padding: 6px 0; border-bottom: 1px dashed var(--line); }
.note { font-size: 13px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.grid2 > * { min-width: 0; }
.status { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--paper); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.status.on { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
@media (max-width: 520px) {
  .q { grid-template-columns: 26px 1fr; }
  .opts { grid-column: 1 / -1; }
  .feedback { grid-column: 1 / -1; }
  .ck { grid-template-columns: 24px 1fr; }
  .ck .t { grid-column: 2; }
  .ck .what { grid-column: 2; }
}
@media (prefers-reduced-motion: no-preference) { .flash { transition: transform .15s; } .flash:active { transform: scale(.98); } }
</style>

<script>
const DATA = {"days": {"1": {"day": 1, "grammarTopic": "Thì động từ + Bị động", "vocabTopic": "Collocation make / do / take / have", "speakingTopic": "Giới thiệu bản thân", "plan": [{"time": "0:00 – 0:15", "step": "Bài học ngữ pháp", "content": "Thì động từ + bị động: công thức, dấu hiệu, 3 bẫy"}, {"time": "0:15 – 0:45", "step": "Bài tập ngữ pháp", "content": "10 câu Sentence completion + 3 câu Sentence transformation"}, {"time": "0:45 – 0:55", "step": "Chấm + sửa lỗi", "content": "Đọc giải thích từng câu sai, ghi vào sổ lỗi"}, {"time": "0:55 – 1:05", "step": "Nghỉ", "content": ""}, {"time": "1:05 – 1:35", "step": "Từ vựng", "content": "20 collocation make/do/take/have, chép tay, đọc to"}, {"time": "1:35 – 1:50", "step": "Bài tập từ vựng", "content": "10 câu dạng Paper 1 Part A"}, {"time": "1:50 – 2:00", "step": "Nghỉ", "content": ""}, {"time": "2:00 – 2:30", "step": "Luyện đọc", "content": "1 bài ~250 từ + 5 câu, bấm giờ 12 phút, học 8 từ mới"}, {"time": "2:30 – 3:20", "step": "Luyện nói", "content": "Viết + học thuộc bài giới thiệu bản thân, trả lời 5 câu hỏi"}, {"time": "3:20 – 3:30", "step": "Nghỉ", "content": ""}, {"time": "3:30 – 4:00", "step": "Tổng kết", "content": "Xem lại lỗi sai theo chủ điểm + quiz 10 câu"}], "grammar": {"sections": [{"title": "Chọn thì nhanh: 3 bước (làm theo thứ tự, dừng khi đã chắc)", "headers": ["Bước", "Làm gì", "Ví dụ"], "rows": [["1. Gạch dấu hiệu", "Tìm từ chỉ thời gian trong câu (ago, since, now, while, by the time, so far…) rồi tra cột \"Dấu hiệu\" ở bảng dưới. Khoảng 7/10 câu xong ngay ở bước này.", "I met him two days ___ → thấy \"ago\" → quá khứ đơn."], ["2. Không có dấu hiệu → xác định mốc", "Nhìn động từ ở vế còn lại hoặc ngữ cảnh: chuyện xảy ra ở quá khứ, hiện tại hay tương lai?", "When he called, I ___ → \"called\" là quá khứ → chọn một thì quá khứ."], ["3. Cùng mốc → hỏi thêm 1 câu", "Đang diễn ra dở? → tiếp diễn. Xảy ra TRƯỚC một việc khác, hoặc tính đến một thời điểm? → hoàn thành. Chỉ là sự việc, thói quen? → đơn.", "When he called, I ___ (cook): lúc đó đang nấu dở → was cooking."]]}, {"title": "5 cặp hay nhầm: hỏi đúng 1 câu là tách được", "headers": ["Cặp", "Tự hỏi", "Ví dụ"], "rows": [["Hiện tại hoàn thành / Quá khứ đơn", "Có mốc thời gian đã kết thúc không (yesterday, ago, last…, in 2010)? Có → quá khứ đơn. Không có, hoặc tính đến bây giờ (so far, since, for, … times) → hiện tại hoàn thành.", "I went to Da Lat last year. / I have been to Da Lat three times."], ["Quá khứ đơn / Quá khứ tiếp diễn", "Việc ngắn chen vào hay việc dài đang dở? Việc dài đang dở (thường đi với while) → was/were + V-ing. Việc ngắn → V2.", "I was cooking when he called."], ["Quá khứ đơn / Quá khứ hoàn thành", "Có 2 việc trong quá khứ không? Việc xảy ra TRƯỚC → had + V3.", "When I arrived, she had left."], ["Will / Be going to", "Quyết định ngay lúc nói → will. Đã có kế hoạch, hoặc nhìn thấy dấu hiệu trước mắt → be going to.", "The phone's ringing. I'll answer it. / Look at those clouds! It's going to rain."], ["Hiện tại đơn / Hiện tại tiếp diễn", "Thói quen hoặc sự thật → đơn. Đang xảy ra lúc nói (now, Look!, Listen!) → tiếp diễn. Động từ trạng thái (know, like, want, believe, taste) không dùng -ing.", "Water boils at 100°C. / Listen! Someone is knocking."]]}, {"title": "Các thì hay ra trong đề", "headers": ["Thì", "Công thức (khẳng định)", "Dấu hiệu nhận biết", "Ví dụ"], "rows": [["Hiện tại đơn", "S + V(s/es)", "always, usually, often, every day, sự thật hiển nhiên", "Water boils at 100°C."], ["Hiện tại tiếp diễn", "S + am/is/are + V-ing", "now, at the moment, right now, Look!, Listen!", "She is reading now."], ["Hiện tại hoàn thành", "S + have/has + V3", "since, for, already, yet, so far, ever, never, recently, many times", "I have lived here for five years."], ["Quá khứ đơn", "S + V2 / V-ed", "yesterday, ago, last week, in 2010", "I met him two days ago."], ["Quá khứ tiếp diễn", "S + was/were + V-ing", "while, when + QKĐ, at 8 p.m. yesterday", "I was cooking when he called."], ["Quá khứ hoàn thành", "S + had + V3", "before, after, by the time + QKĐ", "She had left before I arrived."], ["Tương lai đơn", "S + will + V", "tomorrow, next week, I think, probably, quyết định ngay lúc nói", "I think it will rain."], ["Be going to", "S + am/is/are going to + V", "kế hoạch có sẵn, dấu hiệu rõ ràng trước mắt", "Look at those clouds! It is going to rain."], ["Tương lai tiếp diễn", "S + will be + V-ing", "at this time tomorrow, at 8 p.m. tomorrow", "At 8 p.m. tomorrow I will be watching TV."]]}, {"title": "Câu bị động: đổi theo thì", "headers": ["Thì", "Chủ động", "Bị động (be + V3)"], "rows": [["Hiện tại đơn", "They clean the room.", "The room is cleaned."], ["Hiện tại tiếp diễn", "They are cleaning the room.", "The room is being cleaned."], ["Hiện tại hoàn thành", "They have cleaned the room.", "The room has been cleaned."], ["Quá khứ đơn", "They cleaned the room.", "The room was cleaned."], ["Quá khứ tiếp diễn", "They were cleaning the room.", "The room was being cleaned."], ["Tương lai / động từ khuyết thiếu", "They will / can clean the room.", "The room will / can be cleaned."]]}], "notes": ["Cách đổi: tân ngữ lên làm chủ ngữ → giữ nguyên thì, thêm be chia theo thì → động từ chính đổi sang V3 → (by + người làm).", "Bỏ 'by them / by people / by someone' vì không cần thiết.", "Bị động với say/think/believe: People say that he is rich → It is said that he is rich = He is said to be rich.", "Chủ ngữ là VẬT (bridge, letter, house, car…) + động từ cần người làm → nghĩ ngay tới bị động."], "traps": [{"title": "since vs for", "wrong": "I have lived here since five years.", "right": "I have lived here for five years. / since 2020.", "why": "since + mốc thời gian (2020, Monday, I was a child); for + khoảng thời gian (five years, two weeks)."}, {"title": "by the time / before + quá khứ → quá khứ hoàn thành", "wrong": "By the time we arrived, the film started.", "right": "By the time we arrived, the film had started.", "why": "Hành động xảy ra TRƯỚC một hành động khác trong quá khứ dùng had + V3."}, {"title": "Bị động thiếu 'being' hoặc dùng sai V3", "wrong": "A new hospital is building now. / The letter was wrote.", "right": "A new hospital is being built now. / The letter was written.", "why": "Bị động tiếp diễn = am/is/are + being + V3. Luôn dùng V3 (cột 3), không dùng V2."}]}, "grammarMcq": [{"q": "She ___ English since she was ten.", "options": ["learns", "has learned", "learned", "is learning"], "answer": "B", "tag": "Hiện tại hoàn thành", "explain": "'since + mốc thời gian' → hiện tại hoàn thành: has learned."}, {"q": "When I arrived at the party, my friends ___.", "options": ["dance", "have danced", "were dancing", "dances"], "answer": "C", "tag": "Quá khứ tiếp diễn", "explain": "Hành động đang diễn ra (were dancing) thì hành động khác xen vào (arrived, quá khứ đơn)."}, {"q": "This bridge ___ in 1995 by a French company.", "options": ["was built", "built", "is built", "has built"], "answer": "A", "tag": "Bị động", "explain": "Chủ ngữ là vật (bridge) + 'by a company' → bị động; 'in 1995' → quá khứ: was built."}, {"q": "By the time we got to the cinema, the film ___.", "options": ["starts", "has started", "was starting", "had started"], "answer": "D", "tag": "Quá khứ hoàn thành", "explain": "'By the time + quá khứ đơn' → mệnh đề còn lại dùng quá khứ hoàn thành: had started."}, {"q": "Look at those dark clouds! It ___ rain.", "options": ["is going to", "will", "rains", "is raining"], "answer": "A", "tag": "Be going to", "explain": "Có dấu hiệu rõ ràng trước mắt (dark clouds) → be going to."}, {"q": "A new hospital ___ in our town at the moment.", "options": ["builds", "is building", "is being built", "was built"], "answer": "C", "tag": "Bị động", "explain": "'at the moment' → tiếp diễn; bệnh viện được xây → bị động tiếp diễn: is being built."}, {"q": "I ___ to Da Lat three times so far.", "options": ["go", "went", "am going", "have been"], "answer": "D", "tag": "Hiện tại hoàn thành", "explain": "'three times', 'so far' → hiện tại hoà id progress", "example": "She has made good progress this month."}, {"phrase": "make an effort", "pos": "v. phr.", "ipa": "/meɪk ən ˈefət/", "meaning": "nỗ lực", "colloc": "make a great effort to + V", "example": "He made an effort to arrive on time."}, {"phrase": "make money", "pos": "v. phr.", "ipa": "/meɪk ˈmʌni/", "meaning": "kiếm tiền", "colloc": "make a lot of money", "example": "They make money by selling cakes online."}, {"phrase": "do homework", "pos": "v. phr.", "ipa": "/duː ˈhəʊmwɜːk/", "meaning": "làm bài tập về nhà", "colloc": "do your homework", "example": "I do my homework every evening."}, {"phrase": "do research", "pos": "v. phr.", "ipa": "/duː rɪˈsɜːtʃ/", "meaning": "nghiên cứu", "colloc": "do research on / into sth", "example": "She is doing research on climate change."}, {"phrase": "do business", "pos": "v. phr.", "ipa": "/duː ˈbɪznəs/", "meaning": "kinh doanh, làm ăn", "colloc": "do business with sb", "example": "Our company does business with Japan."}, {"phrase": "do your best", "pos": "v. phr.", "ipa": "/duː jɔː best/", "meaning": "cố gắng hết sức", "colloc": "do one's best to + V", "example": "I will do my best in the exam."}, {"phrase": "do the housework", "pos": "v. phr.", "ipa": "/duː ðə ˈhaʊswɜːk/", "meaning": "làm việc nhà", "colloc": "do the washing / cooking / shopping", "example": "My brother does the housework at weekends."}, {"phrase": "take a photo", "pos": "v. phr.", "ipa": "/teɪk ə ˈfəʊtəʊ/", "meaning": "chụp ảnh", "colloc": "take a photo of sb/sth", "example": "Could you take a photo of us?"}, {"phrase": "take part in", "pos": "v. phr.", "ipa": "/teɪk pɑːt ɪn/", "meaning": "tham gia", "colloc": "take part in a competition / an activity", "example": "Many students took part in the contest."}, {"phrase": "take care of", "pos": "v. phr.", "ipa": "/teɪk keər əv/", "meaning": "chăm sóc", "colloc": "take good care of sb", "example": "She takes care of her grandmother."}, {"phrase": "take notes", "pos": "v. phr.", "ipa": "/teɪk nəʊts/" me, I enjoy ___ because it helps me ___.", "I'm applying for the Master's programme in ___ at the University of Science because I want to ___.", "After I graduate, I hope to ___.", "Thank you for listening."], "frame": "Ý chính → Lý do (because…) → Ví dụ (For example…)", "rescue": ["That's an interesting question. Let me think…", "Could you repeat the question, please?", "I'm not sure, but I think…", "What I mean is…"], "questions": [{"q": "Can you tell me a little about yourself?", "hint": "Tên, quê, ngành học, công việc hiện tại. Dùng lại bài giới thiệu nhưng nói tự nhiên."}, {"q": "Why do you want to do a Master's degree?", "hint": "Ý chính: nâng cao kiến thức / cơ hội nghề nghiệp. Lý do: because… Ví dụ: For example, in my job I…"}, {"q": "What do you usually do in your free time?", "hint": "1 sở thích → vì sao thích → lần gần nhất bạn làm việc đó."}, {"q": "What are your strengths and weaknesses?", "hint": "1 điểm mạnh + ví dụ; 1 điểm yếu + cách bạn đang khắc phục."}, {"q": "What are your plans for the next five years?", "hint": "Dùng be going to / hope to / plan to. Học xong thạc sĩ → công việc → mục tiêu cá nhân."}], "rubric": ["Trôi chảy (ít ngập ngừng, nói đủ ý)", "Ngữ pháp (thì đúng, chủ ngữ – động từ hòa hợp)", "Từ vựng (đúng chủ đề, có collocation)", "Phát âm (âm cuối -s, -ed, trọng âm)", "Nội dung (trả lời đúng câu hỏi, có lý do và ví dụ)"]}, "reviewQuiz": [{"q": "I ___ my homework yet.", "options": ["don't finish", "haven't finished", "didn't finish", "am not finishing"], "answer": "B", "tag": "Hiện tại hoàn thành", "explain": "'yet' ở câu phủ định → hiện tại hoàn thành: haven't finished."}, {"q": "English ___ in many countries around the world.", "options": ["speaks", "is speaking", "is spoken", "spoke"], "answer": "C", "tag": "Bị động", "explain": "Tiếng Anh được nói → bị động hiện tại đơn: is spoken."}, {"q": "While she ___ TV, the phone rang.", "options": ["was watching", "watched", "watches", "has watched"], "answer": "A", "tag": "Quá khứ tiếp diễn", "explain": "while + quá khứ tiếp diễn, hành động xen vào dùng quá khứ đơn (rang)."}, {"q": "They ___ money by selling handmade cards.", "options": ["do", "take", "have", "make"], "answer": "D", "tag": "Collocation make", "explain": "make money = kiếm tiền."}, {"q": "My bike ___ last night.", "options": ["stole", "was stolen", "is stolen", "has stolen"], "answer": "B", "tag": "Bị động", "explain": "Xe bị lấy cắp → bị động; last night → quá khứ: was stolen."}, {"q": "We ___ an argument about money last week.", "options": ["did", "made", "had", "took"], "answer": "C", "tag": "Collocation have", "explain": "have an argument = cãi nhau; last week → had."}, {"q": "She ___ in Hanoi since 2020.", "options": ["lives", "lived", "is living", "has lived"], "answer": "D", "tag": "Hiện tại hoàn thành", "explain": "since 2020 → hiện tại hoàn thành: has lived."}, {"q": "The meeting ___ by the manager next Monday.", "options": ["will be held", "will hold", "holds", "is holding"], "answer": "A", "tag": "Bị động", "explain": "Cuộc họp được tổ chức (by the manager) + next Monday → will be held."}, {"q": "I ___ my best, but I failed the test.", "options": ["made", "did", "took", "had"], "answer": "B", "tag": "Collocation do", "explain": "do one's best → did my best."}, {"q": "By the end of 2025, she ___ three books.", "options": ["wrote", "writes", "had written", "has written"], "answer": "C", "tag": "Quá khứ hoàn thành", "explain": "By + mốc trong quá khứ → hành động hoàn tất trước mốc đó: had written."}], "extra": {"title": "Luyện thêm: các thì", "note": "30 câu chọn đáp án + 5 câu viết lại. Làm từng phần, nộp xong đọc kỹ giải thích câu sai.", "sets": [{"key": "tensePresent", "title": "Các thì hiện tại", "items": [{"q": "My sister usually ___ to work by bus, but today she is driving.", "options": ["goes", "is going", "has gone", "went"], "answer": "A", "tag": "Hiện tại đơn", "explain": "\"usually\" chỉ thói quen → hiện tại đơn. Vế sau \"today she is driving\" mới là việc tạm thời."}, {"q": "Listen! Someone ___ at the door.", "options": ["knocks", "is knocking", "has knocked", "knocked"], "answer": "B", "tag": "Hiện tại tiếp diễn", "explain": "\"Listen!\" → việc đang xảy ra ngay lúc nói → am/is/are + V-ing."}, {"q": "We ___ each other since we were at primary school.", "options": ["know", "are knowing", "have known", "knew"], "answer": "C", "tag": "Hiện tại hoàn thành", "explain": "\"since + mốc\" → hiện tại hoàn thành. \"know\" là động từ trạng thái, không dùng dạng -ing."}, {"q": "She ___ English for three hours, so she is very tired now.", "options": ["studies", "is studying", "studied", "has been studying"], "answer": "D", "tag": "HTHT tiếp diễn", "explain": "Hành động kéo dài liên tục tới bây giờ và để lại kết quả (mệt) → have/has been + V-ing."}, {"q": "This soup ___ delicious. Can I have some more?", "options": ["tastes", "is tasting", "has tasted", "tasted"], "answer": "A", "tag": "Hiện tại đơn", "explain": "taste (= có vị) là động từ trạng thái → hiện tại đơn, không dùng is tasting."}, {"q": "The train to Hue ___ at 7:30 tomorrow morning, according to the timetable.", "options": ["leave", "leaves", "will be left", "has left"], "answer": "B", "tag": "Hiện tại đơn", "explain": "Lịch trình cố định (timetable) → hiện tại đơn dù nói về tương lai. Chủ ngữ số ít → leaves."}, {"q": "I ___ my homework yet, so I can't go out.", "options": ["don't finish", "didn't finish", "haven't finished", "am not finishing"], "answer": "C", "tag": "Hiện tại hoàn thành", "explain": "\"yet\" (câu phủ định, câu hỏi) → hiện tại hoàn thành."}, {"q": "How often ___ to the gym?", "options": ["are you going", "have you gone", "did you go", "do you go"], "answer": "D", "tag": "Hiện tại đơn", "explain": "\"How often\" hỏi về mức độ thường xuyên → hiện tại đơn."}, {"q": "This is the first time I ___ sushi.", "options": ["have eaten", "eat", "am eating", "ate"], "answer": "A", "tag": "Hiện tại hoàn thành", "explain": "This is the first/second time + S + have/has + V3."}, {"q": "She ___ in this company for ten years, and she still loves her job.", "options": ["works", "is working", "has worked", "worked"], "answer": "C", "tag": "Hiện tại hoàn thành", "explain": "\"for ten years\" + vẫn còn làm (still) → hiện tại hoàn thành."}]}, {"key": "tensePast", "title": "Các thì quá khứ", "items": [{"q": "I ___ my keys yesterday, so I had to call my wife.", "options": ["lose", "have lost", "was losing", "lost"], "answer": "D", "tag": "Quá khứ đơn", "explain": "\"yesterday\" → mốc quá khứ đã xong → quá khứ đơn. Không dùng hiện tại hoàn thành với yesterday."}, {"q": "While I ___ dinner, the lights went out.", "options": ["was cooking", "cooked", "have cooked", "had cooked"], "answer": "A", "tag": "Quá khứ tiếp diễn", "explain": "While + quá khứ tiếp diễn (việc đang diễn ra), việc xen vào dùng quá khứ đơn (went out)."}, {"q": "After she ___ her homework, she went to bed.", "options": ["was finishing", "had finished", "has finished", "finishes"], "answer": "B", "tag": "Quá khứ hoàn thành", "explain": "Việc xảy ra trước một việc khác trong quá khứ → had + V3."}, {"q": "What ___ at 8 p.m. last night? I called you but you didn't answer.", "options": ["did you do", "have you done", "were you doing", "do you do"], "answer": "C", "tag": "Quá khứ tiếp diễn", "explain": "Một giờ cụ thể trong quá khứ (8 p.m. last night) → hỏi việc đang làm lúc đó → was/were + V-ing."}, {"q": "My grandfather ___ in the army when he was young.", "options": ["has served", "was serving", "had served", "served"], "answer": "D", "tag": "Quá khứ đơn", "explain": "Việc đã xong trong một giai đoạn quá khứ (when he was young) → quá khứ đơn."}, {"q": "She ___ to Japan three years ago.", "options": ["went", "has gone", "had gone", "goes"], "answer": "A", "tag": "Quá khứ đơn", "explain": "\"ago\" → luôn dùng quá khứ đơn."}, {"q": "I didn't recognise him because I ___ him for years.", "options": ["didn't see", "haven't seen", "hadn't seen", "wasn't seeing"], "answer": "C", "tag": "Quá khứ hoàn thành", "explain": "Việc kéo dài tới trước một thời điểm quá khứ (lúc không nhận ra) → had + V3."}, {"q": "They ___ football when it started to rain.", "options": ["played", "were playing", "have played", "had played"], "answer": "B", "tag": "Quá khứ tiếp diễn", "explain": "Việc đang diễn ra (were playing) thì việc khác xen vào (started, quá khứ đơn)."}, {"q": "___ you ___ the news last night?", "options": ["Have / watched", "Had / watched", "Were / watching", "Did / watch"], "answer": "D", "tag": "Quá khứ đơn", "explain": "\"last night\" → quá khứ đơn: Did + S + V nguyên mẫu?"}, {"q": "By the end of last year, he ___ enough money to buy a motorbike.", "options": ["saved", "has saved", "had saved", "was saving"], "answer": "C", "tag": "Quá khứ hoàn thành", "explain": "By + mốc quá khứ (by the end of last year) → quá khứ hoàn thành."}]}, {"key": "tenseHard", "title": "Phân biệt thì + tương lai", "items": [{"q": "I ___ this film before, so I know how it ends.", "options": ["have seen", "saw", "had seen", "see"], "answer": "A", "tag": "Hiện tại hoàn thành", "explain": "Trải nghiệm không rõ thời điểm (before) và còn liên quan tới hiện tại (know) → hiện tại hoàn thành."}, {"q": "\"The phone is ringing.\" – \"I ___ it.\"", "options": ["answer", "will answer", "am going to answer", "have answered"], "answer": "B", "tag": "Will", "explain": "Quyết định ngay lúc nói → will. \"be going to\" dùng cho kế hoạch đã có từ trước."}, {"q": "We ___ to Nha Trang next week. We have already booked the hotel.", "options": ["will go", "go", "are going to go", "went"], "answer": "C", "tag": "Be going to", "explain": "Kế hoạch đã định sẵn (đã đặt khách sạn) → be going to."}, {"q": "I ___ in Ho Chi Minh City for five years before I moved to Hanoi.", "options": ["have lived", "am living", "lived", "had lived"], "answer": "D", "tag": "Quá khứ hoàn thành", "explain": "Việc kéo dài và kết thúc trước một việc quá khứ khác (moved) → had + V3."}, {"q": "He ___ a lot of weight since he started jogging.", "options": ["lost", "has lost", "had lost", "loses"], "answer": "B", "tag": "Hiện tại hoàn thành", "explain": "since + mệnh đề quá khứ đơn (since he started) → mệnh đề chính dùng hiện tại hoàn thành."}, {"q": "When I was a child, I ___ in the river every summer.", "options": ["swam", "have swum", "was swimming", "had swum"], "answer": "A", "tag": "Quá khứ đơn", "explain": "Thói quen trong quá khứ (every summer, when I was a child) → quá khứ đơn (hoặc used to + V)."}, {"q": "By the time you come back, I ___ the report.", "options": ["finish", "finished", "will have finished", "have finished"], "answer": "C", "tag": "Tương lai hoàn thành", "explain": "By the time + hiện tại đơn (nói về tương lai) → will have + V3: sẽ xong trước lúc đó."}, {"q": "This time tomorrow, we ___ on the beach in Vung Tau.", "options": ["lie", "are lying", "lay", "will be lying"], "answer": "D", "tag": "Tương lai tiếp diễn", "explain": "\"This time tomorrow\" → việc đang diễn ra tại một thời điểm tương lai → will be + V-ing."}, {"q": "I ___ to London twice, but I have never been to Paris.", "options": ["went", "have been", "had been", "was going"], "answer": "B", "tag": "Hiện tại hoàn thành", "explain": "Số lần trải nghiệm tính đến nay (twice) → have been. Giống lỗi \"three times so far\" ngày 1."}, {"q": "Mai ___ her leg when she was skiing last winter.", "options": ["broke", "has broken", "was breaking", "had broken"], "answer": "A", "tag": "Quá khứ đơn", "explain": "Việc ngắn xen vào (broke) khi việc khác đang diễn ra (was skiing) → quá khứ đơn."}]}], "transform": [{"source": "I started learning English five years ago.", "start": "I have", "answers": ["I have learned English for five years.", "I have learnt English for five years.", "I have been learning English for five years."], "tag": "Hiện tại hoàn thành", "explain": "started … ago → have + V3 (hoặc have been + V-ing) + for + khoảng thời gian. Bỏ \"ago\"."}, {"source": "The last time I saw her was in 2020.", "start": "I haven't", "answers": ["I haven't seen her since 2020."], "tag": "Hiện tại hoàn thành", "explain": "The last time + S + V2 + was + mốc → S + haven't + V3 + since + mốc."}, {"source": "This is the first time I have visited Hue.", "start": "I have never", "answers": ["I have never visited Hue before.", "I have never visited Hue."], "tag": "Hiện tại hoàn thành", "explain": "This is the first time + HTHT → S + have never + V3 + (before)."}, {"source": "It's two months since he last called me.", "start": "He hasn't", "answers": ["He hasn't called me for two months.", "He hasn't called me for two months now."], "tag": "Hiện tại hoàn thành", "explain": "It's + khoảng thời gian + since + S + last + V2 → S + hasn't + V3 + for + khoảng thời gian."}, {"source": "She finished her homework and then she went to bed.", "start": "Before she went to bed, she", "answers": ["Before she went to bed, she had finished her homework."], "tag": "Quá khứ hoàn thành", "explain": "Việc xảy ra trước (finished) → had + V3; việc sau (went to bed) → quá khứ đơn."}]}}, "2": {"day": 2, "grammarTopic": "Mệnh đề quan hệ + liên từ", "vocabTopic": "Phrasal verb nhóm 1", "speakingTopic": "Quê hương", "plan": [{"time": "0:00 – 0:15", "step": "Bài học ngữ pháp", "content": "Mệnh đề quan hệ (who/which/whose/where…) + liên từ (although/despite, because/because of)"}, {"time": "0:15 – 0:40", "step": "Bài tập ngữ pháp", "content": "10 câu Sentence completion + 5 câu Sentence transformation"}, {"time": "0:40 – 0:55", "step": "Luyện thêm: thì", "content": "10 câu + 3 câu viết lại, nhắm vào 2 lỗi lặp lại của ngày 1"}, {"time": "0:55 – 1:05", "step": "Nghỉ", "content": ""}, {"time": "1:05 – 2:35", "step": "Đề mẫu: Paper 1 + 2", "content": "50 câu trong 90 phút, không xem tài liệu, không mở study.md"}, {"time": "2:35 – 2:55", "step": "Đề mẫu: Paper 3", "content": "Nghe 20 câu, mỗi đoạn phát 2 lần"}, {"time": "2:55 – 3:05", "step": "Nghỉ", "content": ""}, {"time": "3:05 – 3:20", "step": "Chữa đề mẫu", "content": "Đọc giải thích từng câu sai, ghi lại điểm từng Paper"}, {"time": "3:20 – 3:40", "step": "Từ vựng", "content": "20 phrasal verb + 10 câu Paper 1 Part A"}, {"time": "3:40 – 4:00", "step": "Luyện nói", "content": "Chủ đề Quê hương: 5 câu, có câu dùng hiện tại hoàn thành"}, {"time": "4:00 – 4:10", "step": "Tổng kết", "content": "Xem lỗi sai theo chủ điểm + quiz 10 câu"}], "grammar": {"sections": [{"title": "Đại từ / trạng từ quan hệ", "headers": ["Từ", "Thay cho", "Theo sau thường là", "Ví dụ"], "rows": [["who", "người (làm chủ ngữ)", "động từ", "The man who lives next door is a doctor."], ["whom", "người (làm tân ngữ)", "S + V", "The woman whom I met yesterday is my teacher."], ["which", "vật, con vật", "động từ hoặc S + V", "The laptop which I bought is very fast."], ["that", "người hoặc vật (chỉ trong mệnh đề KHÔNG có dấu phẩy)", "động từ hoặc S + V", "The car that he drives is new."], ["whose", "sở hữu: CỦA người/vật đó", "danh từ (không có a/the/my)", "I know a girl whose father is a pilot."], ["where", "nơi chốn (= in/at which)", "S + V đầy đủ", "This is the village where I was born."], ["when", "thời gian (= on/in which)", "S + V đầy đủ", "I remember the day when we first met."]]}, {"title": "Liên từ: nhìn phía sau chỗ trống", "headers": ["Nghĩa", "+ mệnh đề (S + V)", "+ danh từ / V-ing", "Ví dụ"], "rows": [["Mặc dù", "although / even though / though", "despite / in spite of", "Although it rained, we went out. = Despite the rain, we went out."], ["Bởi vì", "because / since / as", "because of / due to", "Because it rained, … = Because of the rain, …"], ["Tuy nhiên", "S + V. However, S + V.", "—", "It was hard. However, I finished it."], ["Vì vậy", "…, so S + V. / Therefore, S + V.", "—", "I was tired, so I went to bed early."]]}, {"title": "Chọn từ quan hệ trong 2 bước", "headers": ["Bước", "Làm gì", "Ví dụ"], "rows": [["1. Nhìn từ đứng TRƯỚC chỗ trống", "Người → who/whom/that. Vật → which/that. Nơi chốn → where (hoặc which). Thời gian → when.", "the house ___ → vật hoặc nơi chốn"], ["2. Nhìn phía SAU chỗ trống", "Có động từ ngay sau → who/which (làm chủ ngữ). Có danh từ trơn + động từ → whose. Có S + V đầy đủ, không thiếu gì → where/when. Có S + V nhưng thiếu tân ngữ → which/whom.", "the house ___ I live → I live đã đủ nghĩa → where. the house ___ I bought → bought thiếu tân ngữ → which."]]}], "notes": ["Có dấu phẩy (thông tin thêm về tên riêng, my mother, Hanoi…) → KHÔNG dùng that. Hanoi, which is the capital, …", "whom/which làm tân ngữ có thể bỏ: The book (which) I bought was cheap.", "Giới từ + which/whom: the house in which I live = the house where I live. Không có \"in that\".", "Despite + V-ing: Despite being tired, … Muốn giữ mệnh đề thì dùng Despite the fact that + S + V.", "However đứng đầu câu, sau dấu chấm, có dấu phẩy sau nó. But đứng giữa câu."], "traps": [{"title": "Dùng that sau dấu phẩy", "wrong": "My father, that is a doctor, works in Hue.", "right": "My father, who is a doctor, works in Hue.", "why": "Mệnh đề có dấu phẩy chỉ dùng who/which, không dùng that."}, {"title": "Although + danh từ", "wrong": "Although the rain, we went out.", "right": "Despite the rain, we went out. / Although it rained, we went out.", "why": "Although cần mệnh đề có S + V. \"the rain\" chỉ là danh từ → Despite."}, {"title": "Although … but trong cùng một câu", "wrong": "Although he was tired, but he kept working.", "right": "Although he was tired, he kept working.", "why": "Tiếng Việt nói \"Mặc dù… nhưng…\", tiếng Anh chỉ dùng MỘT trong hai từ."}]}, "grammarMcq": [{"q": "The man ___ lives next door is a famous singer.", "options": ["which", "who", "whose", "where"], "answer": "B", "tag": "Mệnh đề quan hệ", "explain": "Trước là người (the man), sau là động từ (lives) → who làm chủ ngữ."}, {"q": "This is the house ___ my grandparents used to live.", "options": ["which", "that", "where", "when"], "answer": "C", "tag": "Mệnh đề quan hệ", "explain": "Sau chỗ trống: my grandparents used to live, đã đủ S + V, không thiếu tân ngữ → where (= in which)."}, {"q": "I have a friend ___ father is a pilot.", "options": ["who", "whom", "which", "whose"], "answer": "D", "tag": "Mệnh đề quan hệ", "explain": "Sau chỗ trống là danh từ trơn \"father\" + động từ → whose (bố CỦA bạn ấy)."}, {"q": "___ she was tired, she stayed up to finish the report.", "options": ["Although", "Despite", "Because of", "However"], "answer": "A", "tag": "Liên từ", "explain": "Sau chỗ trống là mệnh đề (she was tired) và nghĩa tương phản → Although. Despite/Because of cần danh từ."}, {"q": "The flight was delayed ___ the bad weather.", "options": ["because", "although", "because of", "in spite"], "answer": "C", "tag": "Liên từ", "explain": "Sau là cụm danh từ (the bad weather), nghĩa nguyên nhân → because of. \"in spite\" thiếu \"of\"."}, {"q": "The laptop ___ I bought last week has stopped working.", "options": ["which", "who", "where", "whose"], "answer": "A", "tag": "Mệnh đề quan hệ", "explain": "Trước là vật, sau là I bought (thiếu tân ngữ: mua cái gì?) → which."}, {"q": "Hanoi, ___ is the capital of Vietnam, has many old buildings.", "options": ["that", "who", "which", "where"], "answer": "C", "tag": "Mệnh đề quan hệ", "explain": "Có dấu phẩy → không dùng that. Sau là động từ (is) → which. where cần S + V phía sau."}, {"q": "He failed the exam ___ studying very hard.", "options": ["although", "despite", "because", "because of"], "answer": "B", "tag": "Liên từ", "explain": "Sau là V-ing (studying), nghĩa tương phản (học chăm mà vẫn trượt) → despite."}, {"q": "I still remember the day ___ I started my first job.", "options": ["when", "which", "where", "who"], "answer": "A", "tag": "Mệnh đề quan hệ", "explain": "Trước là thời gian (the day), sau là S + V đầy đủ → when."}, {"q": "It was raining heavily. ___, the football match continued.", "options": ["Therefore", "Because", "Although", "However"], "answer": "D", "tag": "Liên từ", "explain": "Đầu câu, có dấu phẩy, nghĩa tương phản với câu trước → However. Therefore = vì vậy, sai nghĩa."}], "transform": [{"source": "Although it rained heavily, they went on with the match.", "start": "Despite", "answers": ["Despite the heavy rain, they went on with the match.", "Despite the fact that it rained heavily, they went on with the match."], "tag": "Liên từ", "explain": "Although + mệnh đề → Despite + cụm danh từ (rained heavily → the heavy rain) hoặc Despite the fact that + mệnh đề."}, {"source": "He was ill, so he didn't go to work.", "start": "Because of", "answers": ["Because of his illness, he didn't go to work.", "Because of being ill, he didn't go to work."], "tag": "Liên từ", "explain": "Because of + danh từ / V-ing: he was ill → his illness (hoặc being ill)."}, {"source": "I met a woman. Her son is my classmate.", "start": "I met a woman whose", "answers": ["I met a woman whose son is my classmate."], "tag": "Mệnh đề quan hệ", "explain": "Her son → whose son (con trai CỦA bà ấy). Bỏ \"her\" vì whose đã mang nghĩa sở hữu."}, {"source": "I last visited my hometown three years ago.", "start": "I haven't", "answers": ["I haven't visited my hometown for three years."], "tag": "Hiện tại hoàn thành", "explain": "last + V2 + ago → haven't + V3 + for + khoảng thời gian. Chủ động nên KHÔNG có \"been\". Bỏ \"last\" và \"ago\"."}, {"source": "Someone stole my bike last night.", "start": "My bike", "answers": ["My bike was stolen last night."], "tag": "Bị động", "explain": "Quá khứ đơn bị động: was/were + V3. Bỏ \"someone\" vì không cần nói ai làm. last night → quá khứ, không dùng has been."}], "extra": {"title": "Luyện thêm: thì (sửa 2 lỗi lặp lại)", "note": "Lỗi 1: thấy mốc quá khứ (ago, yesterday, in 2019, when he was young, before + V2) mà vẫn chọn have/has. Lỗi 2: thêm \"been\" vào câu chủ động. Nhớ: have + V3 = đã làm (chủ động); have been + V3 = đã BỊ làm (bị động, chủ ngữ thường là vật); have been + V-ing = đã đang làm (chủ động, nhấn mạnh quá trình).", "sets": [{"key": "tenseFix", "title": "Hiện tại hoàn thành, quá khứ đơn hay quá khứ hoàn thành?", "items": [{"q": "My father ___ in a bank for 20 years before he retired last year.", "options": ["has worked", "had worked", "works", "is working"], "answer": "B", "tag": "Quá khứ hoàn thành", "explain": "Đứng ở mốc \"lúc nghỉ hưu năm ngoái\" nhìn lại → had + V3. Mũi tên dừng ở quá khứ, không chạm tới bây giờ."}, {"q": "I ___ my wallet yesterday, so I couldn't pay for lunch.", "options": ["lost", "have lost", "had lost", "have been lost"], "answer": "A", "tag": "Quá khứ đơn", "explain": "\"yesterday\" là mốc quá khứ đã kết thúc → quá khứ đơn. Không dùng have/has với yesterday."}, {"q": "She ___ English since she was ten.", "options": ["learned", "has been learned", "has learned", "had learned"], "answer": "C", "tag": "Hiện tại hoàn thành", "explain": "since + mốc, tính tới bây giờ → has + V3. \"has been learned\" là bị động (tiếng Anh bị học), sai nghĩa."}, {"q": "The letters ___ yet. Can you post them now?", "options": ["haven't sent", "haven't been sent", "didn't send", "hadn't sent"], "answer": "B", "tag": "Bị động", "explain": "Chủ ngữ là VẬT (the letters) không tự gửi được → bị động: haven't been + V3. Đây là lúc \"been\" đúng."}, {"q": "Tom ___ his homework yet.", "options": ["hasn't finished", "hasn't been finished", "didn't finish", "isn't finishing"], "answer": "A", "tag": "Hiện tại hoàn thành", "explain": "Chủ ngữ là NGƯỜI tự làm bài → chủ động: hasn't + V3, không có been. So với câu trên: vật → been, người → không been."}, {"q": "When we got to the station, the last bus ___.", "options": ["left", "has left", "was leaving", "had left"], "answer": "D", "tag": "Quá khứ hoàn thành", "explain": "Đứng ở mốc \"lúc tới bến\" (quá khứ) nhìn lại: xe đã đi trước đó → had left."}, {"q": "Lan ___ to Singapore in 2019.", "options": ["has gone", "had gone", "went", "has been"], "answer": "C", "tag": "Quá khứ đơn", "explain": "\"in 2019\" là mốc quá khứ cụ thể → quá khứ đơn."}, {"q": "We ___ each other for ten years, and we are still best friends.", "options": ["knew", "have known", "had known", "have been known"], "answer": "B", "tag": "Hiện tại hoàn thành", "explain": "for ten years + vẫn còn tới giờ (are still) → have + V3. \"have been known\" là bị động, sai."}, {"q": "My grandmother ___ in the countryside when she was young.", "options": ["has lived", "had lived", "lives", "lived"], "answer": "D", "tag": "Quá khứ đơn", "explain": "\"when she was young\" là giai đoạn đã qua → quá khứ đơn. Đây là lỗi has served ở ngày 1."}, {"q": "How long ___ in this city? – Since 2021.", "options": ["have you lived", "did you live", "are you living", "had you lived"], "answer": "A", "tag": "Hiện tại hoàn thành", "explain": "How long + Since 2021 (tới giờ vẫn sống) → have you lived."}]}], "transform": [{"source": "She started teaching at this school in 2018.", "start": "She has", "answers": ["She has taught at this school since 2018.", "She has been teaching at this school since 2018."], "tag": "Hiện tại hoàn thành", "explain": "started + in 2018 → has + V3 + since 2018. Được dùng \"has been teaching\" (been + V-ing, chủ động). KHÔNG viết has been taught (bị động)."}, {"source": "I haven't seen this film before.", "start": "This is the first time", "answers": ["This is the first time I have seen this film.", "This is the first time I've seen this film."], "tag": "Hiện tại hoàn thành", "explain": "haven't … before ↔ This is the first time + S + have + V3. Không dùng hiện tại đơn sau the first time."}, {"source": "We arrived at the cinema. The film had started before that.", "start": "When we arrived at the cinema, the film", "answers": ["When we arrived at the cinema, the film had started.", "When we arrived at the cinema, the film had already started."], "tag": "Quá khứ hoàn thành", "explain": "Mốc là lúc tới rạp (quá khứ); phim bắt đầu trước đó → had + V3."}]}, "vocab": [{"phrase": "look after", "pos": "phr. v.", "ipa": "/lʊk ˈɑːftə(r)/", "meaning": "chăm sóc", "colloc": "look after children / a pet / yourself", "example": "She looks after her grandmother every weekend."}, {"phrase": "look for", "pos": "phr. v.", "ipa": "/lʊk fɔː(r)/", "meaning": "tìm kiếm", "colloc": "look for a job / your keys", "example": "I'm looking for a new job."}, {"phrase": "look forward to", "pos": "phr. v.", "ipa": "/lʊk ˈfɔːwəd tə/", "meaning": "mong chờ", "colloc": "look forward to + V-ing / danh từ", "example": "I look forward to hearing from you."}, {"phrase": "look up", "pos": "phr. v.", "ipa": "/lʊk ʌp/", "meaning": "tra cứu (từ điển, mạng)", "colloc": "look up a word / look it up", "example": "Look up new words in a dictionary."}, {"phrase": "find out", "pos": "phr. v.", "ipa": "/faɪnd aʊt/", "meaning": "tìm ra, phát hiện", "colloc": "find out the truth / find out that…", "example": "I found out that the shop was closed."}, {"phrase": "give up", "pos": "phr. v.", "ipa": "/ɡɪv ʌp/", "meaning": "từ bỏ", "colloc": "give up smoking / give up + V-ing", "example": "He gave up smoking last year."}, {"phrase": "put off", "pos": "phr. v.", "ipa": "/pʊt ɒf/", "meaning": "hoãn lại", "colloc": "put off a meeting / put off + V-ing", "example": "Don't put off doing your homework."}, {"phrase": "call off", "pos": "phr. v.", "ipa": "/kɔːl ɒf/", "meaning": "hủy bỏ", "colloc": "call off a meeting / a trip / a match", "example": "They called off the trip because of the storm."}, {"phrase": "turn down", "pos": "phr. v.", "ipa": "/tɜːn daʊn/", "meaning": "từ chối; vặn nhỏ", "colloc": "turn down an offer / turn down the music", "example": "She turned down the job offer."}, {"phrase": "set up", "pos": "phr. v.", "ipa": "/set ʌp/", "meaning": "thành lập, dựng lên", "colloc": "set up a company / a business", "example": "He set up his own company in 2020."}, {"phrase": "carry on", "pos": "phr. v.", "ipa": "/ˈkæri ɒn/", "meaning": "tiếp tục", "colloc": "carry on + V-ing / carry on with sth", "example": "Carry on working while I'm out."}, {"phrase": "run out of", "pos": "phr. v.", "ipa": "/rʌn aʊt əv/", "meaning": "hết, cạn", "colloc": "run out of money / time / petrol", "example": "We've run out of milk."}, {"phrase": "get on (well) with", "pos": "phr. v.", "ipa": "/ɡet ɒn wɪð/", "meaning": "hòa hợp với", "colloc": "get on well with colleagues / neighbours", "example": "I get on well with my boss."}, {"phrase": "take after", "pos": "phr. v.", "ipa": "/teɪk ˈɑːftə(r)/", "meaning": "giống (bố mẹ, người lớn trong nhà)", "colloc": "take after your father / mother", "example": "She takes after her mother."}, {"phrase": "come across", "pos": "phr. v.", "ipa": "/kʌm əˈkrɒs/", "meaning": "tình cờ thấy, gặp", "colloc": "come across an old photo / an article", "example": "I came across an interesting article yesterday."}, {"phrase": "pick up", "pos": "phr. v.", "ipa": "/pɪk ʌp/", "meaning": "đón (ai); nhặt; học lỏm", "colloc": "pick sb up from school / at the airport", "example": "I'll pick you up at 7."}, {"phrase": "fill in", "pos": "phr. v.", "ipa": "/fɪl ɪn/", "meaning": "điền (đơn, mẫu)", "colloc": "fill in a form / an application", "example": "Please fill in this application form."}, {"phrase": "get over", "pos": "phr. v.", "ipa": "/ɡet ˈəʊvə(r)/", "meaning": "vượt qua, hồi phục", "colloc": "get over an illness / a problem / a shock", "example": "It took her two weeks to get over the flu."}, {"phrase": "turn up", "pos": "phr. v.", "ipa": "/tɜːn ʌp/", "meaning": "xuất hiện, đến; vặn to", "colloc": "turn up late / turn up the volume", "example": "He turned up late for the meeting."}, {"phrase": "cut down on", "pos": "phr. v.", "ipa": "/kʌt daʊn ɒn/", "meaning": "cắt giảm", "colloc": "cut down on sugar / coffee / spending", "example": "My doctor told me to cut down on sugar."}], "vocabMcq": [{"q": "Could you ___ my cat while I'm on holiday?", "options": ["look for", "look after", "look up", "look into"], "answer": "B", "tag": "Phrasal verb", "explain": "look after = chăm sóc. look for = tìm; look up = tra cứu; look into = điều tra."}, {"q": "If you don't know a word, ___ it ___ in the dictionary.", "options": ["look / up", "find / out", "pick / up", "turn / up"], "answer": "A", "tag": "Phrasal verb", "explain": "look sth up = tra (từ điển). find out = phát hiện ra thông tin, không dùng với dictionary."}, {"q": "The concert was ___ because the singer was ill.", "options": ["set up", "turned up", "carried on", "called off"], "answer": "D", "tag": "Phrasal verb", "explain": "call off = hủy bỏ (bị động: was called off). carry on = tiếp tục, ngược nghĩa."}, {"q": "I'm really looking forward to ___ you next week.", "options": ["see", "seeing", "saw", "have seen"], "answer": "B", "tag": "Phrasal verb", "explain": "look forward to + V-ing. \"to\" ở đây là giới từ, không phải to + V nguyên mẫu."}, {"q": "She ___ a good job offer because the salary was too low.", "options": ["turned up", "gave up", "turned down", "put on"], "answer": "C", "tag": "Phrasal verb", "explain": "turn down an offer = từ chối lời mời. give up = từ bỏ việc mình đang làm."}, {"q": "We've ___ of coffee. Can you buy some on your way home?", "options": ["run out", "cut down", "carried on", "got over"], "answer": "A", "tag": "Phrasal verb", "explain": "run out of = hết. cut down on = cắt giảm (phải là \"on\", không phải \"of\")."}, {"q": "Tom really ___ his father; they both have curly hair and love football.", "options": ["looks after", "gets on", "comes across", "takes after"], "answer": "D", "tag": "Phrasal verb", "explain": "take after = giống người lớn trong nhà. look after = chăm sóc."}, {"q": "Please ___ this form and give it to the receptionist.", "options": ["write in", "put in", "fill in", "take in"], "answer": "C", "tag": "Phrasal verb", "explain": "fill in a form = điền vào mẫu đơn."}, {"q": "My uncle ___ his own business after he left the bank.", "options": ["put up", "set up", "took up", "made up"], "answer": "B", "tag": "Phrasal verb", "explain": "set up a business = thành lập. take up = bắt đầu một sở thích; make up = bịa ra / trang điểm."}, {"q": "It took him a long time to ___ the death of his dog.", "options": ["get on", "get up", "get off", "get over"], "answer": "D", "tag": "Phrasal verb", "explain": "get over = vượt qua (nỗi buồn, bệnh). get on = hòa hợp / lên xe; get off = xuống xe."}], "speaking": {"introTitle": "Bài mẫu: Your hometown (khoảng 1 phút, điền chỗ trống)", "intro": ["My hometown is ___, a ___ (small town / big city) in the ___ (north / centre / south) of Vietnam.", "It is famous for ___ and ___.", "In recent years, it has changed a lot. Many new ___ have been built, and the roads have become ___.", "What I like most about my hometown is ___ because ___.", "However, one problem is ___.", "In the future, I would like to ___ there."], "frame": "Ý chính → Lý do (because…) → Ví dụ (For example…)", "rescue": ["That's an interesting question. Let me think…", "Could you repeat the question, please?", "I'm not sure, but I think…", "What I mean is…"], "questions": [{"q": "Where is your hometown?", "hint": "Tên, vị trí (in the north of… / about 100 km from…), lớn hay nhỏ, dân số khoảng bao nhiêu."}, {"q": "What is your hometown famous for?", "hint": "Món ăn / cảnh đẹp / nghề truyền thống + 1 ví dụ cụ thể. Dùng which: …, which is a kind of noodle soup."}, {"q": "How has your hometown changed in recent years?", "hint": "HIỆN TẠI HOÀN THÀNH: it has changed, it has become… Vật được xây → bị động: new roads have been built. Câu chủ động thì không có been."}, {"q": "What do you like most about living there?", "hint": "Ý chính → because… → For example… Có thể dùng where: the market where my mother works."}, {"q": "Would you prefer to live in a big city or in the countryside? Why?", "hint": "I'd prefer to live in… because… Dùng liên từ hôm nay: Although the city is noisy, … / However, …"}], "rubric": ["Trôi chảy (ít ngập ngừng, nói đủ ý)", "Ngữ pháp (thì đúng, mệnh đề quan hệ, liên từ)", "Từ vựng (đúng chủ đề, có phrasal verb hoặc collocation)", "Phát âm (âm cuối -s, -ed, trọng âm)", "Nội dung (trả lời đúng câu hỏi, có lý do và ví dụ)"]}, "reviewQuiz": [{"q": "I ___ this teacher since I started university.", "options": ["know", "knew", "have known", "am knowing"], "answer": "C", "tag": "Hiện tại hoàn thành", "explain": "since + mệnh đề quá khứ → mệnh đề chính dùng have + V3. know không dùng -ing."}, {"q": "The bridge ___ two years ago.", "options": ["was built", "has been built", "built", "has built"], "answer": "A", "tag": "Bị động", "explain": "Vật (the bridge) → bị động; \"ago\" → quá khứ đơn: was built. has been built sai vì có ago."}, {"q": "The girl ___ I met at the party is a nurse.", "options": ["whose", "who", "where", "which"], "answer": "B", "tag": "Mệnh đề quan hệ", "explain": "Trước là người, sau là I met (thiếu tân ngữ) → who/whom. whose cần danh từ theo sau."}, {"q": "___ the traffic jam, we arrived on time.", "options": ["Although", "Because of", "However", "In spite of"], "answer": "D", "tag": "Liên từ", "explain": "Sau là danh từ (the traffic jam), nghĩa tương phản (kẹt xe mà vẫn đúng giờ) → In spite of."}, {"q": "By the time I got home, my family ___ dinner.", "options": ["had finished", "have finished", "finish", "were finishing"], "answer": "A", "tag": "Quá khứ hoàn thành", "explain": "By the time + quá khứ đơn → đứng ở mốc quá khứ nhìn lại → had + V3."}, {"q": "\"The phone's ringing.\" – \"OK, I ___ it.\"", "options": ["am going to answer", "answer", "will answer", "have answered"], "answer": "C", "tag": "Will", "explain": "Quyết định ngay lúc nói → will."}, {"q": "She ___ her mother; they are both very kind.", "options": ["looks after", "takes up", "gets over", "takes after"], "answer": "D", "tag": "Phrasal verb", "explain": "take after = giống (mẹ)."}, {"q": "We've ___ milk. Can you buy some?", "options": ["run up", "run out of", "run out", "run over"], "answer": "B", "tag": "Phrasal verb", "explain": "run out of + danh từ = hết cái gì. Thiếu \"of\" thì không có tân ngữ được."}, {"q": "This is the restaurant ___ we had our first date.", "options": ["where", "which", "who", "when"], "answer": "A", "tag": "Mệnh đề quan hệ", "explain": "Nơi chốn + S + V đầy đủ (we had our first date) → where."}, {"q": "My phone ___ yet. It's still in the shop.", "options": ["hasn't repaired", "didn't repair", "hasn't been repaired", "wasn't repairing"], "answer": "C", "tag": "Bị động", "explain": "Điện thoại không tự sửa → bị động; yet → hiện tại hoàn thành: hasn't been repaired."}], "exam": {"title": "Đề mẫu KHTN · 70 câu", "note": "Làm như thi thật: Paper 1 + 2 trong 90 phút, Paper 3 khoảng 20 phút (mỗi bài nghe phát 2 lần). Nộp từng Part, điểm quy đổi hiện ở đầu trang.", "papers": [{"title": "PAPER 1 – Vocabulary & Reading", "points": 20, "parts": [{"key": "x1a", "title": "Part A. Vocabulary (1–10)", "directions": "Directions: Choose the word or phrase (A, B, C or D) that best completes each sentence.", "start": 1, "items": [{"q": "The bus ___ down on the way, so we arrived an hour late.", "options": ["broke", "put", "turned", "let"], "answer": "A", "tag": "Phrasal verb", "explain": "break down = (xe, máy) bị hỏng. turn down = từ chối/vặn nhỏ; let down = làm thất vọng; put down = đặt xuống."}, {"q": "Could you give the police a brief ___ of the man you saw?", "options": ["account", "description", "information", "detail"], "answer": "B", "tag": "Từ vựng", "explain": "a description of a person = sự mô tả một người. account = bản tường thuật sự việc; detail là chi tiết nhỏ; information không đếm được, không đi với \"a\"."}, {"q": "I tried to ___ him to stay, but he had already made up his mind.", "options": ["insist", "persuade", "suggest", "demand"], "answer": "B", "tag": "Từ vựng", "explain": "persuade sb to do sth = thuyết phục ai làm gì. insist on; suggest + V-ing/that; demand that/demand sth, không dùng \"demand sb to do\"."}, {"q": "I'd like to ___ an appointment with Dr. Lan for Friday morning.", "options": ["make", "do", "have", "take"], "answer": "A", "tag": "Collocation", "explain": "make an appointment = đặt lịch hẹn. Collocation cố định."}, {"q": "After weeks of discussion, the board finally ___ a decision.", "options": ["reached", "got", "did", "put"], "answer": "A", "tag": "Collocation", "explain": "reach a decision = đi đến quyết định. Cũng nói make a decision, nhưng không dùng do/get/put."}, {"q": "We searched everywhere for the missing keys, but all in ___.", "options": ["failure", "waste", "vain", "use"], "answer": "C", "tag": "Idiom", "explain": "in vain = vô ích, uổng công. Thành ngữ cố định."}, {"q": "Regular exercise can significantly ___ the risk of heart disease.", "options": ["reduce", "fall", "drop", "decline"], "answer": "A", "tag": "Từ vựng", "explain": "Cần ngoại động từ có tân ngữ \"the risk\": reduce. decline/fall thường là nội động từ (giá giảm); drop the risk không tự nhiên."}, {"q": "Our new manager is very ___; she always listens to her staff's ideas.", "options": ["considering", "considerable", "considerate", "consideration"], "answer": "C", "tag": "Từ dễ nhầm", "explain": "considerate = chu đáo, biết quan tâm người khác. considerable = đáng kể (a considerable amount). Sau \"very\" cần tính từ."}, {"q": "All students must ___ their assignments before Friday.", "options": ["hand in", "take off", "hand out", "give up"], "answer": "A", "tag": "Phrasal verb", "explain": "hand in = nộp (bài). hand out = phát ra; give up = từ bỏ; take off = cởi ra/cất cánh."}, {"q": "The company plans to ___ more money in research next year.", "options": ["pay", "cost", "spend", "invest"], "answer": "D", "tag": "Từ dễ nhầm", "explain": "invest money in sth = đầu tư tiền vào. spend money ON sth; pay FOR; cost không đi với \"money in\"."}]}, {"key": "x1b1", "title": "Part B. Reading – First passage (11–15)", "directions": "Directions: Read the passages and choose the best answer (A, B, C or D) to each question.", "start": 11, "passageTitle": "Sleep and Memory", "passage": ["For a long time, sleep was seen as a period when the brain simply switched off. Today, scientists know that this is far from true. While we sleep, the brain is busy sorting and storing the information we collected during the day.", "In one well-known type of experiment, two groups of students learn a list of new words in the evening. One group sleeps for eight hours, while the other stays awake through the night. When both groups are tested the next day, the students who slept usually remember far more words. Researchers believe that during deep sleep, the brain replays new memories and moves them from short-term storage to long-term storage.", "Sleep also seems to help us solve problems. People who are given a difficult puzzle and allowed to 'sleep on it' are often more likely to find the answer the next morning than those who keep working on it without rest.", "Unfortunately, many students do exactly the opposite before an exam. They stay up late, drink coffee and try to learn everything in one night. This habit, known as 'cramming', may help them remember a few facts for a short time, but much of the information is quickly forgotten. Lack of sleep also makes it harder to concentrate during the exam itself.", "The message for learners is simple: studying a little every day and getting enough sleep is far more effective than a single long night of revision."], "items": [{"q": "What is the main idea of the passage?", "options": ["Puzzles are difficult to solve at night.", "The brain switches off completely during sleep.", "Students drink too much coffee.", "Sleep plays an important role in learning and memory."], "answer": "D", "tag": "Đọc: ý chính", "explain": "Cả bài nói về vai trò của giấc ngủ với trí nhớ và việc học. A và D chỉ là chi tiết; C bị bài phủ nhận ngay đoạn 1."}, {"q": "In the experiment, the students who slept ___.", "options": ["did not take the test", "remembered more words the next day", "forgot most of the words", "learned the words faster in the evening"], "answer": "B", "tag": "Đọc: chi tiết", "explain": "Đoạn 2: \"the students who slept usually remember far more words\"."}, {"q": "The word 'it' in \"sleep on it\" (paragraph 3) refers to ___.", "options": ["the rest", "the puzzle", "the night", "the answer"], "answer": "B", "tag": "Đọc: từ quy chiếu", "explain": "\"sleep on it\" = để sang hôm sau mới quyết; \"it\" thay cho \"a difficult puzzle\" ngay trước đó."}, {"q": "According to the passage, 'cramming' ___.", "options": ["improves concentration during the exam", "helps students remember information for a long time", "is recommended by researchers", "may help with a few facts, but much is soon forgotten"], "answer": "D", "tag": "Đọc: chi tiết", "explain": "Đoạn 4: giúp nhớ vài dữ kiện trong thời gian ngắn nhưng phần lớn bị quên nhanh, và còn làm giảm tập trung (loại D)."}, {"q": "What advice does the writer give to learners?", "options": ["Take a test every morning.", "Avoid studying in the evening.", "Study a little every day and get enough sleep.", "Stay up late before an exam."], "answer": "C", "tag": "Đọc: chi tiết", "explain": "Câu cuối bài nêu rõ lời khuyên này."}]}, {"key": "x1b2", "title": "Part B. Reading – Second passage (16–20)", "start": 16, "passageTitle": "Working from Home", "passage": ["Before 2020, working from home was a privilege enjoyed by only a small number of employees. When the pandemic forced offices to close, millions of people suddenly had to turn their kitchens and bedrooms into workplaces. Several years later, many companies have decided not to return completely to the old system. Instead, they have adopted a 'hybrid' model, in which staff spend part of the week in the office and part of it at home.", "Supporters of remote work point to several benefits. Employees save the time and money they used to spend on commuting, and many say they can concentrate better without the noise of a busy office. Companies, for their part, can reduce the cost of renting large office spaces.", "However, working from home is not without its problems. Some workers feel lonely and miss the informal conversations with colleagues that often lead to new ideas. Others find it difficult to separate their working life from their private life, and end up working much longer hours than before. Managers, too, sometimes find it harder to train new staff or to build a strong team spirit.", "For these reasons, most experts believe that the hybrid model is likely to remain the most popular option. It allows employees to enjoy the flexibility of remote work while keeping the face-to-face contact that is still essential for many tasks."], "items": [{"q": "What is the passage mainly about?", "options": ["How to train new staff", "The history of the pandemic", "How to rent an office", "The advantages and disadvantages of working from home"], "answer": "D", "tag": "Đọc: ý chính", "explain": "Đoạn 2 nêu lợi ích, đoạn 3 nêu bất lợi, đoạn 4 kết luận. Các phương án khác chỉ là chi tiết."}, {"q": "According to the passage, a 'hybrid' model means ___.", "options": ["working longer hours", "working only in the office", "working only at home", "dividing the week between the office and home"], "answer": "D", "tag": "Đọc: chi tiết", "explain": "Đoạn 1 định nghĩa: part of the week in the office and part of it at home."}, {"q": "Which of the following is NOT mentioned as a benefit of remote work?", "options": ["Saving time on commuting", "Better concentration", "Higher salaries", "Lower office costs for companies"], "answer": "C", "tag": "Đọc: NOT mentioned", "explain": "A, B, C đều có ở đoạn 2. Bài không nhắc tới lương cao hơn."}, {"q": "The word 'essential' in the last paragraph is closest in meaning to ___.", "options": ["expensive", "difficult", "necessary", "optional"], "answer": "C", "tag": "Đọc: từ đồng nghĩa", "explain": "essential = cần thiết, thiết yếu = necessary. optional là trái nghĩa."}, {"q": "What do most experts believe about the hybrid model?", "options": ["It is likely to remain the most popular option.", "It is only suitable for managers.", "It causes loneliness.", "It will soon disappear."], "answer": "A", "tag": "Đọc: chi tiết", "explain": "Đoạn 4: \"the hybrid model is likely to remain the most popular option\"."}]}]}, {"title": "PAPER 2 – Grammar, Use of English & Writing", "points": 40, "parts": [{"key": "x2a", "title": "Part A. Sentence completion (21–35)", "directions": "Directions: Choose the word or phrase (A, B, C or D) that best completes each sentence.", "start": 21, "items": [{"q": "If I ___ more free time, I would learn another language.", "options": ["will have", "would have", "have", "had"], "answer": "D", "tag": "Câu điều kiện", "explain": "Câu điều kiện loại 2 (không có thật ở hiện tại): If + S + V2/ed, S + would + V."}, {"q": "She ___ for this company since 2018.", "options": ["works", "has worked", "is working", "worked"], "answer": "B", "tag": "Hiện tại hoàn thành", "explain": "\"since 2018\" là dấu hiệu thì hiện tại hoàn thành: has/have + V3."}, {"q": "The report ___ by the end of next week.", "options": ["is finishing", "finishes", "will finish", "will be finished"], "answer": "D", "tag": "Bị động", "explain": "Bản báo cáo không tự hoàn thành, nên dùng bị động tương lai: will be + V3."}, {"q": "The woman ___ car was stolen called the police.", "options": ["which", "whom", "who", "whose"], "answer": "D", "tag": "Mệnh đề quan hệ", "explain": "whose + danh từ chỉ sự sở hữu: chiếc xe CỦA người phụ nữ."}, {"q": "I'm not used to ___ up so early.", "options": ["getting", "be getting", "got", "get"], "answer": "A", "tag": "Used to / be used to", "explain": "be used to + V-ing = quen với việc gì. Khác used to + V (đã từng)."}, {"q": "___ the heavy rain, the match went ahead as planned.", "options": ["Although", "Because", "Even though", "Despite"], "answer": "D", "tag": "Liên từ", "explain": "Sau chỗ trống là cụm danh từ \"the heavy rain\" nên dùng Despite. Although/Even though cần mệnh đề S + V."}, {"q": "He asked me where ___.", "options": ["did I live", "I am living", "do I live", "I lived"], "answer": "D", "tag": "Câu gián tiếp", "explain": "Câu hỏi gián tiếp: không đảo trợ động từ, và lùi thì (live → lived)."}, {"q": "By the time we arrived, the film ___.", "options": ["has already started", "already started", "was already starting", "had already started"], "answer": "D", "tag": "Quá khứ hoàn thành", "explain": "Hành động xảy ra trước một hành động khác trong quá khứ dùng quá khứ hoàn thành: had + V3."}, {"q": "You'd better ___ a doctor about that cough.", "options": ["seen", "to see", "see", "seeing"], "answer": "C", "tag": "Had better", "explain": "had better + V nguyên mẫu (không \"to\")."}, {"q": "This is the ___ book I have ever read.", "options": ["most interesting", "more interesting", "as interesting", "interestinger"], "answer": "A", "tag": "So sánh", "explain": "\"the ... I have ever read\" là so sánh nhất. Tính từ dài: the most + adj."}, {"q": "I wish I ___ how to swim.", "options": ["knew", "know", "will know", "have known"], "answer": "A", "tag": "Câu ước", "explain": "Ước điều trái với hiện tại: wish + S + V2/ed."}, {"q": "Hardly ___ the house when it started to rain.", "options": ["had I left", "I had left", "did I leave", "I left"], "answer": "A", "tag": "Đảo ngữ", "explain": "Đảo ngữ: Hardly + had + S + V3 + when + S + V2 = vừa mới... thì..."}, {"q": "The students stopped ___ when the teacher came in.", "options": ["talk", "to talk", "talking", "talked"], "answer": "C", "tag": "V-ing / to V", "explain": "stop + V-ing = ngừng làm việc đang làm. stop + to V = dừng lại để làm việc khác, không hợp nghĩa."}, {"q": "I had my car ___ at the garage yesterday.", "options": ["repairing", "to repair", "repaired", "repair"], "answer": "C", "tag": "Have sth done", "explain": "Thể nhờ bảo: have + vật + V3 (nhờ người khác sửa xe)."}, {"q": "The more you practise, ___ you will become.", "options": ["more confident", "the most confident", "the more confident", "most confident"], "answer": "C", "tag": "So sánh", "explain": "So sánh kép: The + so sánh hơn..., the + so sánh hơn... = càng... càng..."}]}, {"key": "x2b", "title": "Part B. Cloze (36–45)", "directions": "Directions: Read the passage and choose the best word (A, B, C or D) for each numbered blank.", "start": 36, "passageTitle": "From School to Work", "passage": ["Leaving school and starting work is one of the biggest changes in a young person's life. The (36) ___ from classroom to workplace is not always easy. At school, students are told exactly what to do and (37) ___ to do it. At work, however, they are expected to take (38) ___ for their own tasks.", "Many young workers say that the first few months were the most difficult. They had to get used (39) ___ working long hours, dealing with customers and following rules they did not always understand. (40) ___, most of them agree that the experience helped them grow up quickly.", "Employers also have an important role to (41) ___. A good company provides training and gives new staff a chance to ask questions (42) ___ feeling embarrassed. Some firms even give each new employee a 'mentor', an experienced colleague (43) ___ job is to offer advice and support.", "Experts advise school-leavers to be patient. It takes time to (44) ___ new skills, and nobody is expected to know everything on the first day. With the right attitude, the move from school to work can be an exciting (45) ___ of life."], "items": [{"q": "Chỗ trống (36)", "options": ["transfusion", "transition", "translation", "transmission"], "answer": "B", "tag": "Từ vựng", "explain": "transition = sự chuyển tiếp (từ A sang B). translation = bản dịch; transmission = sự truyền phát; transfusion = truyền máu."}, {"q": "Chỗ trống (37)", "options": ["when", "what", "who", "which"], "answer": "A", "tag": "Từ để hỏi", "explain": "\"what to do and when to do it\" = làm gì và khi nào làm. \"what\" đã dùng ở trước, lặp lại không hợp nghĩa."}, {"q": "Chỗ trống (38)", "options": ["charge", "control", "care", "responsibility"], "answer": "D", "tag": "Collocation", "explain": "take responsibility FOR = chịu trách nhiệm về. take charge OF, take care OF, take control OF không đi với \"for\"."}, {"q": "Chỗ trống (39)", "options": ["in", "to", "for", "with"], "answer": "B", "tag": "Giới từ", "explain": "get used TO + V-ing = dần quen với việc gì."}, {"q": "Chỗ trống (40)", "options": ["However", "Because", "Therefore", "Moreover"], "answer": "A", "tag": "Liên từ", "explain": "Câu trước nói khó khăn, câu sau nói trải nghiệm có ích, tức ý tương phản: However."}, {"q": "Chỗ trống (41)", "options": ["play", "take", "do", "make"], "answer": "A", "tag": "Collocation", "explain": "play a role = đóng vai trò. \"have a role to play\" là cách nói cố định."}, {"q": "Chỗ trống (42)", "options": ["despite", "unless", "without", "with"], "answer": "C", "tag": "Giới từ", "explain": "ask questions without feeling embarrassed = hỏi mà không thấy ngại."}, {"q": "Chỗ trống (43)", "options": ["who", "whose", "which", "whom"], "answer": "B", "tag": "Mệnh đề quan hệ", "explain": "whose job = công việc CỦA người đồng nghiệp đó (sở hữu)."}, {"q": "Chỗ trống (44)", "options": ["study", "know", "learn", "teach"], "answer": "C", "tag": "Collocation", "explain": "learn new skills = học kỹ năng mới. study thường đi với môn học; know là trạng thái, không phải quá trình."}, {"q": "Chỗ trống (45)", "options": ["level", "step", "stage", "degree"], "answer": "C", "tag": "Từ vựng", "explain": "a stage of life = một giai đoạn của cuộc đời."}]}, {"key": "x2c", "title": "Part C. Sentence transformation (46–50)", "directions": "Directions: Finish each sentence so that it means the same as the sentence before it.", "start": 46, "transform": [{"source": "Although he was very tired, he kept working.", "start": "Despite", "answers": ["Despite being very tired, he kept working.", "Despite his tiredness, he kept working.", "Despite the fact that he was very tired, he kept working."], "tag": "Liên từ", "explain": "Despite + V-ing / cụm danh từ / the fact that + S + V."}, {"source": "\"I will call you tomorrow,\" she said to me.", "start": "She told me", "answers": ["She told me that she would call me the next day.", "She told me she would call me the next day.", "She told me that she would call me the following day.", "She told me she would call me the following day."], "tag": "Câu gián tiếp", "explain": "Câu gián tiếp: will → would, I → she, you → me, tomorrow → the next day / the following day."}, {"source": "People say that he is a talented doctor.", "start": "He is said", "answers": ["He is said to be a talented doctor."], "tag": "Bị động", "explain": "Bị động với say/believe/think: S + is said + to V (cùng thì với động từ chính)."}, {"source": "I didn't study hard, so I failed the exam.", "start": "If I", "answers": ["If I had studied hard, I wouldn't have failed the exam.", "If I had studied hard, I would not have failed the exam.", "If I had studied harder, I wouldn't have failed the exam."], "tag": "Câu điều kiện", "explain": "Điều kiện loại 3 (trái với quá khứ): If + had + V3, S + would (not) have + V3. Đổi phủ định thành khẳng định và ngược lại."}, {"source": "It took me two hours to finish the report.", "start": "I spent", "answers": ["I spent two hours finishing the report.", "I spent two hours on the report.", "I spent two hours doing the report.", "I spent two hours writing the report."], "tag": "It takes / spend", "explain": "It takes sb + time + to V ⇔ S + spend + time + V-ing."}]}]}, {"title": "PAPER 3 – Listening", "points": 20, "parts": [{"key": "x3a", "title": "Part A. Short conversations (51–60)", "directions": "Directions: You will hear ten short conversations. Choose the best answer to each question.", "start": 51, "items": [{"q": "How will the man pay?", "options": ["By credit card.", "By bank transfer.", "In cash.", "By cheque."], "answer": "C", "tag": "Nghe", "explain": "Máy quẹt thẻ hỏng, chỉ nhận tiền mặt, và người đàn ông nói có tiền mặt.", "script": ["Man: Can I pay by credit card?", "Woman: I'm sorry, the card machine is broken today, so we can only take cash.", "Man: No problem, I have some cash with me."]}, {"q": "What time does the library close today?", "options": ["At 6 p.m.", "At 8 p.m.", "At 10 p.m.", "At 2 p.m."], "answer": "A", "tag": "Nghe", "explain": "Bình thường 8 giờ, hôm nay thứ Bảy đóng sớm 2 tiếng: 6 giờ tối. Bẫy: 8 giờ được nhắc tới đầu tiên.", "script": ["Woman: What time does the library close today?", "Man: Normally at eight in the evening, but it's Saturday, so it closes two hours earlier."]}, {"q": "Where will they have the picnic?", "options": ["By the lake.", "At the beach.", "In the park near the river.", "In a garden."], "answer": "C", "tag": "Nghe", "explain": "Người phụ nữ đề nghị đổi sang công viên gần sông và người đàn ông đồng ý.", "script": ["Man: Shall we have the picnic by the lake on Sunday?", "Woman: It's always too windy there. Let's go to the park near the river instead.", "Man: Good idea."]}, {"q": "What size will the woman try?", "options": ["36", "37", "38", "39"], "answer": "D", "tag": "Nghe", "explain": "\"the bigger ones\" = cỡ lớn hơn trong hai cỡ còn lại, tức 39.", "script": ["Woman: Do these shoes come in a size 38?", "Man: I'm afraid we've only got 37 and 39 left.", "Woman: Then I'll try the bigger ones."]}, {"q": "What does the woman's brother look like?", "options": ["He has short dark hair and a beard.", "He is bald and wears glasses.", "He is tall and wears glasses.", "He has long fair hair."], "answer": "A", "tag": "Nghe", "explain": "Người cao đeo kính là anh họ. Anh trai có tóc ngắn sẫm màu và râu.", "script": ["Man: Is your brother the tall man with glasses?", "Woman: No, that's my cousin. My brother is the one with short dark hair and a beard."]}, {"q": "What time should they be at the station?", "options": ["At 8:15.", "At 8:45.", "At 9:15.", "At 9:45."], "answer": "B", "tag": "Nghe", "explain": "\"a quarter to nine\" = 8 giờ 45. Bẫy: 9:15 là giờ tàu chạy.", "script": ["Woman: Our train to Da Lat leaves at nine fifteen.", "Man: Then we should be at the station by a quarter to n
