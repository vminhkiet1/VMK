ine to buy the tickets."]}, {"q": "What did the woman do at the weekend?", "options": ["She visited friends.", "She went hiking.", "She stayed at home and read.", "She went shopping."], "answer": "C", "tag": "Nghe", "explain": "\"meant to go hiking\" = định đi nhưng không đi. \"stayed in and caught up on some reading\" = ở nhà đọc sách.", "script": ["Man: How was your weekend?", "Woman: I meant to go hiking, but it rained the whole time, so I just stayed in and caught up on some reading."]}, {"q": "How much will the woman pay?", "options": ["240,000 dong.", "300,000 dong.", "360,000 dong.", "180,000 dong."], "answer": "B", "tag": "Nghe", "explain": "2 × 120.000 + 60.000 (nửa giá) = 300.000 đồng.", "script": ["Woman: How much are the tickets?", "Man: Adults are one hundred and twenty thousand dong, and children pay half price.", "Woman: Two adults and one child, please."]}, {"q": "Why can't the woman attend the meeting?", "options": ["She is ill.", "She has to pick up her daughter.", "She is on holiday.", "She has another meeting."], "answer": "B", "tag": "Nghe", "explain": "Cô ấy phải đón con gái ở trường.", "script": ["Man: Are you coming to the meeting this afternoon?", "Woman: I can't, I'm afraid. I have to pick up my daughter from school. But I'll read the notes later."]}, {"q": "What does the man suggest?", "options": ["Drinking less coffee and sleeping earlier.", "Taking a holiday.", "Seeing a doctor.", "Drinking more coffee."], "answer": "A", "tag": "Nghe", "explain": "\"cut down on coffee\" = uống ít cà phê lại; \"go to bed earlier\" = ngủ sớm hơn.", "script": ["Woman: I've been feeling really tired all week.", "Man: Maybe you should cut down on coffee and go to bed a bit earlier."]}]}, {"key": "x3b", "title": "Part B. Long conversation (61–65)", "directions": "You will hear a conversation between two friends, Minh and Lan, about Lan's master's degree.", "start": 61, "script": ["Minh: Hi Lan! I heard you've just finished your master's degree. Congratulations!", "Lan: Thanks, Minh. It took me two and a half years, because I was working full-time at the same time.", "Minh: That must have been hard. When did you have classes?", "Lan: Mostly in the evenings, from six to nine, and on Saturday mornings. Sunday was the only day I could rest.", "Minh: What was the most difficult part?", "Lan: Definitely the thesis. Collecting the data took me almost six months, and my supervisor asked me to rewrite one chapter three times.", "Minh: Wow. Was English a problem for you?", "Lan: At first, yes. Most of the articles I had to read were in English. But after about a year, reading them became much easier. I think my vocabulary improved a lot.", "Minh: Would you recommend the programme to other people?", "Lan: Yes, but only if they are well organised. My advice is to plan your time carefully and not leave everything until the last minute."], "items": [{"q": "How long did Lan's master's programme take?", "options": ["Two and a half years.", "Three years.", "Two years.", "One year."], "answer": "A", "tag": "Nghe", "explain": "\"It took me two and a half years\"."}, {"q": "When did Lan usually have classes?", "options": ["On weekday mornings.", "Only on Sundays.", "Every afternoon.", "In the evenings and on Saturday mornings."], "answer": "D", "tag": "Nghe", "explain": "Buổi tối 6–9 giờ và sáng thứ Bảy. Chủ nhật là ngày nghỉ."}, {"q": "What was the most difficult part of the programme for Lan?", "options": ["The exams.", "The thesis.", "English classes.", "Group projects."], "answer": "B", "tag": "Nghe", "explain": "\"Definitely the thesis\" = chắc chắn là luận văn."}, {"q": "How did Lan's English change during the programme?", "options": ["It did not improve.", "She took a speaking course.", "Reading English articles became easier.", "She stopped reading in English."], "answer": "C", "tag": "Nghe", "explain": "Sau khoảng một năm, đọc bài báo tiếng Anh dễ hơn nhiều và vốn từ tăng."}, {"q": "What is Lan's advice?", "options": ["Choose an easy topic.", "Study abroad.", "Plan your time carefully.", "Don't work full-time."], "answer": "C", "tag": "Nghe", "explain": "\"plan your time carefully and not leave everything until the last minute\"."}]}, {"key": "x3c", "title": "Part C. Talk (66–70)", "directions": "You will hear a talk given to new postgraduate students at a university library.", "start": 66, "script": ["Speaker: Good morning, everyone, and welcome to the university library. My name is Hoa, and I'm going to give you some information about our services. The library is open from half past seven in the morning until nine in the evening, Monday to Friday, and from eight until five on Saturdays. We are closed on Sundays and public holidays. Postgraduate students can borrow up to ten books at a time, for three weeks. If you return a book late, you will have to pay a fine of five thousand dong for each day. On the second floor you will find quiet study rooms, which can be booked online for a maximum of three hours. Please remember that food is not allowed anywhere in the library, although you may bring water in a bottle with a lid. Finally, our staff run free workshops every Wednesday afternoon on how to search for academic articles. I strongly recommend that you attend at least one. Thank you, and enjoy your studies."], "items": [{"q": "What time does the library close on weekdays?", "options": ["At 5 p.m.", "At 7:30 p.m.", "At 9 p.m.", "At 9:30 p.m."], "answer": "C", "tag": "Nghe", "explain": "Thứ Hai–thứ Sáu mở từ 7:30 sáng tới 9 giờ tối. 5 giờ chiều là giờ đóng cửa thứ Bảy."}, {"q": "How many books can postgraduate students borrow at a time?", "options": ["Three.", "Ten.", "Twenty.", "Five."], "answer": "B", "tag": "Nghe", "explain": "\"up to ten books at a time\". Bẫy: \"three\" là số tuần được mượn."}, {"q": "What happens if a book is returned late?", "options": ["The student cannot borrow books again.", "The library cancels the student card.", "The student pays 50,000 dong.", "The student pays 5,000 dong per day."], "answer": "D", "tag": "Nghe", "explain": "\"a fine of five thousand dong for each day\"."}, {"q": "What are students allowed to bring into the library?", "options": ["Fruit.", "Hot drinks.", "Water in a bottle with a lid.", "Snacks."], "answer": "C", "tag": "Nghe", "explain": "Không được mang đồ ăn, nhưng được mang nước trong chai có nắp."}, {"q": "What happens every Wednesday afternoon?", "options": ["There are free workshops on finding academic articles.", "New books arrive.", "The study rooms are cleaned.", "The library closes early."], "answer": "A", "tag": "Nghe", "explain": "Nhân viên tổ chức workshop miễn phí về cách tìm bài báo học thuật."}]}]}], "speaking": {"intro": "Please introduce yourself.", "topic": "The advantages of knowing a foreign language", "questions": ["How long have you been learning English?", "What is the most difficult part of learning English for you?", "Do you think children should learn a foreign language at a young age?", "Besides English, which language would you like to learn?"]}}}, "3": {"day": 3, "grammarTopic": "Câu điều kiện + unless + câu ước", "vocabTopic": "Từ dễ nhầm", "speakingTopic": "Gia đình + Sở thích", "plan": [{"time": "0:00 – 0:15", "step": "Bài học ngữ pháp", "content": "Câu điều kiện loại 0–1–2–3, unless, câu ước; 4 mẫu viết lại câu"}, {"time": "0:15 – 0:40", "step": "Bài tập ngữ pháp", "content": "10 câu Sentence completion + 5 câu viết lại (if↔unless, wish, It takes↔spend)"}, {"time": "0:40 – 0:55", "step": "Luyện thêm", "content": "Ôn thì (có/không có been) + where/which: 10 câu + 3 câu viết lại"}, {"time": "0:55 – 1:05", "step": "Nghỉ", "content": ""}, {"time": "1:05 – 1:35", "step": "Từ vựng", "content": "10 cặp từ dễ nhầm (20 từ), đọc to ví dụ"}, {"time": "1:35 – 1:50", "step": "Bài tập từ vựng", "content": "10 câu dạng Paper 1 Part A"}, {"time": "1:50 – 2:00", "step": "Nghỉ", "content": ""}, {"time": "2:00 – 2:30", "step": "Luyện đọc", "content": "1 bài ~250 từ + 5 câu, bấm giờ 12 phút, học 8 từ mới"}, {"time": "2:30 – 3:20", "step": "Luyện nói", "content": "2 chủ đề: Gia đình + Sở thích, 6 câu, có câu dùng điều kiện loại 2"}, {"time": "3:20 – 3:30", "step": "Nghỉ", "content": ""}, {"time": "3:30 – 4:00", "step": "Tổng kết", "content": "Xem lỗi sai theo chủ điểm + quiz 10 câu"}], "grammar": {"sections": [{"title": "Câu điều kiện: nhìn mệnh đề chính để chọn loại", "headers": ["Loại", "Dùng khi", "Mệnh đề If", "Mệnh đề chính", "Ví dụ"], "rows": [["0", "sự thật, quy luật", "If + hiện tại đơn", "hiện tại đơn", "If you heat ice, it melts."], ["1", "có thể xảy ra (hiện tại / tương lai)", "If + hiện tại đơn", "will / can + V", "If it rains, I will stay at home."], ["2", "không có thật ở HIỆN TẠI", "If + V2 / were", "would / could + V", "If I were you, I would study harder."], ["3", "không có thật trong QUÁ KHỨ", "If + had + V3", "would / could have + V3", "If I had studied, I would have passed."]]}, {"title": "Câu ước", "headers": ["Ước về", "Công thức", "Ví dụ (thực tế)"], "rows": [["Hiện tại", "S + wish + S + V2 / were", "I wish I had a car. (thực tế: không có xe)"], ["Quá khứ", "S + wish + S + had + V3", "I wish I had gone to the party. (thực tế: đã không đi)"], ["Muốn ai / cái gì thay đổi", "S + wish + S + would + V", "I wish it would stop raining."]]}, {"title": "4 mẫu viết lại câu hay ra", "headers": ["Câu gốc", "Viết lại", "Mẹo"], "rows": [["If you don't hurry, you will be late.", "Unless you hurry, you will be late.", "unless = if … not → BỎ not."], ["I don't have time, so I can't help you.", "If I had time, I could help you.", "Thật ở hiện tại → loại 2: lùi 1 thì và đổi phủ định ↔ khẳng định."], ["She didn't study, so she failed.", "If she had studied, she wouldn't have failed.", "Thật ở quá khứ → loại 3: had V3 / would have V3, đổi phủ định ↔ khẳng định."], ["I'm sorry I didn't call her. / It's a pity I can't swim.", "I wish I had called her. / I wish I could swim.", "Tiếc về quá khứ → wish + had V3. Tiếc ở hiện tại → wish + V2 / could."]]}], "notes": ["Mẹo \"lùi 1 thì\": thực tế ở hiện tại → dùng V2; thực tế ở quá khứ → dùng had + V3. Luôn đổi khẳng định ↔ phủ định.", "Loại 2 và câu ước dùng were cho mọi ngôi: If I were…, I wish she were…", "Nhìn mệnh đề chính để biết loại: will → loại 1; would + V → loại 2; would have + V3 → loại 3.", "It takes + sb + thời gian + to V ⇔ S + spend(s) + thời gian + V-ing. Giữ đúng thì: It took → spent.", "as long as / provided that = miễn là (nghĩa giống if)."], "traps": [{"title": "Dùng will trong mệnh đề if", "wrong": "If it will rain tomorrow, we will stay at home.", "right": "If it rains tomorrow, we will stay at home.", "why": "Mệnh đề if (cũng như when, before…) không dùng will; dùng hiện tại đơn."}, {"title": "Unless + not", "wrong": "Unless you don't study, you will fail.", "right": "Unless you study, you will fail.", "why": "Unless đã có nghĩa phủ định (= if not). Thêm not sẽ thành phủ định 2 lần."}, {"title": "Đặt would have ở cả hai vế", "wrong": "If I would have known, I would have helped.", "right": "If I had known, I would have helped.", "why": "Vế if của loại 3 luôn là had + V3. would chỉ ở vế còn lại."}]}, "grammarMcq": [{"q": "If it ___ tomorrow, we will cancel the picnic.", "options": ["rains", "will rain", "rained", "would rain"], "answer": "A", "tag": "Câu điều kiện", "explain": "Vế chính có will → loại 1 → vế if dùng hiện tại đơn. Không dùng will sau if."}, {"q": "If I ___ you, I would accept the job offer.", "options": ["am", "was being", "were", "had been"], "answer": "C", "tag": "Câu điều kiện", "explain": "Vế chính có would + V → loại 2 → If I were (dùng were cho mọi ngôi)."}, {"q": "If she had left earlier, she ___ the train.", "options": ["would catch", "would have caught", "will catch", "had caught"], "answer": "B", "tag": "Câu điều kiện", "explain": "Vế if có had + V3 → loại 3 → would have + V3."}, {"q": "___ you study harder, you won't pass the exam.", "options": ["If", "When", "Although", "Unless"], "answer": "D", "tag": "Unless", "explain": "Nghĩa: NẾU KHÔNG học chăm hơn thì sẽ trượt → Unless (= if … not)."}, {"q": "I wish I ___ a bigger flat. Mine is too small for my family.", "options": ["had", "have", "will have", "having"], "answer": "A", "tag": "Câu ước", "explain": "Thực tế hiện tại: căn hộ nhỏ → ước trái hiện tại: wish + V2 → had."}, {"q": "If you heat water to 100°C, it ___.", "options": ["would boil", "boiled", "will be boiling", "boils"], "answer": "D", "tag": "Câu điều kiện", "explain": "Sự thật khoa học → loại 0: hiện tại đơn ở cả 2 vế."}, {"q": "What would you do if you ___ a lot of money?", "options": ["win", "will win", "won", "had won"], "answer": "C", "tag": "Câu điều kiện", "explain": "Vế chính would + V → loại 2 → vế if dùng V2: won."}, {"q": "I wish I ___ to the party last night. Everyone said it was great.", "options": ["went", "had gone", "would go", "have gone"], "answer": "B", "tag": "Câu ước", "explain": "last night → tiếc về quá khứ → wish + had + V3."}, {"q": "If I had known about the meeting, I ___ it.", "options": ["would attend", "will attend", "attended", "would have attended"], "answer": "D", "tag": "Câu điều kiện", "explain": "Vế if had + V3 → loại 3 → would have + V3."}, {"q": "You can borrow my laptop ___ you promise to take care of it.", "options": ["as long as", "unless", "although", "despite"], "answer": "A", "tag": "Câu điều kiện", "explain": "as long as = miễn là (điều kiện). unless = nếu không, sai nghĩa."}], "transform": [{"source": "If you don't hurry, you will miss the bus.", "start": "Unless", "answers": ["Unless you hurry, you will miss the bus."], "tag": "Unless", "explain": "If … don't → Unless + khẳng định. Bỏ don't."}, {"source": "I don't have a car, so I can't drive to work.", "start": "If I", "answers": ["If I had a car, I could drive to work.", "If I had a car, I would be able to drive to work.", "If I had a car, I would drive to work."], "tag": "Câu điều kiện", "explain": "Thực tế hiện tại → loại 2: don't have → had; can't → could (đổi phủ định thành khẳng định)."}, {"source": "I'm sorry I didn't study harder.", "start": "I wish", "answers": ["I wish I had studied harder."], "tag": "Câu ước", "explain": "Tiếc về quá khứ (didn't study) → wish + had + V3, đổi phủ định thành khẳng định."}, {"source": "It takes me 30 minutes to get to work.", "start": "I spend", "answers": ["I spend 30 minutes getting to work.", "I spend thirty minutes getting to work."], "tag": "It takes / spend", "explain": "It takes sb + time + to V ⇔ S + spend + time + V-ing. Hiện tại → spend (không phải spent)."}, {"source": "She didn't take the medicine, so she didn't get better.", "start": "If she", "answers": ["If she had taken the medicine, she would have got better.", "If she had taken the medicine, she would have gotten better."], "tag": "Câu điều kiện", "explain": "Thực tế quá khứ → loại 3: had + V3, would have + V3, đổi cả 2 vế sang khẳng định."}], "extra": {"title": "Luyện thêm: thì + where / which", "note": "Ôn tiếp 2 lỗi lặp lại (mốc quá khứ → không dùng have; câu chủ động → không có been) và lỗi where/which của ngày 2. Mẹo where/which: sau chỗ trống có S + V ĐỦ nghĩa → where; S + V còn THIẾU tân ngữ, hoặc ngay sau là động từ → which.", "sets": [{"key": "mixFix", "title": "Thì + mệnh đề quan hệ", "items": [{"q": "We ___ three units of the book so far.", "options": ["finished", "had finished", "have finished", "have been finished"], "answer": "C", "tag": "Hiện tại hoàn thành", "explain": "so far → have + V3. Người tự làm → không có been."}, {"q": "They ___ married in 2015.", "options": ["got", "have got", "had got", "have been got"], "answer": "A", "tag": "Quá khứ đơn", "explain": "in 2015 → mốc quá khứ → quá khứ đơn."}, {"q": "The new library ___ by the mayor last month.", "options": ["has opened", "has been opened", "opened", "was opened"], "answer": "D", "tag": "Bị động", "explain": "Vật + by the mayor → bị động; last month → quá khứ: was opened. has been opened sai vì có last month."}, {"q": "I ___ English for six years, but I still find speaking difficult.", "options": ["learned", "have learned", "had learned", "have been learned"], "answer": "B", "tag": "Hiện tại hoàn thành", "explain": "for six years và vẫn đang học → have + V3. have been learned là bị động, sai."}, {"q": "When I got home, I realised I ___ my phone at the office.", "options": ["have left", "had left", "left", "was leaving"], "answer": "B", "tag": "Quá khứ hoàn thành", "explain": "Mốc: lúc về nhà (quá khứ). Để quên điện thoại xảy ra trước đó → had left."}, {"q": "She ___ in Da Nang when she was a student.", "options": ["lived", "has lived", "has been lived", "had been living"], "answer": "A", "tag": "Quá khứ đơn", "explain": "when she was a student → giai đoạn đã qua → quá khứ đơn."}, {"q": "Many trees ___ in our town since last year.", "options": ["have planted", "planted", "have been planted", "were planting"], "answer": "C", "tag": "Bị động", "explain": "Cây không tự trồng → bị động; since last year → hiện tại hoàn thành: have been planted. Đây là lúc been đúng."}, {"q": "He ___ to work by motorbike every day last year.", "options": ["has gone", "had gone", "has been going", "went"], "answer": "D", "tag": "Quá khứ đơn", "explain": "last year → quá khứ đơn, dù là thói quen (every day)."}, {"q": "Da Lat, ___ is famous for its flowers, attracts many tourists.", "options": ["which", "where", "that", "who"], "answer": "A", "tag": "Mệnh đề quan hệ", "explain": "Ngay sau là động từ (is) → which làm chủ ngữ. where cần S + V phía sau. Có dấu phẩy → không dùng that."}, {"q": "This is the café ___ I often meet my friends.", "options": ["which", "that", "where", "whom"], "answer": "C", "tag": "Mệnh đề quan hệ", "explain": "I often meet my friends đã đủ S + V + tân ngữ → where (= at which)."}]}], "transform": [{"source": "I last saw my cousin in 2022.", "start": "I haven't", "answers": ["I haven't seen my cousin since 2022."], "tag": "Hiện tại hoàn thành", "explain": "last + V2 + in 2022 → haven't + V3 + since 2022. Không có been, bỏ last."}, {"source": "They have repaired the road.", "start": "The road", "answers": ["The road has been repaired.", "The road has been repaired by them."], "tag": "Bị động", "explain": "Chủ ngữ là vật → bị động hiện tại hoàn thành: has been + V3. Ở đây been là đúng."}, {"source": "My brother started working in Hanoi two years ago.", "start": "My brother has", "answers": ["My brother has worked in Hanoi for two years.", "My brother has been working in Hanoi for two years."], "tag": "Hiện tại hoàn thành", "explain": "started … ago → has + V3 (hoặc has been + V-ing) + for. Không viết has been worked."}]}, "vocab": [{"phrase": "rise", "pos": "v. (không tân ngữ)", "ipa": "/raɪz/", "meaning": "tăng, mọc lên (tự nó)", "colloc": "prices rise / the sun rises (rise – rose – risen)", "example": "Prices have risen by 10% this year."}, {"phrase": "raise", "pos": "v. (có tân ngữ)", "ipa": "/reɪz/", "meaning": "nâng, tăng (cái gì)", "colloc": "raise prices / your hand / money", "example": "Raise your hand if you know the answer."}, {"phrase": "say", "pos": "v.", "ipa": "/seɪ/", "meaning": "nói (cái gì)", "colloc": "say something / say that… / say to sb", "example": "She said that she was tired."}, {"phrase": "tell", "pos": "v.", "ipa": "/tel/", "meaning": "kể, bảo (AI đó)", "colloc": "tell sb sth / tell a story / tell the truth", "example": "He told me a funny story."}, {"phrase": "borrow", "pos": "v.", "ipa": "/ˈbɒrəʊ/", "meaning": "mượn (từ ai)", "colloc": "borrow sth from sb", "example": "Can I borrow your pen?"}, {"phrase": "lend", "pos": "v.", "ipa": "/lend/", "meaning": "cho mượn", "colloc": "lend sb sth / lend sth to sb", "example": "Could you lend me 50,000 dong?"}, {"phrase": "affect", "pos": "v.", "ipa": "/əˈfekt/", "meaning": "ảnh hưởng tới", "colloc": "affect health / affect sb", "example": "Stress can affect your sleep."}, {"phrase": "effect", "pos": "n.", "ipa": "/ɪˈfekt/", "meaning": "sự ảnh hưởng, tác động", "colloc": "have an effect on / side effects", "example": "Coffee has a strong effect on me."}, {"phrase": "economic", "pos": "adj.", "ipa": "/ˌiːkəˈnɒmɪk/", "meaning": "thuộc về kinh tế", "colloc": "economic growth / crisis", "example": "The country's economic growth is fast."}, {"phrase": "economical", "pos": "adj.", "ipa": "/ˌiːkəˈnɒmɪkl/", "meaning": "tiết kiệm", "colloc": "an economical car / economical with money", "example": "This car is very economical: it uses little petrol."}, {"phrase": "sensible", "pos": "adj.", "ipa": "/ˈsensəbl/", "meaning": "hợp lý, khôn ngoan", "colloc": "a sensible decision / idea", "example": "It was sensible to bring an umbrella."}, {"phrase": "sensitive", "pos": "adj.", "ipa": "/ˈsensətɪv/", "meaning": "nhạy cảm", "colloc": "sensitive skin / sensitive to criticism", "example": "She is very sensitive to criticism."}, {"phrase": "remember", "pos": "v.", "ipa": "/rɪˈmembə(r)/", "meaning": "nhớ (tự mình)", "colloc": "remember to V (nhớ phải làm) / remember V-ing (nhớ đã làm)", "example": "Remember to lock the door."}, {"phrase": "remind", "pos": "v.", "ipa": "/rɪˈmaɪnd/", "meaning": "nhắc (ai) nhớ", "colloc": "remind sb to do sth / remind sb of sth", "example": "Please remind me to call my mother."}, {"phrase": "rob", "pos": "v.", "ipa": "/rɒb/", "meaning": "cướp (người, ngân hàng, cửa hàng)", "colloc": "rob a bank / rob sb of sth", "example": "Two men robbed the bank."}, {"phrase": "steal", "pos": "v.", "ipa": "/stiːl/", "meaning": "lấy cắp (đồ vật)", "colloc": "steal money / steal sth from sb (steal – stole – stolen)", "example": "Someone stole my wallet."}, {"phrase": "lose", "pos": "v.", "ipa": "/luːz/", "meaning": "đánh mất; thua", "colloc": "lose your keys / lose a match / lose weight", "example": "I lost my phone on the bus."}, {"phrase": "miss", "pos": "v.", "ipa": "/mɪs/", "meaning": "lỡ; nhớ (ai)", "colloc": "miss the bus / miss a chance / miss sb", "example": "Hurry up or you'll miss the train."}, {"phrase": "alone", "pos": "adj./adv.", "ipa": "/əˈləʊn/", "meaning": "một mình (chỉ trạng thái)", "colloc": "live alone / be alone", "example": "My grandmother lives alone."}, {"phrase": "lonely", "pos": "adj.", "ipa": "/ˈləʊnli/", "meaning": "cô đơn (cảm xúc buồn)", "colloc": "feel lonely", "example": "She felt lonely in the new city."}], "vocabMcq": [{"q": "The price of petrol has ___ again this month.", "options": ["raised", "risen", "rose", "arisen"], "answer": "B", "tag": "Từ dễ nhầm", "explain": "Giá tự tăng, không có tân ngữ → rise; sau has → V3: risen. raise cần tân ngữ (raise prices)."}, {"q": "Could you ___ me your dictionary for a few minutes?", "options": ["lend", "borrow", "give back", "take"], "answer": "A", "tag": "Từ dễ nhầm", "explain": "lend sb sth = cho ai mượn. borrow = mình đi mượn (borrow sth from sb)."}, {"q": "My teacher ___ me that I should practise speaking every day.", "options": ["said", "spoke", "told", "talked"], "answer": "C", "tag": "Từ dễ nhầm", "explain": "tell + NGƯỜI (told me). say không đi trực tiếp với người (said to me)."}, {"q": "Smoking can seriously ___ your health.", "options": ["effect", "effort", "infect", "affect"], "answer": "D", "tag": "Từ dễ nhầm", "explain": "Cần ĐỘNG từ sau can → affect. effect là danh từ (have an effect on)."}, {"q": "This car is very ___; it doesn't use much petrol.", "options": ["economic", "economy", "economical", "economist"], "answer": "C", "tag": "Từ dễ nhầm", "explain": "economical = tiết kiệm. economic = thuộc về kinh tế."}, {"q": "Please ___ me to buy some milk on the way home.", "options": ["remind", "remember", "memorise", "recall"], "answer": "A", "tag": "Từ dễ nhầm", "explain": "remind sb to do sth = nhắc ai làm gì. remember không có tân ngữ chỉ người theo sau kiểu này."}, {"q": "Two men ___ the bank and escaped with a lot of money.", "options": ["stole", "took", "lost", "robbed"], "answer": "D", "tag": "Từ dễ nhầm", "explain": "rob + nơi chốn/người (rob a bank). steal + đồ vật (steal money)."}, {"q": "Hurry up, or we will ___ the last bus.", "options": ["lose", "miss", "fail", "leave"], "answer": "B", "tag": "Từ dễ nhầm", "explain": "miss the bus = lỡ xe. lose = đánh mất đồ / thua."}, {"q": "She lives ___, but she never feels lonely because she has many friends.", "options": ["alone", "lonely", "lone", "only"], "answer": "A", "tag": "Từ dễ nhầm", "explain": "live alone = sống một mình (trạng thái). lonely = cảm thấy cô đơn."}, {"q": "It was very ___ of you to bring a raincoat; it's going to rain.", "options": ["sensitive", "sense", "sensible", "sensational"], "answer": "C", "tag": "Từ dễ nhầm", "explain": "sensible = khôn ngoan, hợp lý. sensitive = nhạy cảm."}], "reading": {"title": "Volunteering: Good for Others, Good for You", "minutes": 12, "paragraphs": ["Every year, millions of people around the world give their time to help others without being paid. They clean beaches, teach children, cook meals for the homeless or visit elderly people who live alone. This kind of unpaid work is called volunteering.", "Most volunteers say they started because they wanted to help their community. However, research shows that volunteering also brings many benefits to the volunteers themselves. People who volunteer regularly often feel happier and less stressed. Some studies have even found that older volunteers tend to live longer than people of the same age who do not volunteer.", "Volunteering can also be useful for young people who are looking for a job. It gives them a chance to develop skills such as teamwork, communication and problem-solving. Many employers say that they are more interested in candidates who have done voluntary work, because it shows that they are responsible and willing to learn.", "Of course, volunteering is not always easy. Some volunteers find it hard to balance their volunteer work with their studies or their job. Others feel disappointed when they cannot see the results of their work immediately. Experts suggest that new volunteers should start with just a few hours a month and choose an activity they really enjoy.", "If more people gave just a little of their free time, many communities would become stronger and kinder places to live."], "questions": [{"q": "What is the passage mainly about?", "type": "Main idea", "options": ["How to find a job", "Problems of elderly people", "The benefits and challenges of volunteering", "Cleaning beaches"], "answer": "C", "tag": "Đọc: ý chính", "explain": "Đoạn 2–3 nêu lợi ích, đoạn 4 nêu khó khăn. A, B, D chỉ là chi tiết nhỏ.", "evidence": "volunteering also brings many benefits to the volunteers themselves … volunteering is not always easy"}, {"q": "According to paragraph 2, people who volunteer regularly ___.", "type": "Chi tiết", "options": ["often feel happier and less stressed", "earn more money", "have more free time", "always live in big cities"], "answer": "A", "tag": "Đọc: chi tiết", "explain": "Đoạn 2 nói rõ họ vui hơn và ít căng thẳng hơn.", "evidence": "People who volunteer regularly often feel happier and less stressed"}, {"q": "The word 'it' in \"because it shows that they are responsible\" (paragraph 3) refers to ___.", "type": "Từ quy chiếu", "options": ["a job", "teamwork", "communication", "voluntary work"], "answer": "D", "tag": "Đọc: từ quy chiếu", "explain": "Đọc ngay phía trước: candidates who have done voluntary work, because it shows… → it = voluntary work. Thay vào: \"voluntary work shows that they are responsible\" hợp nghĩa.", "evidence": "candidates who have done voluntary work, because it shows that they are responsible"}, {"q": "Which skill is NOT mentioned in paragraph 3?", "type": "NOT mentioned", "options": ["teamwork", "leadership", "communication", "problem-solving"], "answer": "B", "tag": "Đọc: NOT mentioned", "explain": "Đoạn 3 kể teamwork, communication, problem-solving. Không có leadership.", "evidence": "skills such as teamwork, communication and problem-solving"}, {"q": "The word 'disappointed' in paragraph 4 is closest in meaning to ___.", "type": "Từ đồng nghĩa", "options": ["unhappy", "excited", "surprised", "tired"], "answer": "A", "tag": "Đọc: từ đồng nghĩa", "explain": "disappointed = thất vọng, gần nghĩa unhappy nhất. Ngữ cảnh: không thấy kết quả ngay → buồn.", "evidence": "Others feel disappointed when they cannot see the results of their work immediately"}], "newWords": [{"word": "volunteer", "pos": "n./v.", "ipa": "/ˌvɒlənˈtɪə(r)/", "meaning": "tình nguyện viên; làm tình nguyện"}, {"word": "community", "pos": "n.", "ipa": "/kəˈmjuːnəti/", "meaning": "cộng đồng"}, {"word": "benefit", "pos": "n.", "ipa": "/ˈbenɪfɪt/", "meaning": "lợi ích"}, {"word": "regularly", "pos": "adv.", "ipa": "/ˈreɡjələli/", "meaning": "thường xuyên, đều đặn"}, {"word": "candidate", "pos": "n.", "ipa": "/ˈkændɪdət/", "meaning": "ứng viên"}, {"word": "willing", "pos": "adj.", "ipa": "/ˈwɪlɪŋ/", "meaning": "sẵn lòng (willing to V)"}, {"word": "balance", "pos": "v./n.", "ipa": "/ˈbæləns/", "meaning": "cân bằng (balance A with B)"}, {"word": "disappointed", "pos": "adj.", "ipa": "/ˌdɪsəˈpɔɪntɪd/", "meaning": "thất vọng"}]}, "speaking": {"introTitle": "Bài mẫu: Your family (khoảng 1 phút, điền chỗ trống)", "intro": ["There are ___ people in my family: my ___, my ___ and me.", "My father is a ___ and my mother works as a ___.", "I'm closest to my ___ because ___.", "We usually ___ together at the weekend.", "If I had more free time, I would ___ with my family more often.", "I wish I could ___."], "frame": "Ý chính → Lý do (because…) → Ví dụ (For example…)", "rescue": ["That's an interesting question. Let me think…", "Could you repeat the question, please?", "I'm not sure, but I think…", "What I mean is…"], "questions": [{"q": "Can you tell me about your family?", "hint": "Số người, mỗi người làm gì. There are four people in my family…"}, {"q": "Who are you closest to in your family? Why?", "hint": "Ý chính → because… → For example, when I was…, she…"}, {"q": "If you could change one thing about your family life, what would it be?", "hint": "Điều kiện loại 2: If I could…, I would… Ví dụ: spend more time with my parents."}, {"q": "What do you usually do in your free time?", "hint": "Hiện tại đơn + usually / often. 1 sở thích → vì sao thích → ví dụ."}, {"q": "What hobby did you have as a child? Do you still do it?", "hint": "Quá khứ đơn cho hồi nhỏ (I played…). Tới bây giờ: I have played it for… / I gave it up when… Câu chủ động: không có been."}, {"q": "If you had more free time, what would you do?", "hint": "If I had more free time, I would… because… Có thể dùng I wish I had more time to…"}], "rubric": ["Trôi chảy (ít ngập ngừng, nói đủ ý)", "Ngữ pháp (thì đúng, câu điều kiện, câu ước)", "Từ vựng (đúng chủ đề, dùng đúng các cặp từ dễ nhầm)", "Phát âm (âm cuối -s, -ed, trọng âm)", "Nội dung (trả lời đúng câu hỏi, có lý do và ví dụ)"]}, "reviewQuiz": [{"q": "If I ___ rich, I would travel around the world.", "options": ["am", "will be", "have been", "were"], "answer": "D", "tag": "Câu điều kiện", "explain": "would + V → loại 2 → If I were."}, {"q": "Unless it ___, we will go to the beach.", "options": ["will rain", "rains", "doesn't rain", "rained"], "answer": "B", "tag": "Unless", "explain": "Unless + khẳng định, hiện tại đơn. Không dùng will, không thêm not."}, {"q": "I wish I ___ harder when I was at school.", "options": ["had studied", "studied", "study", "would study"], "answer": "A", "tag": "Câu ước", "explain": "Tiếc về quá khứ (when I was at school) → wish + had + V3."}, {"q": "He ___ me a funny story about his trip.", "options": ["said", "spoke", "told", "talked"], "answer": "C", "tag": "Từ dễ nhầm", "explain": "tell sb a story."}, {"q": "Can I ___ your umbrella? I'll give it back tomorrow.", "options": ["borrow", "lend", "rent", "keep"], "answer": "A", "tag": "Từ dễ nhầm", "explain": "Mình đi mượn → borrow."}, {"q": "The town ___ I grew up has changed a lot.", "options": ["which", "who", "whose", "where"], "answer": "D", "tag": "Mệnh đề quan hệ", "explain": "I grew up đã đủ nghĩa (không thiếu tân ngữ) → where."}, {"q": "She ___ in this company since 2019.", "options": ["works", "has worked", "worked", "has been worked"], "answer": "B", "tag": "Hiện tại hoàn thành", "explain": "since 2019 → has + V3. Chủ động → không có been."}, {"q": "If he had taken a taxi, he ___ late.", "options": ["wouldn't be", "won't be", "wouldn't have been", "hadn't been"], "answer": "C", "tag": "Câu điều kiện", "explain": "had + V3 → loại 3 → wouldn't have + V3."}, {"q": "Don't forget to ___ your hand if you have a question.", "options": ["raise", "rise", "arise", "rose"], "answer": "A", "tag": "Từ dễ nhầm", "explain": "Có tân ngữ (your hand) → raise."}, {"q": "I ___ my phone yesterday, so I couldn't call you.", "options": ["have lost", "had lost", "have been lost", "lost"], "answer": "D", "tag": "Quá khứ đơn", "explain": "yesterday → quá khứ đơn."}]}, "4": {"day": 4, "grammarTopic": "V-ing / to V + so sánh", "vocabTopic": "Phrasal verb nhóm 2 + giới từ", "speakingTopic": "Công việc", "plan": [{"time": "0:00 – 0:15", "step": "Bài học ngữ pháp", "content": "V-ing / to V / V nguyên mẫu, so sánh hơn – nhất – bằng – kép, viết lại câu so sánh"}, {"time": "0:15 – 0:35", "step": "Bài tập ngữ pháp", "content": "10 câu Sentence completion + 5 câu viết lại"}, {"time": "0:35 – 0:50", "step": "Luyện thêm", "content": "10 câu + 2 câu viết lại: thì, where/which, câu điều kiện"}, {"time": "0:50 – 1:00", "step": "Nghỉ", "content": ""}, {"time": "1:00 – 2:30", "step": "Thi thử 1: Paper 1 + 2", "content": "50 câu trong 90 phút, không xem tài liệu"}, {"time": "2:30 – 2:50", "step": "Thi thử 1: Paper 3", "content": "Nghe 20 câu, mỗi đoạn phát 2 lần"}, {"time": "2:50 – 3:00", "step": "Nghỉ", "content": ""}, {"time": "3:00 – 3:20", "step": "Chữa đề", "content": "Đọc giải thích từng câu sai, gửi điểm từng Paper cho Claude"}, {"time": "3:20 – 3:40", "step": "Từ vựng", "content": "10 phrasal verb + 10 cụm giới từ + 10 câu"}, {"time": "3:40 – 4:00", "step": "Luyện nói", "content": "Chủ đề Công việc: 5 câu (hoặc 4 câu Paper 4 trong đề)"}, {"time": "4:00 – 4:10", "step": "Tổng kết", "content": "Xem lỗi sai theo chủ điểm + quiz 10 câu"}], "grammar": {"sections": [{"title": "Sau động từ này dùng gì?", "headers": ["Theo sau là", "Động từ / cụm hay gặp", "Ví dụ"], "rows": [["V-ing", "enjoy, mind, avoid, finish, suggest, keep, practise, consider, spend time, look forward to, be used to; SAU GIỚI TỪ (interested in, good at, before, after, without, instead of)", "I enjoy reading. / She's good at cooking."], ["to V", "want, decide, hope, plan, agree, refuse, promise, manage, afford, learn, would like; It's + adj + to V; too / enough + to V", "She decided to leave. / It's hard to learn a language."], ["V nguyên mẫu", "can, must, should, will…; had better; would rather; let / make + người + V", "You'd better go. / My mum made me clean my room."], ["Cả hai, KHÁC nghĩa", "stop, remember, forget, try", "stop smoking = bỏ hút; stop to smoke = dừng lại để hút. remember to lock = nhớ phải khóa; remember locking = nhớ là đã khóa."]]}, {"title": "So sánh", "headers": ["Loại", "Tính từ ngắn (1 âm tiết, hoặc 2 âm tiết tận cùng -y)", "Tính từ dài", "Ví dụ"], "rows": [["Hơn", "adj-er + than", "more + adj + than", "Hanoi is bigger than Hue. / This book is more interesting than that one."], ["Nhất", "the + adj-est", "the most + adj", "the tallest building / the most beautiful city"], ["Bằng", "as + adj + as", "as + adj + as", "My sister is not as tall as me."], ["Kép (càng… càng…)", "The + adj-er, the + adj-er", "The more + adj, the more + adj", "The older he gets, the wiser he becomes."], ["Bất quy tắc", "good – better – best; bad – worse – worst; far – further – furthest", "many/much – more – most; little – less – least", "Her English is better than mine."]]}, {"title": "Viết lại câu so sánh, too / enough, so / such", "headers": ["Câu gốc", "Viết lại", "Mẹo"], "rows": [["My house is smaller than yours.", "Your house is bigger than mine.", "Đổi chủ ngữ → dùng tính từ trái nghĩa."], ["No one in my class is taller than Nam.", "Nam is the tallest student in my class.", "No one … -er than → the -est."], ["He is too young to drive.", "He isn't old enough to drive.", "too + adj ↔ not + adj TRÁI NGHĨA + enough."], ["The film was so boring that we left.", "It was such a boring film that we left.", "so + adj ↔ such + a/an + adj + danh từ."], ["It takes me an hour to cook.", "I spend an hour cooking.", "spend + thời gian + V-ing (KHÔNG phải to V). Bạn đã sai mẫu này ở ngày 3."]]}], "notes": ["Sau giới từ luôn là V-ing, kể cả chữ \"to\" trong look forward to, be used to, get used to: I look forward to seeing you.", "Nhấn mạnh so sánh hơn: much / far / a lot + adj-er. Không dùng very: much bigger, không nói very bigger.", "Tính từ 2 âm tiết tận cùng -y: happy → happier → the happiest; busy → busier.", "Không dùng cả more và -er cùng lúc: wider, không phải more wider."], "traps": [{"title": "look forward to + V nguyên mẫu", "wrong": "I look forward to see you.", "right": "I look forward to seeing you.", "why": "\"to\" ở đây là giới từ → sau nó là V-ing."}, {"title": "Dùng cả more và -er", "wrong": "This road is more wider than that one.", "right": "This road is wider than that one.", "why": "Tính từ ngắn chỉ thêm -er; tính từ dài mới dùng more."}, {"title": "spend + to V", "wrong": "I spend 30 minutes to get to work.", "right": "I spend 30 minutes getting to work.", "why": "spend + thời gian + V-ing. Câu có to V là It takes me 30 minutes to get to work."}]}, "grammarMcq": [{"q": "I'm thinking about ___ a new car.", "options": ["buy", "to buy", "buying", "bought"], "answer": "C", "tag": "V-ing / to V", "explain": "Sau giới từ (about) → V-ing."}, {"q": "They agreed ___ the meeting until Friday.", "options": ["postponing", "to postpone", "postpone", "postponed"], "answer": "B", "tag": "V-ing / to V", "explain": "agree + to V."}, {"q": "Please remember ___ the lights before you leave.", "options": ["turning off", "turn off", "turned off", "to turn off"], "answer": "D", "tag": "V-ing / to V", "explain": "remember to V = nhớ PHẢI làm (việc chưa làm). remember V-ing = nhớ là ĐÃ làm."}, {"q": "He stopped ___ because it was bad for his health.", "options": ["smoking", "to smoke", "smoke", "smoked"], "answer": "A", "tag": "V-ing / to V", "explain": "stop + V-ing = bỏ hẳn việc đó. stop to smoke = dừng lại để hút, sai nghĩa."}, {"q": "Hue is ___ than Ho Chi Minh City.", "options": ["quiet", "quieter", "more quieter", "quietest"], "answer": "B", "tag": "So sánh", "explain": "Có than → so sánh hơn. quiet là tính từ ngắn → quieter. Không dùng cả more và -er."}, {"q": "Of all my friends, Mai is the ___ at maths.", "options": ["good", "better", "best", "well"], "answer": "C", "tag": "So sánh", "explain": "Of all + the → so sánh nhất. good – better – best."}, {"q": "My new phone is ___ more expensive than my old one.", "options": ["very", "much", "too", "so"], "answer": "B", "tag": "So sánh", "explain": "Nhấn mạnh so sánh hơn: much / far / a lot. Không dùng very."}, {"q": "The older my grandfather gets, the ___ he becomes.", "options": ["more forgetful", "most forgetful", "forgetful", "forgetfuler"], "answer": "A", "tag": "So sánh", "explain": "So sánh kép: The + so sánh hơn, the + so sánh hơn. forgetful dài → more forgetful."}, {"q": "It's not easy ___ a new language.", "options": ["learning", "learn", "learned", "to learn"], "answer": "D", "tag": "V-ing / to V", "explain": "It's + adj + to V."}, {"q": "She is interested ___ photography.", "options": ["in taking", "to take", "on taking", "at taking"], "answer": "A", "tag": "V-ing / to V", "explain": "interested in + V-ing (giới từ in, sau giới từ là V-ing)."}], "transform": [{"source": "It takes me an hour to cook dinner.", "start": "I spend", "answers": ["I spend an hour cooking dinner.", "I spend one hour cooking dinner."], "tag": "It takes / spend", "explain": "spend + thời gian + V-ing. Không viết to cook (bạn sai mẫu này ở ngày 3)."}, {"source": "No one in my family is taller than my father.", "start": "My father is", "answers": ["My father is the tallest in my family.", "My father is the tallest person in my family.", "My father is the tallest member of my family.", "My father is the tallest in the family."], "tag": "So sánh", "explain": "No one … taller than → the tallest."}, {"source": "He is too young to get a driving licence.", "start": "He isn't", "answers": ["He isn't old enough to get a driving licence.", "He isn't old enough to get a driving license."], "tag": "Too / enough", "explain": "too young ↔ not old enough. enough đứng SAU tính từ."}, {"source": "I don't have enough money, so I can't buy this laptop.", "start": "If I", "answers": ["If I had enough money, I could buy this laptop.", "If I had enough money, I would buy this laptop.", "If I had enough money, I would be able to buy this laptop."], "tag": "Câu điều kiện", "explain": "Hiện tại → loại 2: don't have → had; can't → could. Vế chính PHẢI có could/would (ngày 3 bạn viết thiếu: I drove)."}, {"source": "It was such a hot day that we stayed at home.", "start": "The day was so", "answers": ["The day was so hot that we stayed at home."], "tag": "So / such", "explain": "such + a + adj + N ↔ so + adj."}], "extra": {"title": "Luyện thêm: thì, where / which, câu điều kiện", "note": "Ngày 3 bạn vẫn chọn have/has khi có mốc quá khứ (last year, when she was a student, khi về nhà), chọn where chỉ vì thấy tên địa danh, và viết sai dạng động từ khi viết lại câu điều kiện. Câu 6 và 7 là một cặp: cùng \"the hotel\" nhưng một câu where, một câu which. Hãy nhìn PHÍA SAU chỗ trống.", "sets": [{"key": "mix4", "title": "Thì + mệnh đề quan hệ + điều kiện", "items": [{"q": "I ___ to Hue last summer.", "options": ["have travelled", "travelled", "had travelled", "have been travelled"], "answer": "B", "tag": "Quá khứ đơn", "explain": "last summer → quá khứ đơn."}, {"q": "She ___ in Can Tho when she was a child.", "options": ["has lived", "had been lived", "lived", "has been living"], "answer": "C", "tag": "Quá khứ đơn", "explain": "when she was a child → giai đoạn đã qua → quá khứ đơn."}, {"q": "We ___ this house since 2018.", "options": ["have owned", "owned", "have been owned", "own"], "answer": "A", "tag": "Hiện tại hoàn thành", "explain": "since 2018 → have + V3. Người sở hữu nhà (chủ động) → không có been."}, {"q": "When we reached the cinema, the film ___.", "options": ["has started", "started", "starts", "had started"], "answer": "D", "tag": "Quá khứ hoàn thành", "explain": "Mốc: lúc tới rạp (quá khứ). Phim bắt đầu trước đó → had + V3."}, {"q": "Phu Quoc, ___ has beautiful beaches, is popular with tourists.", "options": ["which", "where", "that", "what"], "answer": "A", "tag": "Mệnh đề quan hệ", "explain": "Ngay sau là ĐỘNG TỪ (has) → which làm chủ ngữ. Phu Quoc là địa danh nhưng vẫn dùng which."}, {"q": "The hotel ___ we stayed last summer was very clean.", "options": ["which", "who", "where", "whose"], "answer": "C", "tag": "Mệnh đề quan hệ", "explain": "we stayed (ở lại) đã đủ nghĩa, không thiếu tân ngữ → where (= at which)."}, {"q": "The hotel ___ we booked online was very clean.", "options": ["where", "which", "when", "whose"], "answer": "B", "tag": "Mệnh đề quan hệ", "explain": "we booked (đặt cái gì?) THIẾU tân ngữ → which. So với câu trên: stayed → where, booked → which."}, {"q": "If I ___ you, I would talk to her.", "options": ["am", "had been", "will be", "were"], "answer": "D", "tag": "Câu điều kiện", "explain": "would + V → loại 2 → If I were. had been là loại 3 (ngày 3 bạn chọn nhầm cái này)."}, {"q": "If he had studied harder, he ___ the exam.", "options": ["would pass", "passed", "had passed", "would have passed"], "answer": "D", "tag": "Câu điều kiện", "explain": "had + V3 → loại 3 → would have + V3."}, {"q": "If I had a car, I ___ you to the airport.", "options": ["drove", "will drive", "could drive", "can drive"], "answer": "C", "tag": "Câu điều kiện", "explain": "Vế if có had (V2) → loại 2 → vế chính PHẢI có could/would + V. drove thiếu would/could."}]}], "transform": [{"source": "He didn't leave early, so he missed the train.", "start": "If he", "answers": ["If he had left early, he wouldn't have missed the train.", "If he had left early, he would not have missed the train.", "If he had left earlier, he wouldn't have missed the train.", "If he had left earlier, he would not have missed the train."], "tag": "Câu điều kiện", "explain": "Quá khứ → loại 3. Vế if: had + V3 (had left). Vế chính: wouldn't have + V3 (missed → wouldn't have missed vì đổi sang phủ định)."}, {"source": "We moved to this flat in 2021.", "start": "We have", "answers": ["We have lived in this flat since 2021.", "We have been living in this flat since 2021."], "tag": "Hiện tại hoàn thành", "explain": "moved … in 2021 → have lived … since 2021. Không có been + V3."}]}, "vocab": [{"phrase": "take off", "pos": "phr. v.", "ipa": "/teɪk ɒf/", "meaning": "(máy bay) cất cánh; cởi (quần áo)", "colloc": "the plane takes off / take off your shoes", "example": "The plane will take off in ten minutes."}, {"phrase": "bring up", "pos": "phr. v.", "ipa": "/brɪŋ ʌp/", "meaning": "nuôi dạy", "colloc": "be brought up by / in", "example": "She was brought up by her grandparents."}, {"phrase": "put up with", "pos": "phr. v.", "ipa": "/pʊt ʌp wɪð/", "meaning": "chịu đựng", "colloc": "put up with the noise / sb's behaviour", "example": "I can't put up with the noise any longer."}, {"phrase": "make up", "pos": "phr. v.", "ipa": "/meɪk ʌp/", "meaning": "bịa ra; làm lành", "colloc": "make up a story / an excuse", "example": "He made up an excuse for being late."}, {"phrase": "work out", "pos": "phr. v.", "ipa": "/wɜːk aʊt/", "meaning": "tìm ra cách giải; tập thể dục", "colloc": "work out the answer / work out at the gym", "example": "I can't work out how to use this app."}, {"phrase": "try on", "pos": "phr. v.", "ipa": "/traɪ ɒn/", "meaning": "mặc thử", "colloc": "try on a dress / shoes", "example": "Can I try on these jeans?"}, {"phrase": "hold on", "pos": "phr. v.", "ipa": "/həʊld ɒn/", "meaning": "chờ máy, đợi một chút", "colloc": "Hold on a minute.", "example": "Hold on, I'll get a pen."}, {"phrase": "go on", "pos": "phr. v.", "ipa": "/ɡəʊ ɒn/", "meaning": "tiếp tục; xảy ra", "colloc": "go on + V-ing / What's going on?", "example": "What's going on in the street?"}, {"phrase": "break down", "pos": "phr. v.", "ipa": "/breɪk daʊn/", "meaning": "(xe, máy) hỏng", "colloc": "the car / the computer broke down", "example": "Our car broke down on the way to Vung Tau."}, {"phrase": "put on", "pos": "phr. v.", "ipa": "/pʊt ɒn/", "meaning": "mặc vào; tăng (cân)", "colloc": "put on a coat / put on weight", "example": "Put on your jacket. It's cold."}, {"phrase": "interested in", "pos": "adj. + prep.", "ipa": "/ˈɪntrəstɪd ɪn/", "meaning": "quan tâm, thích", "colloc": "interested in + N / V-ing", "example": "I'm interested in learning Japanese."}, {"phrase": "good at", "pos": "adj. + prep.", "ipa": "/ɡʊd æt/", "meaning": "giỏi về", "colloc": "good at maths / at + V-ing", "example": "My brother is good at fixing computers."}, {"phrase": "afraid of", "pos": "adj. + prep.", "ipa": "/əˈfreɪd əv/", "meaning": "sợ", "colloc": "afraid of dogs / of + V-ing", "example": "Are you afraid of flying?"}, {"phrase": "responsible for", "pos": "adj. + prep.", "ipa": "/rɪˈspɒnsəbl fə(r)/", "meaning": "chịu trách nhiệm về", "colloc": "responsible for training staff", "example": "The manager is responsible for training new staff."}, {"phrase": "depend on", "pos": "v. + prep.", "ipa": "/dɪˈpend ɒn/", "meaning": "phụ thuộc vào", "colloc": "It depends on the weather.", "example": "Our plan depends on the weather."}, {"phrase": "apologise for", "pos": "v. + prep.", "ipa": "/əˈpɒlədʒaɪz fə(r)/", "meaning": "xin lỗi về", "colloc": "apologise (to sb) for + N / V-ing", "example": "He apologised for being late."}, {"phrase": "different from", "pos": "adj. + prep.", "ipa": "/ˈdɪfrənt frəm/", "meaning": "khác với", "colloc": "different from my sister", "example": "My job is very different from my father's."}, {"phrase": "famous for", "pos": "adj. + prep.", "ipa": "/ˈfeɪməs fə(r)/", "meaning": "nổi tiếng về", "colloc": "famous for its food / beaches", "example": "Hoi An is famous for its old town."}, {"phrase": "proud of", "pos": "adj. + prep.", "ipa": "/praʊd əv/", "meaning": "tự hào về", "colloc": "proud of my parents / of + V-ing", "example": "My parents are proud of me."}, {"phrase": "succeed in", "pos": "v. + prep.", "ipa": "/səkˈsiːd ɪn/", "meaning": "thành công trong việc", "colloc": "succeed in + V-ing", "example": "She succeeded in passing the exam."}], "vocabMcq": [{"q": "The plane will ___ in ten minutes. Please fasten your seat belts.", "options": ["take off", "take up", "take after", "take over"], "answer": "A", "tag": "Phrasal verb", "explain": "take off = cất cánh. take after = giống; take up = bắt đầu (sở thích)."}, {"q": "Excuse me, can I ___ these jeans?", "options": ["try out", "try on", "put off", "take on"], "answer": "B", "tag": "Phrasal verb", "explain": "try on = mặc thử (quần áo). try out = thử (máy móc, phương pháp)."}, {"q": "I can't ___ the noise from my neighbours any longer.", "options": ["put up", "put on", "put up with", "put away"], "answer": "C", "tag": "Phrasal verb", "explain": "put up with = chịu đựng. put on = mặc vào; put away = cất đi."}, {"q": "Hanoi is famous ___ its street food.", "options": ["of", "in", "with", "for"], "answer": "D", "tag": "Giới từ", "explain": "famous for = nổi tiếng về."}, {"q": "She was brought ___ by her grandparents in the countryside.", "options": ["up", "out", "on", "in"], "answer": "A", "tag": "Phrasal verb", "explain": "bring up = nuôi dạy (bị động: was brought up)."}, {"q": "Are you afraid ___ dogs?", "options": ["at", "of", "from", "with"], "answer": "B", "tag": "Giới từ", "explain": "afraid of = sợ."}, {"q": "Whether we go or not depends ___ the weather.", "options": ["in", "of", "on", "at"], "answer": "C", "tag": "Giới từ", "explain": "depend on = phụ thuộc vào."}, {"q": "He ___ an excuse for being late, but nobody believed him.", "options": ["made up", "took up", "brought up", "worked out"], "answer": "A", "tag": "Phrasal verb", "explain": "make up an excuse = bịa ra lý do."}, {"q": "My brother is very good ___ fixing computers.", "options": ["in", "on", "with", "at"], "answer": "D", "tag": "Giới từ", "explain": "good at + V-ing."}, {"q": "The manager is responsible ___ training new staff.", "options": ["of", "for", "to", "with"], "answer": "B", "tag": "Giới từ", "explain": "responsible for + V-ing = chịu trách nhiệm."}], "speaking": {"introTitle": "Bài mẫu: Your job (khoảng 1 phút, điền chỗ trống)", "intro": ["I work as a/an ___ at ___. I have worked there for ___ years.", "My main duties are ___ and ___.", "What I enjoy most is ___ (V-ing) because ___.", "However, the most difficult part is ___ (V-ing).", "Compared to my first job, this job is ___-er / more ___.", "In the future, I hope to ___ after I finish my master's degree."], "frame": "Ý chính → Lý do (because…) → Ví dụ (For example…)", "rescue": ["That's an interesting question. Let me think…", "Could you repeat the question, please?", "I'm not sure, but I think…", "What I mean is…"], "questions": [{"q": "What do you do?", "hint": "I work as a… at… I have worked there for… (chủ động → không có been). Nếu đang đi học: I'm a student at…"}, {"q": "What do you like most about your job?", "hint": "What I like most is + V-ing / N. → because… → For example…"}, {"q": "What is the most difficult part of your job?", "hint": "The most difficult thing is + V-ing… Dùng so sánh nhất."}, {"q": "Is your job more interesting than your studies at university? Why?", "hint": "So sánh hơn: It's more interesting / busier / less stressful than… Có lý do + ví dụ."}, {"q": "Would you like to change your job in the future?", "hint": "I'd like to… / I'm planning to… / If I had the chance, I would… (loại 2: had → would)."}], "rubric": ["Trôi chảy (ít ngập ngừng, nói đủ ý)", "Ngữ pháp (thì đúng, V-ing / to V, so sánh)", "Từ vựng (đúng chủ đề công việc, có cụm giới từ)", "Phát âm (âm cuối -s, -ed, trọng âm)", "Nội dung (trả lời đúng câu hỏi, có lý do và ví dụ)"]}, "reviewQuiz": [{"q": "I avoid ___ coffee in the evening.", "options": ["drink", "to drink", "drinking", "drank"], "answer": "C", "tag": "V-ing / to V", "explain": "avoid + V-ing."}, {"q": "This exercise is ___ than the last one.", "options": ["easy", "easier", "easiest", "more easy"], "answer": "B", "tag": "So sánh", "explain": "easy tận cùng -y → easier."}, {"q": "If it ___ sunny tomorrow, we will go hiking.", "options": ["is", "will be", "was", "would be"], "answer": "A", "tag": "Câu điều kiện", "explain": "will → loại 1 → vế if: hiện tại đơn."}, {"q": "The village ___ my mother was born is very small.", "options": ["which", "where", "who", "whose"], "answer": "B", "tag": "Mệnh đề quan hệ", "explain": "my mother was born đã đủ nghĩa → where."}, {"q": "I wish I ___ to your party last week.", "options": ["came", "had come", "come", "would come"], "answer": "B", "tag": "Câu ước", "explain": "last week → tiếc về quá khứ → wish + had + V3."}, {"q": "He ___ in the army for two years when he was young.", "options": ["served", "has served", "has been served", "serves"], "answer": "A", "tag": "Quá khứ đơn", "explain": "when he was young → quá khứ đơn."}, {"q": "She spent the whole weekend ___ for the exam.", "options": ["study", "to study", "studied", "studying"], "answer": "D", "tag": "It takes / spend", "explain": "spend + thời gian + V-ing."}, {"q": "We have run out ___ sugar.", "options": ["from", "with", "of", "on"], "answer": "C", "tag": "Phrasal verb", "explain": "run out of = hết."}, {"q": "___ the bad weather, the plane landed safely.", "options": ["Although", "Because", "However", "Despite"], "answer": "D", "tag": "Liên từ", "explain": "Sau là danh từ, nghĩa tương phản → Despite."}, {"q": "My phone ___ yet.", "options": ["hasn't been repaired", "hasn't repaired", "didn't repair", "wasn't repairing"], "answer": "A", "tag": "Bị động", "explain": "Vật + yet → bị động hiện tại hoàn thành."}], "exam": {"title": "Đề thi thử 1 · 70 câu", "note": "Làm như thi thật: Paper 1 + 2 trong 90 phút liền, không xem tài liệu; Paper 3 khoảng 20 phút (mỗi bài nghe phát 2 lần). Nộp từng Part, điểm quy đổi hiện ở đầu trang.", "papers": [{"title": "PAPER 1 – Vocabulary & Reading", "points": 20, "parts": [{"key": "x1a", "title": "Part A. Vocabulary (1–10)", "directions": "Directions: Choose the word or phrase (A, B, C or D) that best completes each sentence.", "start": 1, "items": [{"q": "Please ___ off your mobile phones before the exam begins.", "options": ["turn", "put", "take", "get"], "answer": "A", "tag": "Phrasal verb", "explain": "turn off = tắt (máy, đèn). put off = hoãn; take off = cởi / cất cánh; get off = xuống xe."}, {"q": "She has a good ___ of humour; everyone loves talking to her.", "options": ["feeling", "sense", "idea", "mood"], "answer": "B", "tag": "Collocation", "explain": "a sense of humour = khiếu hài hước. Cụm cố định."}, {"q": "The government should ___ more attention to public transport.", "options": ["take", "make", "pay", "give"], "answer": "C", "tag": "Collocation", "explain": "pay attention to = chú ý tới. Không nói take/make/give attention."}, {"q": "We had to ___ the meeting until next week because the manager was ill.", "options": ["call on", "look up", "set out", "put off"], "answer": "D", "tag": "Phrasal verb", "explain": "put off = hoãn lại. call on = ghé thăm; look up = tra cứu; set out = khởi hành."}, {"q": "If you want to lose weight, you should ___ down on sweets.", "options": ["cut", "take", "turn", "break"], "answer": "A", "tag": "Phrasal verb", "explain": "cut down on = cắt giảm. turn down = từ chối; break down = hỏng."}, {"q": "Tuan is very ___; he never tells lies.", "options": ["polite", "honest", "careful", "famous"], "answer": "B", "tag": "Từ vựng", "explain": "honest = trung thực, hợp với \"never tells lies\". polite = lịch sự."}, {"q": "I'm afraid I can't ___ you a lift today; my car is at the garage.", "options": ["take", "give", "bring", "make"], "answer": "B", "tag": "Collocation", "explain": "give sb a lift = cho ai đi nhờ xe. Cụm cố định."}, {"q": "Thank you for your ___; it was very useful.", "options": ["advise", "advices", "advice", "adviser"], "answer": "C", "tag": "Từ dễ nhầm", "explain": "Sau your cần danh từ: advice (không đếm được, không có -s). advise là động từ."}, {"q": "He ___ his driving test three times before he finally passed.", "options": ["failed", "lost", "missed", "dropped"], "answer": "A", "tag": "Collocation", "explain": "fail a test = trượt bài thi. lose a match = thua trận; miss = lỡ."}, {"q": "The price of houses in the city centre is ___ high.", "options": ["extreme", "extremes", "extremity", "extremely"], "answer": "D", "tag": "Cấu tạo từ", "explain": "Bổ nghĩa cho tính từ high → cần trạng từ: extremely."}]}, {"key": "x1b1", "title": "Part B. Reading – First passage (11–15)", "directions": "Directions: Read the passages and choose the best answer (A, B, C or D) to each question.", "start": 11, "passageTitle": "Fast Fashion", "passage": ["Today, many people buy new clothes every month, and some wear an item only a few times before throwing it away. This trend is known as 'fast fashion': cheap, fashionable clothes that are produced quickly and sold in large numbers.", "For shoppers, fast fashion has clear advantages. It allows people on a small budget to follow the latest styles, and shops change their collections so often that there is always something new to buy.", "However, the environmental cost is high. Making clothes uses huge amounts of water and energy. For example, about 2,700 litres of water are needed to produce a single cotton T-shirt. In addition, most cheap clothes are made from plastic-based materials, which can take hundreds of years to break down when they are thrown away.", "There are also concerns about the workers who make the clothes. In some factories, people work long hours for very low wages, and conditions can be unsafe.", "Some consumers are now trying to change their habits. They buy fewer but better-quality items, repair clothes instead of replacing them, or shop at second-hand stores. As one expert put it, 'The most sustainable piece of clothing is the one that is already in your wardrobe.'"], "items": [{"q": "What is the passage mainly about?", "options": ["How to repair old clothes", "The good and bad sides of fast fashion", "The history of cotton", "Working conditions in factories"], "answer": "B", "tag": "Đọc: ý chính", "explain": "Đoạn 2 nói lợi ích, đoạn 3–4 nói tác hại, đoạn 5 nói cách thay đổi. A, C, D chỉ là chi tiết."}, {"q": "According to paragraph 2, fast fashion is popular because ___.", "options": ["it is cheap and always offers new styles", "clothes last for many years", "it is made from natural materials", "workers are well paid"], "answer": "A", "tag": "Đọc: chi tiết", "explain": "Đoạn 2: people on a small budget (rẻ) … always something new to buy (luôn có mẫu mới)."}, {"q": "The word 'which' in paragraph 3 refers to ___.", "options": ["clothes", "hundreds of years", "plastic-based materials", "water and energy"], "answer": "C", "tag": "Đọc: từ quy chiếu", "explain": "\"plastic-based materials, which can take hundreds of years to break down\" → which thay cho danh từ ngay trước dấu phẩy."}, {"q": "Which of the following is NOT mentioned as a way to change shopping habits?", "options": ["buying fewer items", "repairing clothes", "shopping second-hand", "renting clothes"], "answer": "D", "tag": "Đọc: NOT mentioned", "explain": "Đoạn 5 có buy fewer, repair, second-hand stores. Không nói tới thuê quần áo."}, {"q": "The word 'concerns' in paragraph 4 is closest in meaning to ___.", "options": ["worries", "benefits", "rules", "questions"], "answer": "A", "tag": "Đọc: từ đồng nghĩa", "explain": "concerns = mối lo ngại. Ngữ cảnh: lương thấp, điều kiện không an toàn → worries."}]}, {"key": "x1b2", "title": "Part B. Reading – Second passage (16–20)", "start": 16, "passageTitle": "Bikes for Everyone", "passage": ["In many cities around the world, you can now rent a bicycle from a street station, ride it to your destination and leave it at another station. These bike-sharing schemes have become very popular over the last fifteen years.", "The idea is simple. Users download an app, find the nearest bike and unlock it with their phone. The first thirty minutes are often free or very cheap, so the bikes are ideal for short journeys, such as getting from the train station to the office.", "Supporters say that bike-sharing reduces traffic and air pollution. It also encourages people to exercise without having to plan special trips to the gym. In Paris, for example, the number of people cycling to work has doubled since the city introduced its scheme.", "The schemes do have some problems. In some cities, bikes are stolen or damaged, and users sometimes leave them on pavements where they block pedestrians. Cycling can also be dangerous in cities without proper bike lanes.", "Despite these problems, many city governments believe the benefits are greater than the costs. They are now building more bike lanes to make cycling safer and more attractive."], "items": [{"q": "Which is the best title for the passage?", "options": ["The Dangers of Cycling", "Bike-Sharing in Cities", "How to Download an App", "Traffic in Paris"], "answer": "B", "tag": "Đọc: ý chính", "explain": "Cả bài nói về hệ thống chia sẻ xe đạp: cách dùng, lợi ích, vấn đề, tương lai."}, {"q": "How do users unlock the bikes?", "options": ["With a key", "By paying at the station", "With their phone", "By calling the company"], "answer": "C", "tag": "Đọc: chi tiết", "explain": "Đoạn 2: unlock it with their phone."}, {"q": "According to paragraph 3, what has happened in Paris?", "options": ["More people now cycle to work.", "The scheme was stopped.", "Bikes became more expensive.", "Traffic has increased."], "answer": "A", "tag": "Đọc: chi tiết", "explain": "the number of people cycling to work has doubled = số người đạp xe đi làm tăng gấp đôi."}, {"q": "The word 'block' in paragraph 4 is closest in meaning to ___.", "options": ["help", "carry", "follow", "get in the way of"], "answer": "D", "tag": "Đọc: từ đồng nghĩa", "explain": "block pedestrians = cản đường người đi bộ = get in the way of."}, {"q": "What are many city governments doing now?", "options": ["Closing the schemes", "Building more bike lanes", "Making bikes more expensive", "Banning cars"], "answer": "B", "tag": "Đọc: chi tiết", "explain": "Đoạn 5: They are now building more bike lanes."}]}]}, {"title": "PAPER 2 – Grammar, Use of English & Writing", "points": 40, "parts": [{"key": "x2a", "title": "Part A. Sentence completion (21–35)", "directions": "Directions: Choose the word or phrase (A, B, C or D) that best completes each sentence.", "start": 21, "items": [{"q": "If we had left earlier, we ___ the flight.", "options": ["wouldn't miss", "didn't miss", "wouldn't have missed", "hadn't missed"], "answer": "C", "tag": "Câu điều kiện", "explain": "Vế if: had + V3 → loại 3 → wouldn't have + V3."}, {"q": "I ___ my keys yesterday, so I had to wait for my wife to come home.", "options": ["lost", "lose", "have lost", "had lost"], "answer": "A", "tag": "Quá khứ đơn", "explain": "yesterday → quá khứ đơn. Không dùng have lost với yesterday."}, {"q": "English ___ in many countries around the world.", "options": ["speaks", "is speaking", "has spoken", "is spoken"], "answer": "D", "tag": "Bị động", "explain": "Tiếng Anh không tự nói → bị động hiện tại đơn: is spoken."}, {"q": "The doctor ___ I saw yesterday was very kind.", "options": ["who", "which", "whose", "where"], "answer": "A", "tag": "Mệnh đề quan hệ", "explain": "Trước là người (the doctor), sau là I saw (thiếu tân ngữ) → who/whom."}, {"q": "I enjoy ___ to music in my free time.", "options": ["listen", "to listen", "listened", "listening"], "answer": "D", "tag": "V-ing / to V", "explain": "enjoy + V-ing."}, {"q": "She decided ___ a new job closer to home.", "options": ["finding", "to find", "find", "found"], "answer": "B", "tag": "V-ing / to V", "explain": "decide + to V."}, {"q": "This is ___ restaurant in town, but the food is still good.", "options": ["the cheaper", "cheapest", "more cheap", "the cheapest"], "answer": "D", "tag": "So sánh", "explain": "So sánh nhất tính từ ngắn: the + adj-est. Thiếu \"the\" là sai."}, {"q": "My sister is not as tall ___ me.", "options": ["than", "as", "like", "so"], "answer": "B", "tag": "So sánh", "explain": "So sánh bằng: (not) as + adj + as."}, {"q": "___ it was raining, we went for a walk.", "options": ["Although", "Despite", "Because", "In spite of"], "answer": "A", "tag": "Liên từ", "explain": "Sau chỗ trống là mệnh đề (it was raining), nghĩa tương phản → Although."}, {"q": "She asked me if I ___ coffee.", "options": ["like", "am liking", "liked", "will like"], "answer": "C", "tag": "Câu gián tiếp", "explain": "Câu hỏi gián tiếp ở quá khứ (asked) → lùi thì: like → liked."}, {"q": "I wish I ___ speak French. It would be useful for my job.", "options": ["can", "will", "would be", "could"], "answer": "D", "tag": "Câu ước", "explain": "Ước trái với hiện tại: wish + could + V."}, {"q": "Not until he got home ___ that he had lost his wallet.", "options": ["he realised", "did he realise", "he did realise", "realised he"], "answer": "B", "tag": "Đảo ngữ", "explain": "Not until + mốc/mệnh đề + trợ động từ + S + V: did he realise."}, {"q": "Would you mind ___ the window? It's very hot in here.", "options": ["open", "to open", "opening", "opened"], "answer": "C", "tag": "V-ing / to V", "explain": "Would you mind + V-ing?"}, {"q": "I'm going to have my hair ___ tomorrow.", "options": ["cut", "cutting", "to cut", "cuts"], "answer": "A", "tag": "Have sth done", "explain": "have + vật + V3 (nhờ người khác làm). cut – cut – cut."}, {"q": "He used to ___ football every Sunday when he was young.", "options": ["playing", "played", "play", "plays"], "answer": "C", "tag": "Used to / be used to", "explain": "used to + V nguyên mẫu = đã từng (thói quen cũ)."}]}, {"key": "x2b", "title": "Part B. Cloze (36–45)", "directions": "Directions: Read the passage and choose the best word (A, B, C or D) for each numbered blank.", "start": 36, "passageTitle": "Keeping Fit at Work", "passage": ["Many office workers spend up to ten hours a day (36) ___ at a desk. Doctors warn that this habit can (37) ___ serious health problems, such as back pain and heart disease. (38) ___, there are some simple things that workers can do to stay healthy.", "First, try to stand up and walk around (39) ___ least once an hour. You could, for example, go and talk to a colleague (40) ___ of sending an email. Second, use the stairs instead of the lift. It may (41) ___ a few extra minutes, but your body will thank you.", "Many companies now (42) ___ their staff to exercise. Some offer free yoga classes at lunchtime, (43) ___ others provide desks that can be raised so that people can work standing up.", "Experts agree that small changes like these can make a big (44) ___. If you start today, you will soon feel more (45) ___ and less tired."], "items": [{"q": "Chỗ trống (36)", "options": ["sit", "to sit", "sat", "sitting"], "answer": "D", "tag": "V-ing / to V", "explain": "spend + thời gian + V-ing."}, {"q": "Chỗ trống (37)", "options": ["lead to", "result", "cause to", "make"], "answer": "A", "tag": "Collocation", "explain": "lead to = dẫn tới. result phải là result in; cause không đi với to."}, {"q": "Chỗ trống (38)", "options": ["Therefore", "Because", "However", "Although"], "answer": "C", "tag": "Liên từ", "explain": "Câu trước nói tác hại, câu sau nói có cách khắc phục → tương phản, đầu câu có dấu phẩy: However."}, {"q": "Chỗ trống (39)", "options": ["in", "at", "on", "for"], "answer": "B", "tag": "Giới từ", "explain": "at least = ít nhất. Cụm cố định."}, {"q": "Chỗ trống (40)", "options": ["because", "despite", "rather", "instead"], "answer": "D", "tag": "Giới từ", "explain": "instead of + V-ing = thay vì."}, {"q": "Chỗ trống (41)", "options": ["take", "spend", "cost", "last"], "answer": "A", "tag": "Collocation", "explain": "It takes + thời gian = mất (bao lâu). spend cần người làm chủ ngữ."}, {"q": "Chỗ trống (42)", "options": ["prevent", "stop", "encourage", "avoid"], "answer": "C", "tag": "Từ vựng", "explain": "encourage sb to V = khuyến khích ai làm gì. prevent/stop sb from V-ing ngược nghĩa."}, {"q": "Chỗ trống (43)", "options": ["which", "while", "because", "so"], "answer": "B", "tag": "Liên từ", "explain": "while = trong khi (so sánh 2 việc: some … while others …)."}, {"q": "Chỗ trống (44)", "options": ["change", "different", "differ", "difference"], "answer": "D", "tag": "Cấu tạo từ", "explain": "make a difference = tạo ra khác biệt. Sau a big cần danh từ."}, {"q": "Chỗ trống (45)", "options": ["energy", "energetic", "energetically", "energise"], "answer": "B", "tag": "Cấu tạo từ", "explain": "feel + tính từ: feel energetic = thấy tràn đầy năng lượng."}]}, {"key": "x2c", "title": "Part C. Sentence transformation (46–50)", "directions": "Directions: Finish each sentence so that it means the same as the sentence before it.", "start": 46, "transform": [{"source": "\"Where do you live?\" he asked me.", "start": "He asked me", "answers": ["He asked me where I lived."], "tag": "Câu gián tiếp", "explain": "Câu hỏi gián tiếp: không đảo trợ động từ (bỏ do), lùi thì live → lived, you → I."}, {"source": "The film was so boring that we left early.", "start": "It was such", "answers": ["It was such a boring film that we left early."], "tag": "So / such", "explain": "so + adj + that ⇔ such + a/an + adj + N + that."}, {"source": "My house is smaller than yours.", "start": "Your house is", "answers": ["Your house is bigger than mine.", "Your house is larger than mine."], "tag": "So sánh", "explain": "Đổi chủ ngữ → dùng tính từ trái nghĩa: smaller → bigger/larger. yours → mine."}, {"source": "If you don't practise, you won't improve.", "start": "Unless", "answers": ["Unless you practise, you won't improve.", "Unless you practise, you will not improve."], "tag": "Unless", "explain": "If … don't → Unless + khẳng định. Vế sau giữ nguyên."}, {"source": "They are building a new hospital in my town.", "start": "A new hospital", "answers": ["A new hospital is being built in my town."], "tag": "Bị động", "explain": "Hiện tại tiếp diễn bị động: am/is/are + being + V3. Lỗi bạn đã sai ở ngày 1."}]}]}, {"title": "PAPER 3 – Listening", "points": 20, "parts": [{"key": "x3a", "title": "Part A. Short conversations (51–60)", "directions": "Directions: You will hear ten short conversations. Choose the best answer to each question.", "start": 51, "items": [{"q": "What will the woman drink?", "options": ["Orange juice.", "Tea.", "Coffee.", "Water."], "answer": "A", "tag": "Nghe", "explain": "Cô ấy đã uống 2 cốc cà phê, xin nước cam thay thế.", "script": ["Man: Would you like some coffee?", "Woman: No, thanks. I've already had two cups this morning. Could I have some orange juice instead?", "Man: Sure."]}, {"q": "When is the man's appointment?", "options": ["On Monday at 10 a.m.", "On Tuesday at 10 a.m.", "On Tuesday at 2 p.m.", "On Wednesday at 2 p.m."], "answer": "C", "tag": "Nghe", "explain": "Ban đầu thứ Hai 10 giờ, nhưng đã đổi sang chiều thứ Ba lúc 2 giờ. Bẫy: thông tin cũ nói trước.", "script": ["Woman: Your appointment is on Monday at ten, isn't it?", "Man: It was, but I moved it to Tuesday afternoon, at two o'clock."]}, {"q": "Where are the speakers?", "options": ["In a bank.", "In a post office.", "In a hotel.", "In a restaurant."], "answer": "B", "tag": "Nghe", "explain": "send this parcel, express mail → bưu điện.", "script": ["Man: I'd like to send this parcel to Da Nang, please.", "Woman: Certainly. Would you like to send it by express mail? It'll arrive tomorrow."]}, {"q": "How does the woman usually go to work?", "options": ["By bus.", "By motorbike.", "By car.", "On foot."], "answer": "D", "tag": "Nghe", "explain": "I normally walk. Chỉ đi xe buýt khi trời mưa.", "script": ["Man: Do you drive to work?", "Woman: Not usually. My office is only ten minutes away, so I normally walk. I only take the bus when it rains."]}, {"q": "What will the weather be like tomorrow afternoon?", "options": ["Sunny.", "Rainy.", "Windy.", "Snowy."], "answer": "B", "tag": "Nghe", "explain": "cloudy in the morning and rain all afternoon → chiều mưa.", "script": ["Woman: Shall we go to the beach tomorrow?", "Man: The forecast says it'll be cloudy in the morning and it will rain all afternoon.", "Woman: Let's go another day, then."]}, {"q": "How many people will come to dinner?", "options": ["Four.", "Five.", "Six.", "Seven."], "answer": "C", "tag": "Nghe", "explain": "4 người + bố mẹ = 6. Em gái nhắn là không tới được. Bẫy: số 7.", "script": ["Woman: How many people are coming to dinner?", "Man: Well, there are four of us, plus my parents. Oh, and my sister said she might come too.", "Woman: So, seven?", "Man: No, my sister has just texted me. She can't come."]}, {"q": "What does the man want to buy?", "options": ["A shirt.", "A jacket.", "A pair of shoes.", "A hat."], "answer": "D", "tag": "Nghe", "explain": "a hat for my father, to keep the sun off.", "script": ["Man: Excuse me, I'm looking for a hat for my father. Something to keep the sun off.", "Woman: These ones over here are very popular."]}, {"q": "What time does the film start?", "options": ["At 7:30.", "At 7:00.", "At 8:00.", "At 8:30."], "answer": "A", "tag": "Nghe", "explain": "Không phải 8 giờ, sớm hơn nửa tiếng → 7:30.", "script": ["Woman: The film starts at eight, doesn't it?", "Man: No, it starts half an hour earlier. We should leave now."]}, {"q": "Why is the man late?", "options": ["He got up late.", "His car broke down.", "There was an accident, so the traffic was bad.", "He missed the bus."], "answer": "C", "tag": "Nghe", "explain": "Đi đúng giờ nhưng có tai nạn trên đường chính, kẹt xe.", "script": ["Woman: You're late again!", "Man: Sorry. I left home on time, but there was an accident on the main road, and the traffic was terrible."]}, {"q": "What does the woman advise the man to do?", "options": ["Buy a new phone.", "Take it to a repair shop.", "Call the company.", "Turn it off and on again."], "answer": "D", "tag": "Nghe", "explain": "try turning it off and then on again.", "script": ["Man: My phone keeps freezing. Should I buy a new one?", "Woman: Before you spend any money, try turning it off and then on again. That usually works for me."]}]}, {"key": "x3b", "title": "Part B. Long conversation (61–65)", "directions": "You will hear a conversation between two friends, Hoa and Tuan, about Tuan's new job.", "start": 61, "script": ["Hoa: Hi Tuan! I heard you started a new job last month. How's it going?", "Tuan: Really well, thanks. I'm working as a software engineer at a company in District 7.", "Hoa: That's quite far from your house, isn't it?", "Tuan: Yes, it takes me about forty-five minutes by motorbike. But the company lets us work from home on Fridays, so I only travel four days a week.", "Hoa: That's nice. What do you like most about the job?", "Tuan: My colleagues, definitely. They're friendly and always happy to help. The salary is good too, but the people are more important to me.", "Hoa: Is there anything you don't like?", "Tuan: Well, we have a lot of meetings, and most of them are in English. At first, I found it hard to follow what people were saying.", "Hoa: Is it easier now?", "Tuan: A little. I've started taking an English course on Tuesday and Thursday evenings. My manager says that if my English improves, I might be sent to work in Singapore next year.", "Hoa: Wow, that would be amazing. Good luck!"], "items": [{"q": "What is Tuan's job?", "options": ["A teacher.", "A software engineer.", "A manager.", "A salesman."], "answer": "B", "tag": "Nghe", "explain": "I'm working as a software engineer."}, {"q": "How long does it take Tuan to get to work?", "options": ["15 minutes.", "30 minutes.", "45 minutes.", "An hour."], "answer": "C", "tag": "Nghe", "explain": "about forty-five minutes by motorbike."}, {"q": "What does Tuan like most about his job?", "options": ["The salary.", "The location.", "Working from home.", "His colleagues."], "answer": "D", "tag": "Nghe", "explain": "My colleagues, definitely. Bẫy: lương cũng tốt nhưng không phải điều thích nhất."}, {"q": "When does Tuan have English classes?", "options": ["On Tuesday and Thursday evenings.", "On Fridays.", "At weekends.", "Every morning."], "answer": "A", "tag": "Nghe", "explain": "on Tuesday and Thursday evenings. Bẫy: thứ Sáu là ngày làm ở nhà."}, {"q": "What might happen next year?", "options": ["Tuan might change jobs.", "Tuan might be sent to Singapore.", "Tuan might become a manager.", "Tuan might stop studying English."], "answer": "B", "tag": "Nghe", "explain": "I might be sent to work in Singapore next year."}]}, {"key": "x3c", "title": "Part C. Talk (66–70)", "directions": "You will hear a museum guide talking to a group of visitors.", "start": 66, "script": ["Speaker: Good morning, everyone. Welcome to the City History Museum. My name is Lan, and I'll be your guide today. Our tour will last about an hour and a half. We'll start on the ground floor, where you can see objects from the nineteenth century, and then move up to the first floor, which is about the history of the city after 1975. Please remember that you are not allowed to take photos with a flash, because the light can damage old objects. However, photos without a flash are fine. If you get separated from the group, please wait for us at the information desk next to the main entrance. After the tour, you are welcome to visit our café on the second floor. Students with a student card get a twenty percent discount there. The museum shop closes at five o'clock, half an hour before the museum itself. Now, if you'd like to follow me…"], "items": [{"q": "How long will the tour last?", "options": ["One hour.", "An hour and a half.", "Two hours.", "Half an hour."], "answer": "B", "tag": "Nghe", "explain": "about an hour and a half."}, {"q": "What can visitors see on the first floor?", "options": ["Objects from the 19th century.", "A café.", "The history of the city after 1975.", "The museum shop."], "answer": "C", "tag": "Nghe", "explain": "the first floor, which is about the history of the city after 1975. Đồ vật thế kỷ 19 ở tầng trệt."}, {"q": "What are visitors NOT allowed to do?", "options": ["Take photos with a flash.", "Take any photos.", "Drink coffee.", "Visit the shop."], "answer": "A", "tag": "Nghe", "explain": "not allowed to take photos with a flash; chụp không flash vẫn được."}, {"q": "Where should visitors wait if they get separated from the group?", "options": ["In the café.", "In the shop.", "Outside the main entrance.", "At the information desk."], "answer": "D", "tag": "Nghe", "explain": "wait for us at the information desk next to the main entrance."}, {"q": "What time does the museum close?", "options": ["At 4:30.", "At 5:00.", "At 5:30.", "At 6:00."], "answer": "C", "tag": "Nghe", "explain": "Cửa hàng đóng lúc 5 giờ, sớm hơn bảo tàng nửa tiếng → bảo tàng đóng 5:30. Bẫy: 5 giờ."}]}]}], "speaking": {"intro": "Please introduce yourself.", "topic": "Technology in daily life", "questions": ["How often do you use the Internet, and what for?", "What is the most useful app on your phone? Why?", "Do you think children spend too much time on screens?", "How has technology changed the way people work?"]}}}, "5": {"day": 5, "grammarTopic": "Câu gián tiếp + suggest / had better", "vocabTopic": "Cấu tạo từ", "speakingTopic": "Học tập & kế hoạch tương lai", "plan": [{"time": "0:00 – 0:15", "step": "Bài học", "content": "Câu gián tiếp, suggest / had better / advise, cấu tạo từ, cách soát lỗi sai"}, {"time": "0:15 – 0:35", "step": "Bài tập ngữ pháp", "content": "10 câu + 5 câu v
