iết lại (lấy từ 20 mẫu trong tài liệu trường)"}, {"time": "0:35 – 1:05", "step": "Đề trường · Test 1 (Paper 2)", "content": "Tab Luyện thêm: 9 câu điền + 10 câu Tìm lỗi sai trong 15 phút, rồi 5 câu viết lại"}, {"time": "1:05 – 1:15", "step": "Nghỉ", "content": ""}, {"time": "1:15 – 1:45", "step": "Đọc 2 bài (Test 1)", "content": "Tab Đọc: Origin of Jeans (10 phút). Tab Luyện thêm: Jeff Stringer (8 phút). Đọc câu hỏi trước, gạch từ khóa"}, {"time": "1:45 – 2:00", "step": "Chữa đọc", "content": "Xem câu chứa đáp án, học từ mới"}, {"time": "2:00 – 2:10", "step": "Nghỉ", "content": ""}, {"time": "2:10 – 2:40", "step": "Từ vựng", "content": "20 họ từ + 10 câu cấu tạo từ"}, {"time": "2:40 – 3:10", "step": "Luyện nói với Claude", "content": "Gõ “thi nói” trong cuộc trò chuyện: giới thiệu 4–5 câu + chủ đề Học tập"}, {"time": "3:10 – 3:20", "step": "Tổng kết", "content": "Quiz 10 câu"}], "grammar": {"sections": [{"title": "Câu gián tiếp: 4 loại câu", "headers": ["Loại câu", "Trực tiếp", "Gián tiếp", "Mẹo"], "rows": [["Câu kể", "She said, \"I am tired.\"", "She said (that) she was tired.", "said (that) + lùi thì. said to sb → told sb."], ["Hỏi Yes/No", "\"Are you hungry, Tom?\"", "She asked Tom if / whether he was hungry.", "asked + if/whether + S + V. KHÔNG đảo."], ["Hỏi Wh-", "\"Where do you live?\"", "He asked me where I lived.", "asked + wh- + S + V. Bỏ do/does/did, KHÔNG đảo."], ["Mệnh lệnh", "\"Don't be late.\"", "He told me not to be late.", "told / asked / warned + sb + (not) to V."]]}, {"title": "Lùi thì và đổi từ chỉ thời gian", "headers": ["Trực tiếp", "Gián tiếp"], "rows": [["am / is / are · V(s) · will · can", "was / were · V2 · would · could"], ["V2 · have/has + V3", "had + V3"], ["now · today · tonight", "then · that day · that night"], ["tomorrow · yesterday · next week", "the next day (the following day) · the day before · the following week"], ["here · this · these", "there · that · those"]]}, {"title": "Gợi ý và khuyên", "headers": ["Câu gốc", "Viết lại", "Mẹo"], "rows": [["\"Why don't you apply for the job, Ann?\" said Sue.", "Sue suggested that Ann (should) apply for the job.", "suggest + that + S + (should) + V nguyên mẫu, hoặc suggest + V-ing. KHÔNG có suggest sb to V."], ["Let's stay in this evening.", "Why don't we stay in this evening?", "Let's + V = Why don't we + V?"], ["You should leave now.", "You'd better leave now.", "had better + V nguyên mẫu; phủ định: had better not + V."], ["If I were you, I would rest.", "I advise you to rest.", "advise sb (not) to V."]]}, {"title": "Cấu tạo từ: nhìn vị trí chỗ trống", "headers": ["Vị trí", "Cần loại từ", "Ví dụ"], "rows": [["Sau a / the / my / his, hoặc làm chủ ngữ", "Danh từ (-tion, -ment, -ness, -ity, -ence, -ance)", "make a big difference · his success"], ["Trước danh từ; sau be / become / feel / seem", "Tính từ (-ful, -less, -ous, -ive, -able, -al)", "an energetic person · It becomes flexible."], ["Bổ nghĩa cho động từ hoặc tính từ", "Trạng từ (-ly)", "work productively · extremely high"], ["Nghĩa ngược lại", "Tiền tố un-, im-, in-, dis-, ir-", "impatient · dishonest · uncomfortable"], ["-ed / -ing", "-ed: người cảm thấy · -ing: vật gây ra cảm giác", "I'm bored. · The film is boring."]]}, {"title": "Tìm lỗi sai: soát 6 chỗ theo thứ tự", "headers": ["Soát", "Lỗi hay gặp trong đề trường", "Sửa"], "rows": [["1. Thì, chia động từ", "warned that a storm approached (đang tới)", "was approaching"], ["2. Loại từ", "becomes extremely flexibly · as frequent as possible", "flexible · frequently"], ["3. Liên từ", "despite she wasn't · Although …, but …", "although · bỏ but"], ["4. Số ít / nhiều, đếm được", "every fruits · the number of homework", "every fruit · the amount of"], ["5. Mạo từ", "a MP · only part of information", "an MP · the information"], ["6. Đại từ quan hệ", "Ginger capsules, that are sold…", "which (có dấu phẩy → không dùng that)"]]}], "notes": ["Câu hỏi gián tiếp là câu kể: không có dấu hỏi, không đảo trợ động từ.", "Động từ tường thuật ở hiện tại (says, asks) thì KHÔNG lùi thì.", "said + (to sb) + that…; told + sb + that… Không nói said me, không nói told that.", "Phần Tìm lỗi sai: mỗi câu chỉ có 1 lỗi. Đọc cả câu, rồi soát 4 chỗ gạch chân theo 6 bước trên. Không chắc thì chọn chỗ có vấn đề về loại từ hoặc liên từ trước."], "traps": [{"title": "Đảo trợ động từ trong câu hỏi gián tiếp", "wrong": "He asked me where did I live.", "right": "He asked me where I lived.", "why": "Gián tiếp là câu kể: S + V, bỏ did, lùi thì live → lived."}, {"title": "suggest sb to V", "wrong": "He suggested me to go home.", "right": "He suggested that I (should) go home. / He suggested going home.", "why": "suggest không đi với sb + to V. (advise / tell / ask thì đi được: advised me to go.)"}, {"title": "said me", "wrong": "She said me that she was busy.", "right": "She told me that she was busy. / She said to me that…", "why": "tell + người; say + (to người)."}]}, "grammarMcq": [{"q": "He asked me what time ___.", "options": ["did the film start", "the film started", "does the film start", "the film will start"], "answer": "B", "tag": "Câu gián tiếp", "explain": "Câu hỏi gián tiếp: wh- + S + V, không đảo, lùi thì → the film started."}, {"q": "Tom asked me ___ I could help him with his homework.", "options": ["that", "what", "which", "if"], "answer": "D", "tag": "Câu gián tiếp", "explain": "Câu hỏi Yes/No (Can you help me?) → asked + if/whether."}, {"q": "The doctor advised him ___ smoking.", "options": ["stop", "stopping", "stopped", "to stop"], "answer": "D", "tag": "Câu gián tiếp", "explain": "advise sb to V."}, {"q": "She suggested ___ to the beach at the weekend.", "options": ["go", "going", "to go", "went"], "answer": "B", "tag": "Suggest", "explain": "suggest + V-ing (hoặc suggest that + S + should + V)."}, {"q": "You'd better ___ an umbrella. It's going to rain.", "options": ["take", "to take", "taking", "took"], "answer": "A", "tag": "Had better", "explain": "had better + V nguyên mẫu, không có to."}, {"q": "He told me ___ late for the meeting again.", "options": ["to not be", "not be", "don't be", "not to be"], "answer": "D", "tag": "Câu gián tiếp", "explain": "Mệnh lệnh phủ định gián tiếp: told sb not to V."}, {"q": "She said that she ___ me the next day.", "options": ["will call", "calls", "would call", "called"], "answer": "C", "tag": "Câu gián tiếp", "explain": "\"I will call you tomorrow\" → lùi thì will → would; tomorrow → the next day."}, {"q": "My mother asked me whether I ___ my homework.", "options": ["had finished", "finished", "have finished", "finish"], "answer": "A", "tag": "Câu gián tiếp", "explain": "Trực tiếp: \"Have you finished…?\" → lùi thì have finished → had finished."}, {"q": "The children were very ___ when they heard the news about the trip.", "options": ["excited", "excite", "exciting", "excitement"], "answer": "A", "tag": "Cấu tạo từ", "explain": "Người cảm thấy → -ed: excited. exciting dùng cho vật gây hứng thú."}, {"q": "He drives very ___, so he has never had an accident.", "options": ["careful", "care", "carefully", "careless"], "answer": "C", "tag": "Cấu tạo từ", "explain": "Bổ nghĩa cho động từ drives → trạng từ carefully."}], "transform": [{"source": "\"Why don't you apply for the job, Ann?\" said Sue.", "start": "Sue suggested", "answers": ["Sue suggested that Ann should apply for the job.", "Sue suggested that Ann apply for the job.", "Sue suggested Ann should apply for the job.", "Sue suggested Ann apply for the job.", "Sue suggested that Ann applied for the job."], "tag": "Suggest", "explain": "Why don't you + V? → suggested that + S + (should) + V. Không viết suggested Ann to apply."}, {"source": "She said, \"Are you hungry, Tom?\"", "start": "She asked", "answers": ["She asked Tom if he was hungry.", "She asked Tom whether he was hungry."], "tag": "Câu gián tiếp", "explain": "Hỏi Yes/No → asked + người + if/whether + S + V lùi thì (are → was, you → he)."}, {"source": "\"Where did you buy your shoes, Sally?\" asked Gail.", "start": "Gail asked", "answers": ["Gail asked Sally where she had bought her shoes.", "Gail asked Sally where she bought her shoes."], "tag": "Câu gián tiếp", "explain": "Hỏi Wh-: where + S + V, bỏ did, lùi thì bought → had bought, your → her."}, {"source": "The teacher said to his student, \"Don't be late tomorrow.\"", "start": "The teacher told", "answers": ["The teacher told his student not to be late the next day.", "The teacher told his student not to be late the following day."], "tag": "Câu gián tiếp", "explain": "Mệnh lệnh phủ định → told sb not to V; tomorrow → the next day."}, {"source": "I advise you to go now or you'll be late.", "start": "You'd", "answers": ["You'd better go now or you'll be late.", "You'd better go now or you will be late.", "You'd better go now, or you'll be late."], "tag": "Had better", "explain": "advise sb to V ⇔ You'd better + V nguyên mẫu."}], "extra": {"title": "Đề trường · Practice Test 1", "note": "Câu hỏi lấy nguyên từ tài liệu ôn của trường. Làm 2 phần đầu trong 15 phút (đề thật: Paper 2 có 30 phút cho 35 câu), bài đọc 8 phút. Tìm lỗi sai: phần gạch chân được đánh dấu [ ](A)…(D), chọn chỗ PHẢI SỬA.", "sets": [{"key": "t1sc", "title": "Sentence completion (36–45)", "directions": "Choose the word or phrase which best completes each sentence.", "items": [{"q": "I live in Nha Trang, ___ is one of the most beautiful cities of Vietnam.", "options": ["that", "which", "where", "it"], "answer": "B", "tag": "Mệnh đề quan hệ", "explain": "Có dấu phẩy và ngay sau là động từ (is) → which. where cần S + V phía sau. Đây đúng là lỗi where/which của bạn."}, {"q": "Daniel won't be able to understand the speakers ___ there's an interpreter.", "options": ["if not", "if only", "unless", "provided"], "answer": "C", "tag": "Unless", "explain": "unless = nếu không: sẽ không hiểu NẾU KHÔNG có phiên dịch."}, {"q": "Trung drank only ___ water because he didn't play any sports.", "options": ["a few", "few", "a little", "little"], "answer": "C", "tag": "Lượng từ", "explain": "water không đếm được → little / a little. only a little = chỉ một ít. few / a few dùng cho danh từ đếm được."}, {"q": "What are you complaining about? It's so easy that ___ a baby can do it.", "options": ["even", "even if", "even though", "even that"], "answer": "A", "tag": "Liên từ", "explain": "even + danh từ = ngay cả. even if / even though cần mệnh đề."}, {"q": "The manager, ___ his factory's products were poor in quality, decided to give his workers further training.", "options": ["knowing", "known", "to know", "knew"], "answer": "A", "tag": "Rút gọn mệnh đề", "explain": "who knew → knowing (rút gọn chủ động dùng V-ing)."}, {"q": "I know he doesn't want to go to the meeting – but he shall go, ___ he likes it or not.", "options": ["although", "even though", "whether", "if"], "answer": "C", "tag": "Liên từ", "explain": "whether … or not = dù có … hay không."}, {"q": "\"Can you wait while I run into the library?\" – \"OK, ___ you hurry.\"", "options": ["unless", "even if", "as long as", "even though"], "answer": "C", "tag": "Câu điều kiện", "explain": "as long as = miễn là. Ngày 3 bạn chọn nhầm unless ở dạng này."}, {"q": "I'm much fitter now ___ all the exercise I take.", "options": ["since", "because", "ever since", "because of"], "answer": "D", "tag": "Liên từ", "explain": "Sau là cụm danh từ (all the exercise) → because of."}, {"q": "The man ___ by the dustbin stopped us and asked us for some money.", "options": ["stand", "stood", "standing", "was standing"], "answer": "C", "tag": "Rút gọn mệnh đề", "explain": "who was standing → standing. Câu đã có động từ chính (stopped) nên không thêm was standing."}]}, {"key": "t1err", "title": "Error identification (46–55)", "directions": "Each sentence has four underlined parts marked A, B, C or D. Identify the ONE that should be corrected.", "items": [{"q": "[When](A) she heard the loud [crash](B), Marge ran [outside](C) in the snow [despite](D) she wasn't wearing any shoes.", "options": ["When", "crash", "outside", "despite"], "answer": "D", "tag": "Liên từ", "explain": "Sau despite phải là danh từ / V-ing. Sau đây là mệnh đề (she wasn't wearing) → although."}, {"q": "Almost [every](A) fruits and vegetables contain riboflavin; the [richest](B) sources are [leafy](C) green vegetables [such as](D) spinach, kale, or turnip greens.", "options": ["every", "richest", "leafy", "such as"], "answer": "A", "tag": "Số ít / số nhiều", "explain": "every + danh từ SỐ ÍT. fruits and vegetables số nhiều → all."}, {"q": "Although he tried his [best](A) to be [the winner](B), [but](C) he failed [to win](D) the race.", "options": ["best", "the winner", "but", "to win"], "answer": "C", "tag": "Liên từ", "explain": "Although … but: chỉ dùng một trong hai → bỏ but."}, {"q": "[Some](A) parents have expressed [concern](B) about the [number](C) of [homework](D) their children have to do.", "options": ["Some", "concern", "number", "homework"], "answer": "C", "tag": "Số ít / số nhiều", "explain": "homework không đếm được → the amount of. the number of + danh từ đếm được số nhiều."}, {"q": "The [only](A) good way to get achievement in [learning](B) English is [to practise](C) it as [frequent](D) as possible.", "options": ["only", "learning", "to practise", "frequent"], "answer": "D", "tag": "Cấu tạo từ", "explain": "Bổ nghĩa cho động từ practise → trạng từ: as frequently as possible."}, {"q": "I [was just about](A) to enter the station [then](B) someone grabbed me [by the shoulders](C) and threw me [to the ground](D).", "options": ["was just about", "then", "by the shoulders", "to the ground"], "answer": "B", "tag": "Liên từ", "explain": "be about to V … when … = sắp làm gì thì… → when."}, {"q": "James has [always](A) wanted to go [into](B) politics and he has [just](C) been elected as [a MP](D).", "options": ["always", "into", "just", "a MP"], "answer": "D", "tag": "Mạo từ", "explain": "MP đọc /em piː/, bắt đầu bằng nguyên âm → an MP."}, {"q": "I [haven't used](A) the computer [since](B) last week, [therefore](C) I don't know [what's](D) wrong with it.", "options": ["haven't used", "since", "therefore", "what's"], "answer": "C", "tag": "Liên từ", "explain": "therefore không nối 2 mệnh đề sau dấu phẩy → so (hoặc tách câu: . Therefore, …)."}, {"q": "Children's games, which are amusements [involve](A) more than one individual, [appear to](B) be [culturally](C) [universal](D).", "options": ["involve", "appear to", "culturally", "universal"], "answer": "A", "tag": "Rút gọn mệnh đề", "explain": "amusements involving / that involve more than one individual. Đã có động từ chính appear nên involve phải đổi."}, {"q": "Ginger capsules, [that are](A) sold in [most](B) health-food stores, [have been](C) found [effective as](D) a remedy.", "options": ["that are", "most", "have been", "effective as"], "answer": "A", "tag": "Mệnh đề quan hệ", "explain": "Có dấu phẩy → không dùng that → which are."}]}, {"key": "t1read4", "title": "Bài đọc · Jeff Stringer – Judge (30–35)", "directions": "Read the passage and choose the best answer. Giới hạn 8 phút.", "passageTitle": "JEFF STRINGER – JUDGE", "passage": ["I've always enjoyed being with other people and I suppose I've always had a strong opinion about what is wrong and what is right, even from when I was a young child. That used to irritate my brothers and sisters because I would grass on them if they did something wrong. They had secrets that they wouldn't share with me and I probably missed out on a lot, because of that. Not that I blame them.", "I actually studied history at university and then, in my final year, I had a work placement in a lawyer's office. I was fascinated from day one and as soon as I graduated I applied to do a degree in law.", "I get a real buzz from fighting for justice, no matter what kind of case it is. It can be hard not to get emotionally involved at times. You have to follow your head and not your heart in such situations.", "I make it a personal rule not to take my work home with me. Once I leave the court, I switch off and concentrate on my family. They will always be my number one priority."], "items": [{"q": "Which of the following best describes the writer?", "options": ["A strict family man.", "A workaholic who puts work before family.", "A man who cares about his family and his clients.", "A judge that everyone fears."], "answer": "C", "tag": "Đọc: ý chính", "explain": "Đoạn 3: đấu tranh cho công lý, dễ xúc động vì thân chủ. Đoạn 4: gia đình là ưu tiên số 1. B ngược lại (không mang việc về nhà)."}, {"q": "Why did the writer's brothers and sisters get annoyed with him?", "options": ["Because he was always misbehaving.", "Because he was their parents' favourite child.", "Because he followed them all the time.", "Because he got them into trouble."], "answer": "D", "tag": "Đọc: chi tiết", "explain": "grass on sb = mách lẻo, tố cáo → làm anh chị em bị phạt (got them into trouble)."}, {"q": "What does he say about his job?", "options": ["He has a lot of job satisfaction.", "He often gets emotionally involved with his clients.", "He wins a lot of cases.", "It is hard."], "answer": "A", "tag": "Đọc: chi tiết", "explain": "get a real buzz from = rất hứng thú, thỏa mãn với công việc. B sai: 'at times' (thỉnh thoảng), không phải 'often'."}, {"q": "'such situations' (paragraph 3) refers to ___.", "options": ["when he gets a real buzz from his job", "when he fights a case", "when he gets emotionally involved", "when he follows his head and not his heart"], "answer": "C", "tag": "Đọc: từ quy chiếu", "explain": "Đọc câu ngay trước: It can be hard not to get emotionally involved at times → such situations = lúc bị cuốn theo cảm xúc."}, {"q": "What does the writer do at the end of the working day?", "options": ["Finish off any work that he has at home.", "Leave all his work problems at the court.", "Tell his family all about his working day.", "Worry overly about his family."], "answer": "B", "tag": "Đọc: chi tiết", "explain": "not to take my work home … Once I leave the court, I switch off = để hết công việc lại ở tòa."}, {"q": "Which of the following is the best description of how the writer feels about life?", "options": ["Positive and satisfied.", "Tense and worried.", "Ambitious but stressed.", "Relaxed but bored."], "answer": "A", "tag": "Đọc: thái độ người viết", "explain": "Thích công việc (real buzz), gia đình là ưu tiên → tích cực, hài lòng. Không có từ nào nói căng thẳng hay chán."}]}], "transform": [{"source": "Although the weather was good, we stayed indoors.", "start": "Despite", "answers": ["Despite the good weather, we stayed indoors.", "Despite the weather being good, we stayed indoors.", "Despite the fact that the weather was good, we stayed indoors."], "tag": "Liên từ", "explain": "Although + mệnh đề → Despite + cụm danh từ (the good weather)."}, {"source": "In spite of having an English name, he is in fact German.", "start": "Although", "answers": ["Although he has an English name, he is in fact German.", "Although he has an English name, he is German."], "tag": "Liên từ", "explain": "In spite of + V-ing → Although + S + V (thêm chủ ngữ he, chia has)."}, {"source": "I am not as good at football as he is.", "start": "He is", "answers": ["He is better at football than I am.", "He is better at football than me.", "He is better than me at football.", "He is better than I am at football."], "tag": "So sánh", "explain": "not as good as → đổi chủ ngữ, dùng so sánh hơn: better than."}, {"source": "He isn't old enough to vote.", "start": "He is too", "answers": ["He is too young to vote."], "tag": "Too / enough", "explain": "not old enough ↔ too young (tính từ trái nghĩa)."}, {"source": "It is impossible to learn a foreign language in a week.", "start": "Learning", "answers": ["Learning a foreign language in a week is impossible."], "tag": "It + be + adj + to V", "explain": "It is + adj + to V ⇔ V-ing + … + is + adj."}]}, "reading": {"title": "The Origin of Jeans (Test 1 · 11–17)", "minutes": 10, "paragraphs": ["In 1853, the California gold rush was in full swing and everyday items were in short supply. Levi Strauss, a 24-year-old German immigrant, left New York for San Francisco with a small supply of dry goods with the intention of opening a branch of his brother's New York dry goods business. Shortly after his arrival, a prospector wanted to know what Mr. Strauss was selling. When Strauss told him he had rough canvas cloth used for tents and wagon covers, the prospector said, 'You should have brought trousers!', because he couldn't find a pair of trousers strong enough to last.", "Levi Strauss had the canvas made into work trousers. Miners liked the trousers, but complained that the fabric was not very comfortable and tended to chafe. Levi Strauss substituted the canvas with a twilled cotton cloth from France called 'serge de Nimes.' The fabric later became known as denim and the trousers were nicknamed blue jeans. Then Levi Strauss and Nevada tailor David Jacobs co-patented the process of putting small metal rivets in places such as the sides of the pockets that needed extra strength. On May 20, 1873, they received U.S. Patent No. 139,121. This date is now considered the official birthday of 'blue jeans.'", "But why were they called blue jeans? Denim is unique in its singular connection with one colour. It is made from thread that is traditionally dyed with blue pigment obtained from indigo dye. Indigo was linked with practical fabrics and work clothing. The durability of indigo as a colour and its darkness of tone made it a good choice when frequent washing was not possible."], "questions": [{"q": "What is the purpose of this text?", "options": ["To sell a product.", "To solve a problem.", "To argue a point.", "To inform."], "answer": "D", "tag": "Đọc: mục đích bài", "explain": "Bài kể lịch sử ra đời của quần jeans, không bán hàng, không tranh luận → cung cấp thông tin.", "type": "Mục đích bài", "evidence": "But why were they called blue jeans?"}, {"q": "What was Levi Strauss's job?", "options": ["He was a clothes designer.", "He was a prospector.", "He was selling textile and clothing.", "He was selling tools for gold mining."], "answer": "C", "tag": "Đọc: chi tiết", "explain": "dry goods = vải vóc, quần áo; ông định mở chi nhánh cửa hàng dry goods. Prospector (người đi tìm vàng) là người khác trong bài.", "type": "Chi tiết", "evidence": "with a small supply of dry goods with the intention of opening a branch of his brother's New York dry goods business"}, {"q": "The expression 'in full swing' in line 1 most probably means ___.", "options": ["in trouble", "at the height of activity", "causing lots of chaos", "in decline"], "answer": "B", "tag": "Đọc: từ đồng nghĩa", "explain": "in full swing = đang lúc sôi động nhất. Đoán từ ngữ cảnh: cơn sốt vàng → mọi thứ khan hiếm vì quá nhiều người đổ về.", "type": "Cụm từ đồng nghĩa", "evidence": "the California gold rush was in full swing"}, {"q": "'in short supply' (line 1) means nearly the same as ___.", "options": ["going on for a short time", "lacking", "supplied in a very short time", "not of good quality"], "answer": "B", "tag": "Đọc: từ đồng nghĩa", "explain": "in short supply = khan hiếm, thiếu. Bẫy A, C: thấy chữ short nên đoán là 'ngắn'.", "type": "Cụm từ đồng nghĩa", "evidence": "everyday items were in short supply"}, {"q": "What problem did the prospector have?", "options": ["There were no trousers in California.", "They did not like Levi's product.", "Their clothes were not stylish.", "Their clothes wore out quickly."], "answer": "D", "tag": "Đọc: chi tiết", "explain": "couldn't find a pair of trousers strong enough to last = không tìm được quần đủ bền → quần áo nhanh rách (wore out quickly). A sai vì bài không nói California không có quần.", "type": "Chi tiết", "evidence": "he couldn't find a pair of trousers strong enough to last"}, {"q": "Where did the word 'denim' come from?", "options": ["The name of a French fabric.", "The indigo colour.", "David Jacobs, the tailor, thought of it.", "Levi Strauss invented it."], "answer": "A", "tag": "Đọc: chi tiết", "explain": "Vải 'serge de Nimes' từ Pháp, sau này gọi là denim.", "type": "Chi tiết", "evidence": "a twilled cotton cloth from France called 'serge de Nimes.' The fabric later became known as denim"}, {"q": "Which of the following best describes indigo dye?", "options": ["A long-lasting, practical colour that did not show dirt.", "A colour used on all kinds of fabric to make it stronger.", "A very rare and desirable colour that was difficult to create.", "An affordable dark colour that was only used by poor people."], "answer": "A", "tag": "Đọc: suy luận", "explain": "durability = bền màu; darkness of tone + không giặt thường xuyên được → màu tối, không lộ bẩn. B, C, D không có trong bài.", "type": "Suy luận", "evidence": "The durability of indigo as a colour and its darkness of tone made it a good choice when frequent washing was not possible"}], "newWords": [{"word": "gold rush", "pos": "n.", "ipa": "/ˈɡəʊld rʌʃ/", "meaning": "cơn sốt vàng"}, {"word": "in short supply", "pos": "phr.", "ipa": "/ɪn ʃɔːt səˈplaɪ/", "meaning": "khan hiếm"}, {"word": "immigrant", "pos": "n.", "ipa": "/ˈɪmɪɡrənt/", "meaning": "người nhập cư"}, {"word": "intention", "pos": "n.", "ipa": "/ɪnˈtenʃn/", "meaning": "ý định (with the intention of + V-ing)"}, {"word": "complain", "pos": "v.", "ipa": "/kəmˈpleɪn/", "meaning": "phàn nàn (complain that / about)"}, {"word": "substitute", "pos": "v.", "ipa": "/ˈsʌbstɪtjuːt/", "meaning": "thay thế (substitute A with B)"}, {"word": "durability", "pos": "n.", "ipa": "/ˌdjʊərəˈbɪləti/", "meaning": "độ bền (durable: bền)"}, {"word": "frequent", "pos": "adj.", "ipa": "/ˈfriːkwənt/", "meaning": "thường xuyên"}]}, "vocab": [{"phrase": "decide → decision", "pos": "họ từ", "ipa": "/dɪˈsaɪd/ · /dɪˈsɪʒn/", "meaning": "quyết định (v → n)", "colloc": "make a decision", "example": "It was a difficult decision."}, {"phrase": "succeed → success → successful → successfully", "pos": "họ từ", "ipa": "/səkˈsiːd/ · /səkˈses/", "meaning": "thành công (v → n → adj → adv)", "colloc": "succeed in V-ing · a great success", "example": "She worked hard and became successful."}, {"phrase": "achieve → achievement", "pos": "họ từ", "ipa": "/əˈtʃiːv/ · /əˈtʃiːvmənt/", "meaning": "đạt được → thành tích", "colloc": "achieve a goal · a great achievement", "example": "Passing the exam was a big achievement."}, {"phrase": "differ → different → difference", "pos": "họ từ", "ipa": "/ˈdɪfrənt/ · /ˈdɪfrəns/", "meaning": "khác → khác biệt → sự khác biệt", "colloc": "make a difference · different from", "example": "Small changes can make a big difference."}, {"phrase": "energy → energetic", "pos": "họ từ", "ipa": "/ˈenədʒi/ · /ˌenəˈdʒetɪk/", "meaning": "năng lượng → tràn đầy năng lượng", "colloc": "feel energetic", "example": "I feel more energetic after exercise."}, {"phrase": "produce → product → productive → productively", "pos": "họ từ", "ipa": "/prəˈdjuːs/ · /prəˈdʌktɪv/", "meaning": "sản xuất → sản phẩm → năng suất → một cách năng suất", "colloc": "work productively", "example": "We need to make our workers more productive."}, {"phrase": "flexible → flexibly → flexibility", "pos": "họ từ", "ipa": "/ˈfleksəbl/", "meaning": "linh hoạt", "colloc": "flexible working hours", "example": "Ash wood becomes flexible when it is exposed to steam."}, {"phrase": "severe → severely", "pos": "họ từ", "ipa": "/sɪˈvɪə(r)/", "meaning": "nghiêm trọng → một cách nghiêm trọng", "colloc": "severe effects · severely damaged", "example": "The disease can have severe effects on the species."}, {"phrase": "wealth → wealthy", "pos": "họ từ", "ipa": "/welθ/ · /ˈwelθi/", "meaning": "sự giàu có → giàu có", "colloc": "the pursuit of wealth", "example": "The novel is about the pursuit of wealth and love."}, {"phrase": "comfort → comfortable → uncomfortable", "pos": "họ từ", "ipa": "/ˈkʌmftəbl/", "meaning": "sự thoải mái → thoải mái → không thoải mái", "colloc": "feel uncomfortable", "example": "These shoes are very comfortable."}, {"phrase": "patient → impatient → patience", "pos": "họ từ", "ipa": "/ˈpeɪʃnt/ · /ɪmˈpeɪʃnt/", "meaning": "kiên nhẫn → thiếu kiên nhẫn → sự kiên nhẫn", "colloc": "Don't be so impatient.", "example": "Learning a language needs patience."}, {"phrase": "honest → dishonest → honesty", "pos": "họ từ", "ipa": "/ˈɒnɪst/", "meaning": "trung thực → không trung thực → sự trung thực", "colloc": "an honest person", "example": "I'm an honest person and I hate lying."}, {"phrase": "possible → impossible → possibility", "pos": "họ từ", "ipa": "/ˈpɒsəbl/ · /ɪmˈpɒsəbl/", "meaning": "có thể → không thể → khả năng", "colloc": "It is impossible to…", "example": "It is impossible to learn a language in a week."}, {"phrase": "responsible → responsibility", "pos": "họ từ", "ipa": "/rɪˈspɒnsəbl/ · /rɪˌspɒnsəˈbɪləti/", "meaning": "có trách nhiệm → trách nhiệm", "colloc": "take responsibility for", "example": "Parents have a responsibility to protect their children."}, {"phrase": "excite → excited → exciting → excitement", "pos": "họ từ", "ipa": "/ɪkˈsaɪtɪd/ · /ɪkˈsaɪtɪŋ/", "meaning": "-ed: người cảm thấy; -ing: vật gây ra", "colloc": "be excited about · an exciting film", "example": "The children were excited about the trip."}, {"phrase": "surprise → surprised → surprising", "pos": "họ từ", "ipa": "/səˈpraɪzd/ · /səˈpraɪzɪŋ/", "meaning": "ngạc nhiên (-ed người, -ing vật)", "colloc": "be surprised at · a surprising result", "example": "The children were surprised when the teacher closed the books."}, {"phrase": "frequent → frequently → frequency", "pos": "họ từ", "ipa": "/ˈfriːkwənt/ · /ˈfriːkwəntli/", "meaning": "thường xuyên → một cách thường xuyên → tần suất", "colloc": "practise frequently", "example": "Practise English as frequently as possible."}, {"phrase": "care → careful → careless → carefully", "pos": "họ từ", "ipa": "/ˈkeəfl/ · /ˈkeələs/", "meaning": "cẩn thận → bất cẩn → một cách cẩn thận", "colloc": "drive carefully · a careless driver", "example": "The car crashed because the driver was careless."}, {"phrase": "intelligent → intelligence", "pos": "họ từ", "ipa": "/ɪnˈtelɪdʒənt/ · /ɪnˈtelɪdʒəns/", "meaning": "thông minh → trí thông minh", "colloc": "intelligent enough to…", "example": "He was intelligent enough to understand my gestures."}, {"phrase": "economy → economic → economical", "pos": "họ từ", "ipa": "/ɪˈkɒnəmi/ · /ˌiːkəˈnɒmɪk/", "meaning": "nền kinh tế → thuộc kinh tế → tiết kiệm", "colloc": "economic problems", "example": "Population growth has caused serious social and economic problems."}], "vocabMcq": [{"q": "Small changes like these can make a big ___.", "options": ["difference", "differ", "different", "differently"], "answer": "A", "tag": "Cấu tạo từ", "explain": "Sau a big cần danh từ: make a difference."}, {"q": "She speaks English very ___ after living in London for two years.", "options": ["fluent", "fluently", "fluency", "fluence"], "answer": "B", "tag": "Cấu tạo từ", "explain": "Bổ nghĩa cho động từ speaks → trạng từ fluently."}, {"q": "Passing the exam was a great ___ for him.", "options": ["achieve", "achieved", "achievement", "achievable"], "answer": "C", "tag": "Cấu tạo từ", "explain": "Sau a great cần danh từ: achievement."}, {"q": "The film was so ___ that I fell asleep.", "options": ["bored", "boredom", "bore", "boring"], "answer": "D", "tag": "Cấu tạo từ", "explain": "Vật gây ra cảm giác → -ing: boring."}, {"q": "Don't be so ___. We've only been waiting a few minutes.", "options": ["impatient", "unpatient", "dispatient", "inpatient"], "answer": "A", "tag": "Cấu tạo từ", "explain": "Trái nghĩa của patient là impatient (tiền tố im- trước p). Câu này có trong đề trường Test 1."}, {"q": "We need to work more ___ to finish the project on time.", "options": ["productive", "productively", "production", "product"], "answer": "B", "tag": "Cấu tạo từ", "explain": "Bổ nghĩa cho động từ work → trạng từ productively."}, {"q": "He is an ___ man; he never tells lies.", "options": ["dishonest", "honesty", "honest", "honestly"], "answer": "C", "tag": "Cấu tạo từ", "explain": "Trước danh từ man cần tính từ; never tells lies → honest."}, {"q": "It is ___ to learn a foreign language in a week.", "options": ["possibly", "unpossible", "possibility", "impossible"], "answer": "D", "tag": "Cấu tạo từ", "explain": "It is + tính từ; nghĩa ngược → impossible (không có unpossible)."}, {"q": "I felt very ___ when I forgot her name.", "options": ["embarrassed", "embarrassing", "embarrass", "embarrassment"], "answer": "A", "tag": "Cấu tạo từ", "explain": "Người cảm thấy → -ed: embarrassed."}, {"q": "Parents have a ___ to look after their children.", "options": ["responsible", "responsibility", "responsibly", "irresponsible"], "answer": "B", "tag": "Cấu tạo từ", "explain": "Sau a cần danh từ: responsibility."}], "speaking": {"introTitle": "Bài giới thiệu 4–5 câu (điền thông tin của bạn, nói tự nhiên, đừng đọc thuộc lòng)", "intro": ["Good morning. My name is ___ and I'm from ___.", "I graduated from ___ University, majoring in ___.", "At the moment, I'm working as a/an ___ at ___. I have worked there for ___ years.", "I'd like to do a master's degree in ___ because ___.", "In my free time, I enjoy ___."], "frame": "Ý chính → Lý do (because…) → Ví dụ (For example…). Mỗi câu trả lời 2–4 câu là đủ.", "rescue": ["Sorry, could you repeat the question, please?", "Do you mean…?", "That's a good question. Let me think…", "I'm not sure, but I think…", "In my opinion… because…"], "questions": [{"q": "Why did you choose your major at university?", "hint": "Quá khứ đơn: I chose… because I was interested in… (không dùng have chosen)."}, {"q": "What did you find most difficult when you were a student?", "hint": "The most difficult thing was + V-ing… For example, in my second year, I…"}, {"q": "Why do you want to study for a master's degree at this university?", "hint": "I want to… because… Nhắc tên trường, ngành, và 1 lý do công việc."}, {"q": "How will a master's degree help your career?", "hint": "It will help me… / I'm going to… Nói 1 ví dụ cụ thể trong công việc."}, {"q": "What would you do if you didn't pass this exam?", "hint": "Điều kiện loại 2: If I didn't pass, I would… (would + V nguyên mẫu)."}], "rubric": ["Trôi chảy, tương tác được với giám khảo", "Ngữ pháp (thì, câu gián tiếp, điều kiện)", "Từ vựng đúng chủ đề học tập", "Phát âm (âm cuối -s, -ed, trọng âm)", "Trả lời đúng câu hỏi, có lý do và ví dụ"]}, "reviewQuiz": [{"q": "He asked me if I ___ him the day before.", "options": ["had seen", "have seen", "saw", "see"], "answer": "A", "tag": "Câu gián tiếp", "explain": "\"Did you see me yesterday?\" → lùi thì saw → had seen; yesterday → the day before."}, {"q": "Da Nang, ___ my brother works, is a beautiful city.", "options": ["which", "where", "that", "who"], "answer": "B", "tag": "Mệnh đề quan hệ", "explain": "Sau là my brother works, đủ S + V → where."}, {"q": "She suggested ___ a taxi because it was late.", "options": ["take", "to take", "taking", "took"], "answer": "C", "tag": "Suggest", "explain": "suggest + V-ing."}, {"q": "You'd better ___ your parents where you are going.", "options": ["to tell", "telling", "told", "tell"], "answer": "D", "tag": "Had better", "explain": "had better + V nguyên mẫu."}, {"q": "Unless you ___ harder, you will fail.", "options": ["study", "don't study", "will study", "studied"], "answer": "A", "tag": "Unless", "explain": "Unless + khẳng định, hiện tại đơn."}, {"q": "He drove ___ and had an accident.", "options": ["careless", "care", "careful", "carelessly"], "answer": "D", "tag": "Cấu tạo từ", "explain": "Bổ nghĩa cho drove → trạng từ carelessly."}, {"q": "I ___ to Hue last month.", "options": ["have gone", "went", "had gone", "have been went"], "answer": "B", "tag": "Quá khứ đơn", "explain": "last month → quá khứ đơn."}, {"q": "The teacher told us ___ in the library.", "options": ["not talk", "don't talk", "not to talk", "to not talking"], "answer": "C", "tag": "Câu gián tiếp", "explain": "told sb not to V."}, {"q": "If I ___ more time, I would learn to cook.", "options": ["have", "will have", "had", "had had"], "answer": "C", "tag": "Câu điều kiện", "explain": "would + V → loại 2 → If + V2."}, {"q": "Despite ___ tired, she finished the report.", "options": ["she was", "was", "be", "being"], "answer": "D", "tag": "Liên từ", "explain": "Despite + V-ing."}]}, "6": {"day": 6, "grammarTopic": "Chiến thuật làm đề 90 câu", "vocabTopic": "Ôn qua đề", "speakingTopic": "Thi nói thử toàn bộ", "plan": [{"time": "0:00 – 0:10", "step": "Đọc chiến thuật", "content": "Tab Chiến thuật: phân bổ thời gian, dạng câu hỏi đọc, cách soát Tìm lỗi sai"}, {"time": "0:10 – 1:10", "step": "Thi thử 2: Paper 1", "content": "10 từ vựng + 4 bài đọc (25 câu) trong 60 phút, không xem tài liệu"}, {"time": "1:10 – 1:40", "step": "Thi thử 2: Paper 2", "content": "35 câu trong 30 phút: điền câu, Tìm lỗi sai, điền đoạn, viết lại"}, {"time": "1:40 – 1:50", "step": "Nghỉ", "content": ""}, {"time": "1:50 – 2:15", "step": "Thi thử 2: Paper 3", "content": "Nghe 20 câu, mỗi đoạn phát 2 lần"}, {"time": "2:15 – 2:25", "step": "Nghỉ", "content": ""}, {"time": "2:25 – 3:05", "step": "Chữa đề", "content": "Đọc giải thích câu sai; gửi Claude % từng Paper"}, {"time": "3:05 – 3:30", "step": "Thi nói thử với Claude", "content": "Gõ “thi nói thử”: giới thiệu + bốc thăm chủ đề (đổi được 1 lần) + hỏi qua lại"}, {"time": "3:30 – 3:40", "step": "Tổng kết", "content": "Quiz 10 câu lỗi hay gặp"}], "grammar": {"sections": [{"title": "Phân bổ thời gian (đề thật)", "headers": ["Phần", "Số câu", "Thời gian", "Cách làm"], "rows": [["Paper 1 · Vocabulary", "10", "6 phút", "Đọc cả câu; loại đáp án sai collocation trước."], ["Paper 1 · 4 bài đọc", "25", "~13 phút / bài", "Đọc câu hỏi trước → scan từ khóa → câu hỏi mục đích / tiêu đề làm cuối."], ["Paper 2 · Sentence completion", "10", "6 phút", "Nhìn dấu hiệu: thì, sau chỗ trống là danh từ hay mệnh đề."], ["Paper 2 · Error identification", "10", "8 phút", "Soát 6 bước (thì → loại từ → liên từ → số ít/nhiều → mạo từ → đại từ quan hệ)."], ["Paper 2 · Cloze", "10", "8 phút", "Đọc cả câu chứa chỗ trống và câu trước đó."], ["Paper 2 · Transformation", "5", "8 phút", "Chữ bắt đầu cho biết mẫu; chép lại phần không đổi, chỉ sửa phần cấu trúc."]]}, {"title": "Dạng câu hỏi đọc trong đề trường", "headers": ["Dạng", "Hỏi kiểu", "Mẹo"], "rows": [["Mục đích / ý chính", "What is the writer trying to do? · best title / headline", "Làm CUỐI. Chọn đáp án bao cả bài; loại đáp án chỉ đúng 1 đoạn."], ["Chi tiết", "According to paragraph 2… · What did X do?", "Đáp án là câu trong bài được viết lại bằng từ khác. Đáp án chép y nguyên chữ trong bài thường là bẫy."], ["Cụm từ / thành ngữ", "'in full swing' most probably means…", "Đọc câu trước và sau, thay từng đáp án vào chỗ cụm từ."], ["Quy chiếu", "'that' / 'such situations' refers to…", "Nhìn câu hoặc cụm ngay PHÍA TRƯỚC."], ["NOT / CANNOT be inferred", "Which is NOT mentioned?", "Tìm 3 đáp án có trong bài; đáp án còn lại là câu trả lời."], ["Người viết sẽ nói gì", "What might the writer say to a friend?", "Mỗi đáp án có 2–3 chi tiết; chỉ 1 chi tiết sai là loại."]]}], "notes": ["Không để trống câu nào. Hết giờ thì đoán.", "Đậu = trung bình ≥ 50% và không phần nào bị điểm liệt. Phần nào dưới 40% là vùng nguy hiểm.", "Bài đọc thứ 4 thường dài và khó nhất: nếu bí, làm các câu chi tiết trước, bỏ qua câu suy luận rồi quay lại."], "traps": [{"title": "Chọn đáp án có từ giống y trong bài", "wrong": "Thấy 'three years' trong bài → chọn 'it took three years'.", "right": "Đọc kỹ: 'Three years ago … a five-month course' → khóa học kéo dài 5 tháng.", "why": "Đề hay lấy số, từ có trong bài làm bẫy. Đáp án đúng thường được diễn đạt lại."}, {"title": "Đọc hết bài rồi mới xem câu hỏi", "wrong": "Đọc kỹ 650 từ của bài 4 rồi mới đọc câu hỏi → hết giờ.", "right": "Đọc câu hỏi trước, gạch từ khóa, rồi tìm đoạn chứa đáp án.", "why": "Paper 1 chỉ có 60 phút cho 35 câu."}, {"title": "Tìm lỗi sai: chọn chỗ 'nghe lạ'", "wrong": "Chọn 'culturally universal' vì thấy lạ.", "right": "Soát theo 6 bước; lỗi thật là 'involve' (thiếu -ing / that).", "why": "Lỗi luôn là lỗi ngữ pháp rõ ràng, không phải từ khó."}]}, "speaking": {"introTitle": "Thi nói thử với Claude (gõ “thi nói thử” trong cuộc trò chuyện)", "intro": ["Phần 1: Claude hỏi \"Could you introduce yourself?\" → nói 4–5 câu như bài ngày 5, tự nhiên, không đọc thuộc.", "Claude có thể hỏi thêm 1–2 câu về bài giới thiệu (Why did you choose…?).", "Phần 2: Claude bốc thăm 1 chủ đề; bạn được đổi 1 lần.", "Claude hỏi qua lại 4–6 câu và hỏi vặn theo câu trả lời của bạn.", "Cuối buổi: điểm ước tính /20 + 3 điểm cần sửa."], "frame": "Ý chính → Lý do (because…) → Ví dụ (For example…). 2–4 câu mỗi lượt.", "rescue": ["Sorry, could you repeat the question, please?", "Do you mean…?", "That's a good question. Let me think…", "I'm not sure, but I think…", "In my opinion… because…"], "questions": [{"q": "Could you introduce yourself?", "hint": "4–5 câu: tên, quê, học gì, làm gì, vì sao học thạc sĩ."}, {"q": "Chủ đề có thể bốc: gia đình · quê hương · học tập · công việc · sở thích · kế hoạch tương lai · công nghệ · môi trường · lợi ích ngoại ngữ", "hint": "Dùng bộ ý chung: công việc hiện tại, lý do học thạc sĩ, việc học tiếng Anh, 1 sở thích."}], "rubric": ["Trôi chảy, tương tác được", "Ngữ pháp", "Từ vựng", "Phát âm", "Nội dung có lý do và ví dụ"]}, "reviewQuiz": [{"q": "I ___ my keys yesterday.", "options": ["have lost", "lost", "had lost", "have been lost"], "answer": "B", "tag": "Quá khứ đơn", "explain": "yesterday → quá khứ đơn."}, {"q": "This is the village ___ my father grew up.", "options": ["which", "that", "where", "who"], "answer": "C", "tag": "Mệnh đề quan hệ", "explain": "my father grew up đủ nghĩa → where."}, {"q": "This is the village ___ I visited last summer.", "options": ["where", "which", "when", "whose"], "answer": "B", "tag": "Mệnh đề quan hệ", "explain": "I visited (thăm cái gì?) thiếu tân ngữ → which."}, {"q": "We ___ English for five years.", "options": ["have been learned", "learned", "have learned", "had been learned"], "answer": "C", "tag": "Hiện tại hoàn thành", "explain": "Chủ động → không có been."}, {"q": "If I had a car, I ___ to work.", "options": ["drove", "will drive", "would drive", "had driven"], "answer": "C", "tag": "Câu điều kiện", "explain": "Loại 2: vế chính would + V."}, {"q": "I spend two hours ___ every day.", "options": ["to study", "studying", "study", "studied"], "answer": "B", "tag": "It takes / spend", "explain": "spend + time + V-ing."}, {"q": "___ the rain, we went out.", "options": ["Although", "Despite", "Because", "However"], "answer": "B", "tag": "Liên từ", "explain": "Sau là danh từ → Despite."}, {"q": "She asked me where ___.", "options": ["did I work", "I worked", "do I work", "I am work"], "answer": "B", "tag": "Câu gián tiếp", "explain": "Không đảo: where + S + V."}, {"q": "He suggested ___ a break.", "options": ["to take", "take", "taking", "took"], "answer": "C", "tag": "Suggest", "explain": "suggest + V-ing."}, {"q": "The house ___ in 2010.", "options": ["built", "has built", "has been built", "was built"], "answer": "D", "tag": "Bị động", "explain": "Vật + in 2010 → was built."}], "exam": {"title": "Đề thi thử 2 · format đề thật 90 câu", "meta": "Paper 1: 60 phút · Paper 2: 30 phút · Paper 3: ~25 phút", "note": "Paper 1 và Paper 2 là nguyên Practice Test 6 trong tài liệu ôn của trường; phần nghe do Claude soạn lời thoại theo câu hỏi của đề. Làm đúng giờ: Paper 1 60 phút, Paper 2 30 phút, rồi Paper 3. Đậu khi trung bình ≥ 50% và không phần nào bị điểm liệt.", "papers": [{"title": "PAPER 1 – Reading Comprehension", "minutes": 60, "parts": [{"key": "y1a", "title": "Part A. Vocabulary (1–10)", "directions": "Choose the word or phrase which best completes each sentence.", "start": 1, "items": [{"q": "She took twice the prescribed ___ of sleeping tablets.", "options": ["portion", "dose", "amount", "ration"], "answer": "B", "tag": "Từ vựng", "explain": "dose = liều (thuốc). the prescribed dose = liều được kê."}, {"q": "\"The man who has made up his ___ to win will never say 'impossible.'\" – Napoleon Bonaparte", "options": ["idea", "decision", "mind", "brain"], "answer": "C", "tag": "Collocation", "explain": "make up one's mind = quyết tâm, quyết định."}, {"q": "Patricia's a funny woman. She always tells ___ stories.", "options": ["horrible", "amusing", "boring", "casual"], "answer": "B", "tag": "Từ vựng", "explain": "funny → amusing (gây cười)."}, {"q": "Thomas was feeling sleepy because he ___ up late doing his homework.", "options": ["put", "showed", "turned", "stayed"], "answer": "D", "tag": "Phrasal verb", "explain": "stay up late = thức khuya. turn up = xuất hiện; show up = có mặt; put up = dựng lên."}, {"q": "Young children often ___ what they see others doing.", "options": ["regard", "irritate", "imitate", "relate"], "answer": "C", "tag": "Từ vựng", "explain": "imitate = bắt chước. irritate = làm khó chịu (dễ nhầm vì giống mặt chữ)."}, {"q": "This canned soup ___ a lot of salt.", "options": ["remains", "contains", "holds", "involves"], "answer": "B", "tag": "Từ vựng", "explain": "contain = chứa (thành phần). involve = bao gồm (hoạt động)."}, {"q": "I couldn't tell what time it was because the workmen had removed the ___ of the clock.", "options": ["pointers", "hands", "arms", "fingers"], "answer": "B", "tag": "Từ vựng", "explain": "the hands of a clock = kim đồng hồ."}, {"q": "I'm glad to ___ Miss Fionna to you. She will go to your school next month to teach English.", "options": ["recommend", "command", "present", "suggest"], "answer": "C", "tag": "Từ vựng", "explain": "present sb to sb = giới thiệu (trang trọng). recommend = gợi ý, tiến cử."}, {"q": "Fred was ___ in a road accident and couldn't walk normally for half a month.", "options": ["harmed", "wounded", "injured", "damaged"], "answer": "C", "tag": "Từ dễ nhầm", "explain": "injured = bị thương do tai nạn. wounded = bị thương do vũ khí; damaged dùng cho đồ vật."}, {"q": "When we came back from holiday our suitcases were ___ by the customs officer.", "options": ["guarded", "tested", "corrected", "examined"], "answer": "D", "tag": "Từ vựng", "explain": "examine = kiểm tra kỹ (hành lý ở hải quan)."}]}, {"key": "y1b1", "title": "Part B. First passage (11–16)", "directions": "Read the passages and choose the answer which you think fits best.", "start": 11, "passageTitle": "Quantum of Solace", "passage": ["I'm a big fan of films featuring the spy James Bond. I've got most of them on DVD. We've recently bought Quantum of Solace, in which Daniel Craig plays the part of Bond. I don't know why the films got that name – but it's a great movie anyway.", "All the actors who've played James Bond have been great, but Daniel Craig, who's made lots of other films, plays the part better than any of them. Even though he doesn't talk very much, I think he's the most perfect actor for the role. He even does a few of the more dangerous things in the film himself, instead of getting someone else to do them. I did wonder sometimes whether he'd be clever enough to defeat bad people – but I'm not going to tell you the ending! The actress who stars with Craig gives a fantastic performance too – I love all the glamorous clothes she wore!", "The director probably had a hard job making this Bond film as full of action as earlier ones. But the excitement starts right at the beginning here, with a car chase along a mountain road, and plenty of other thrilling scenes, too – Bond leaping off tall buildings and so on. Unfortunately I found the story difficult to follow in places, and it also seemed to be over very quickly – it lasted under two hours. I also felt there weren't as many jokes as in the old Bond films. And where was all the ridiculous Bond equipment – the underwater car or exploding watch that everyone laughed at? This is a more serious, darker Bond film, but I still enjoyed it."], "items": [{"q": "What is the writer trying to do in this essay?", "options": ["Explain what first attracted her to Bond films.", "Tell readers about the Bond DVDs she owns.", "Give a balanced view of a Bond film she has seen.", "Describe how Daniel Craig got the part of James Bond."], "answer": "C", "tag": "Đọc: mục đích bài", "explain": "Bài vừa khen (diễn viên, hành động) vừa chê (khó theo dõi, ít đùa) → balanced view."}, {"q": "What can a reader find out from this essay?", "options": ["Whether Quantum of Solace is her favourite Bond film.", "What other films Daniel Craig has made.", "Which other actors have played James Bond.", "Whether she thinks Daniel Craig is the best James Bond."], "answer": "D", "tag": "Đọc: chi tiết", "explain": "plays the part better than any of them → cô ấy cho rằng Craig là Bond hay nhất. B, C bài không kể tên."}, {"q": "What does the writer tell us about Craig in the new Bond film?", "options": ["He performs some of the action scenes.", "He wears some stylish clothes.", "He is given a lot of lines to say.", "He looks strong and fit enough to fight the criminals."], "answer": "A", "tag": "Đọc: chi tiết", "explain": "He even does a few of the more dangerous things in the film himself. Quần áo đẹp là của nữ diễn viên; he doesn't talk very much nên C sai."}, {"q": "What is one problem with the film, according to the writer?", "options": ["It seems a bit too long.", "It's sometimes hard to understand what's happening.", "It has too much silly technology in it.", "It has jokes that aren't very funny."], "answer": "B", "tag": "Đọc: chi tiết", "explain": "difficult to follow in places = có chỗ khó hiểu. A ngược (over very quickly); C ngược (không có đồ chơi kỳ quặc)."}, {"q": "Which of the following does NOT describe Quantum of Solace?", "options": ["Exciting.", "Short.", "Ridiculous.", "Serious."], "answer": "C", "tag": "Đọc: NOT mentioned", "explain": "Phim hấp dẫn (exciting), ngắn (under two hours), nghiêm túc (more serious). Ridiculous là đồ chơi trong phim CŨ."}, {"q": "Which of these might appear in a magazine review of the new Bond film?", "options": ["'It's full of excitement, with Bond jumping across rooftops, so don't be disappointed by the slow start.'", "'The director wanted to move away from the last Bond film and include a bit less action.'", "'I'm not sure the title tells you much … but be prepared to watch a rather different kind of Bond movie.'", "'Daniel Craig performed well as James Bond, but the main female star was disappointing.'"], "answer": "C", "tag": "Đọc: suy luận", "explain": "Khớp 2 ý trong bài: không hiểu tên phim + phim nghiêm túc, khác phim cũ. A sai (mở đầu rất hấp dẫn), D sai (nữ diễn viên rất hay)."}]}, {"key": "y1b2", "title": "Part B. Second passage (17–22)", "start": 17, "passageTitle": "Cycling in the countryside", "passage": ["Have you ever been cycling? This spring my older brother and I left the busy city and spent a long weekend cycling in the countryside. Our average speed was only around 14 kph, but that didn't matter. We hadn't come to break any speed records, or to get fit and healthy. All we wanted was some fresh air and a break from schoolwork. My bike only once went more than 30 kph, and that was when I raced my brother down the only hill on our route.", "We really enjoyed cycling along flat, traffic-free country paths. There was plenty of spring sunshine, but it was quite cold, especially in the mornings. We didn't mind, though – and we soon warmed up as we rode along. Our only problem was when my brakes started making a terrible noise. But I didn't mind as it gave us an excuse to visit a café while a helpful bike mechanic had a look at it.", "That was one of the best things about our route: every few kilometres there was a village where we could find everything we needed. All the local people were really friendly, too. However, most places we stopped at served chips with all the meals, which soon got fairly boring.", "One night we were woken at 4 a.m. by a group of rugby fans singing loudly in the hotel corridor. We were tired and bad-tempered when we set off the next morning and nearly got lost, but soon felt more cheerful when the sun came out. That's what I like about cycling – it's simple and it's fun. If you're looking for a short break that's active and cheap, then cycling is a great choice."], "items": [{"q": "What is the writer doing in the text?", "options": ["Describing the different places he saw while cycling.", "Comparing cycling to other forms of exercise.", "Pointing out the differences between cycling in the city and cycling in the countryside.", "Recommending cycling as a good type of holiday."], "answer": "D", "tag": "Đọc: mục đích bài", "explain": "Câu kết: If you're looking for a short break … cycling is a great choice → khuyên đi xe đạp."}, {"q": "What do we find out about the writer's bike?", "options": ["It wasn't as good as his brother's.", "It was too old to go fast.", "It needed attention at one point.", "It had trouble going uphill."], "answer": "C", "tag": "Đọc: chi tiết", "explain": "Phanh kêu to, thợ sửa xe phải xem → needed attention."}, {"q": "The writer was pleased because ___.", "options": ["he and his brother had chosen a good route", "he felt much healthier than before he began his trip", "he met other people who were keen on cycling", "he went away at the best time of year for cycling"], "answer": "A", "tag": "Đọc: chi tiết", "explain": "one of the best things about our route: every few kilometres there was a village… → chọn tuyến đường tốt."}, {"q": "What did the writer dislike about his trip?", "options": ["Breaking down.", "The food.", "The weather.", "Getting lost."], "answer": "B", "tag": "Đọc: chi tiết", "explain": "chips with all the meals, which soon got fairly boring → chán đồ ăn. Xe hỏng thì anh ấy 'didn't mind'."}, {"q": "Which of the following does NOT describe his holiday?", "options": ["For a change.", "To get fit.", "Active.", "Short and cheap."], "answer": "B", "tag": "Đọc: NOT mentioned", "explain": "We hadn't come … to get fit and healthy → không phải để rèn sức khỏe."}, {"q": "What might the writer say in a postcard to a friend?", "options": ["'I'm having a great holiday, spending lots of time in friendly cafés and enjoying being by myself for once.'", "'I'm getting really fit cycling so fast up and down the hills in this part of the countryside.'", "'I'm pleased to be away from cars and lorries for a change. Having a good time, despite some problems.'", "'I'm enjoying cycling with my brother this weekend, and staying at a very quiet hotel in this countryside.'"], "answer": "C", "tag": "Đọc: suy luận", "explain": "traffic-free paths + vài trục trặc (phanh, đồ ăn, ồn) nhưng vẫn vui. A sai (đi với anh trai), B sai (đường bằng, chỉ 1 đồi), D sai (khách sạn ồn)."}]}, {"key": "y1b3", "title": "Part B. Third passage (23–29)", "start": 23, "passageTitle": "The Western Alphabet", "passage": ["The western alphabet, which is used in Europe, the Americas, Africa, Australia and New Zealand as well as in other countries, originated in the Middle East. The people who gave the world this alphabet were the Phoenicians, a people who established colonies all over the Mediterranean, including Carthage in Africa and Gades in Spain. In their alphabet, the letters were represented by little pictures which represented sounds. The Phoenician A was aleph, which means 'bull', and it was made from a little picture of a bull's head. The letter B was beth, which meant 'house', and showed the round-roofed buildings which you can still see today in Syria.", "The Phoenicians had contact with another nation of sailors, the Greeks, with whom they fought and traded. The Greeks also started to use the Phoenician alphabet. They changed the names so aleph and beth became alpha and beta. The shapes of the letters are the same but they have been turned sideways. If you know any Greek, you can try turning the letters around again, and see how they look. You will see that the curve on the right of the Greek A becomes the horns of a little bull.", "Of course, the first two letters of the alphabet (alpha + beta) give it its name. Over the years there have been changes. Latin developed an alphabet with some different letters to the Greeks, and other letters have been added since. But really westerners are using the same system of writing which has served them so well for thousands of years."], "items": [{"q": "What is the purpose of this text?", "options": ["To tell something of Phoenician history.", "To tell the story of why we write as we do.", "To compare the western alphabet with other alphabets.", "To describe the life of sailors in the Mediterranean."], "answer": "B", "tag": "Đọc: mục đích bài", "explain": "Cả bài kể nguồn gốc bảng chữ cái phương Tây (vì sao ta viết như hiện nay). A chỉ là một phần."}, {"q": "Where did the Phoenicians come from originally?", "options": ["Carthage.", "Gades.", "The Middle East.", "All over the Mediterranean."], "answer": "C", "tag": "Đọc: chi tiết", "explain": "Bảng chữ cái originated in the Middle East, do người Phoenicia tạo ra. Carthage, Gades chỉ là thuộc địa (colonies) họ lập sau."}, {"q": "What can be said about the Phoenician alphabet?", "options": ["The Phoenicians got it from the colonies.", "The letters were represented by little pictures.", "It is still used in today's Syria.", "The letter B means 'bull' and showed a picture of a bull's head."], "answer": "B", "tag": "Đọc: chi tiết", "explain": "the letters were represented by little pictures. C bẫy: ở Syria vẫn còn NHÀ mái tròn, không phải bảng chữ. D nhầm A với B."}, {"q": "Which change did the Greeks make to the Phoenician alphabet?", "options": ["They changed the pictures to sounds.", "They turned the letters in a different direction.", "They altered the shapes of the letters.", "They put a curve on the letter A."], "answer": "B", "tag": "Đọc: chi tiết", "explain": "The shapes are the same but they have been turned sideways. C sai vì hình dạng giữ nguyên."}, {"q": "The information in the text is meant to be ___.", "options": ["entertaining", "informative", "funny", "challenging"], "answer": "B", "tag": "Đọc: mục đích bài", "explain": "Bài cung cấp kiến thức lịch sử → informative."}, {"q": "What is a conclusion from the text?", "options": ["The Phoenician alphabet has been the best in the world.", "Without colonies, we wouldn't have today's western alphabet.", "The Latin alphabet was an improvement on the Greek alphabet.", "The system of writing that came from the Phoenicians has been very useful for westerners for thousands of years."], "answer": "D", "tag": "Đọc: suy luận", "explain": "Câu cuối: the same system of writing which has served them so well for thousands of years."}, {"q": "Which picture, according to the text, represents beth?", "options": ["A building with a round roof.", "A tall, square building with windows.", "A bull's head with horns.", "A house with a chimney."], "answer": "A", "tag": "Đọc: chi tiết", "explain": "beth = house, showed the round-roofed buildings. (Đề gốc là 4 hình vẽ; ở đây ghi bằng chữ.) C là aleph."}]}, {"key": "y1b4", "title": "Part B. Fourth passage (30–35)", "start": 30, "passageTitle": "Life on an island", "passage": ["We live on the island of Hale. It's about four kilometres long and two kilometres wide, and it's joined to the mainland by a narrow road – called the Stand – built across the mouth of a river which separates us from the rest of the country. Most of the time you wouldn't know we're on an island because the river mouth between us and the mainland is just a vast stretch of tall grasses and brown mud. But when there's a high tide and the water rises a half metre or so above the road and nothing can pass until the tide goes out again a few hours later, then you know it's an island.", "We were on our way back from the mainland. My older brother, Dominic, had just finished his first year at university in a town 150 km away. Dominic's train was due in at five and he'd asked for a lift back from the station. Now, Dad normally hates being disturbed when he's writing (which is just about all the time), and he also hates going anywhere, but despite the sighs and moans (why can't he get a taxi? what's wrong with the bus?), I could tell by the sparkle in his eyes that he was really looking forward to seeing Dominic.", "So, anyway, Dad and I had driven to the mainland and picked up Dominic from the station. He had been talking non-stop since he'd slung his rucksack in the boot and got in the car. University this, university that, writers, books, parties, people, money, gigs… And when I say talking, I don't mean talking as in having a conversation, I mean talking as in jabbering like a mad thing. I didn't like it… the way he spoke and waved his hands around as if he was some kind of intellectual or something. It was embarrassing. It made me feel uncomfortable – that kind of discomfort you feel when someone you like, someone close to you, suddenly starts acting like a complete idiot. And I didn't like the way he was ignoring me, either. For all the attention I was getting I might as well not have been there. I felt a stranger in my own car.", "As we approached the island on that Friday afternoon, the tide was low and the Stand welcomed us home, stretched out before us, clean and dry, beautifully hazy in the heat – a raised strip of grey concrete bound by white railings and a low footpath on either side, with rough cobbled banks leading down to the water. Beyond the railings, the water was glinting with that wonderful silver light we sometimes get here in the late afternoon which lazes through to the early evening.", "We were about halfway across when I saw the boy. My first thought was how odd it was to see someone walking on the Stand. You don't often see people walking around here. Between Hale and Moulton (the nearest town about thirty kilometres away on the mainland), there's nothing but small cottages, farmland, heathland and a couple of hills. So islanders don't walk because of that. If they're going to Moulton they tend to take the bus. So the only pedestrians you're likely to see around here are walkers or bird-watchers. But even from a distance I could tell that the figure ahead didn't fit into either of these categories. I wasn't sure how I knew, I just did.", "As we drew closer, he became clearer. He was actually a young man rather than a boy. Although he was on the small side, he wasn't as slight as I'd first thought. He wasn't exactly muscular, but he wasn't weedy-looking either. It's hard to explain. There was a sense of strength about him, a graceful strength that showed in his balance, the way he held himself, the way he walked…"], "items": [{"q": "In the first paragraph, what is the writer's main point about the island?", "options": ["It can be dangerous to try to cross from the mainland.", "It is much smaller than it looks from the mainland.", "It is completely cut off at certain times.", "It can be a difficult place for people to live in."], "answer": "C", "tag": "Đọc: ý chính đoạn", "explain": "Khi thủy triều lên, nước ngập đường, nothing can pass → bị cô lập hoàn toàn vào những lúc đó."}, {"q": "What does the writer suggest about her father?", "options": ["His writing prevents him from doing things he wants to with his family.", "His initial reaction to his son's request is different from usual.", "His true feelings are easily hidden from his daughter.", "His son's arrival is one event he will take time off for."], "answer": "D", "tag": "Đọc: suy luận", "explain": "Bố ghét bị làm phiền và ghét đi đâu, nhưng vẫn đi đón và mắt sáng lên → chuyện con trai về là việc ông chịu bỏ thời gian. C sai: con gái nhìn ra ngay (I could tell)."}, {"q": "The writer emphasises her feelings of discomfort because she ___.", "options": ["is embarrassed that she doesn't understand what her brother is talking about", "feels confused about why she can't relate to her brother anymore", "is upset by the unexpected change in her brother's behaviour", "feels foolish that her brother's attention is so important to her"], "answer": "C", "tag": "Đọc: suy luận", "explain": "someone close to you suddenly starts acting like a complete idiot → khó chịu vì anh trai thay đổi bất ngờ."}, {"q": "In the fourth paragraph, what is the writer's purpose in describing the island?", "options": ["To express her positive feeling about it.", "To explain how the road was built.", "To illustrate what kind of weather was usual.", "To describe her journey home."], "answer": "A", "tag": "Đọc: mục đích đoạn", "explain": "welcomed us home, beautifully hazy, wonderful silver light → tình cảm tích cực với hòn đảo."}, {"q": "In 'because of that' (paragraph 5), 'that' refers to the fact that ___.", "options": ["locals think it's odd to walk anywhere", "it's easier for people to take the bus than walk", "people have everything they need on the island", "there's nowhere in particular to walk to from the island"], "answer": "D", "tag": "Đọc: từ quy chiếu", "explain": "Câu ngay trước: giữa Hale và Moulton chẳng có gì ngoài nhà nhỏ, ruộng, đồi → không có nơi nào để đi bộ tới."}, {"q": "What do we learn about the writer's reaction to the boy?", "options": ["She felt his air of confidence contrasted with his physical appearance.", "She was able to come up with a reason for him being there.", "She realised her first impression of him was inaccurate.", "She thought she had seen him somewhere before."], "answer": "C", "tag": "Đọc: suy luận", "explain": "actually a young man rather than a boy … wasn't as slight as I'd first thought → ấn tượng đầu tiên không chính xác. B sai: I wasn't sure how I knew."}]}]}, {"title": "PAPER 2 – Grammar & Use of English", "minutes": 30, "parts": [{"key": "y2a", "title": "Part A. Sentence completion (36–45)", "directions": "Choose the word or phrase which best completes each sentence.", "start": 36, "items": [{"q": "The man sitting next to us on the plane was nervous because he ___ before.", "options": ["hasn't flown", "didn't fly", "hadn't flown", "wasn't flying"], "answer": "C", "tag": "Quá khứ hoàn thành", "explain": "Mốc quá khứ (was nervous), chưa bay trước lúc đó → hadn't flown. Đúng lỗi have/had của bạn."}, {"q": "That awful drilling noise, ___ from our neighbour's house across the street, woke us up.", "options": ["come", "comes", "came", "coming"], "answer": "D", "tag": "Rút gọn mệnh đề", "explain": "which came → coming (rút gọn chủ động). Câu đã có động từ chính woke."}, {"q": "\"How many pages ___ so far?\" – \"Sixteen.\"", "options": ["do you study", "did you study", "have you studied", "had you studied"], "answer": "C", "tag": "Hiện tại hoàn thành", "explain": "so far → hiện tại hoàn thành."}, {"q": "\"Do you like football?\" – \"No, I have ___ interest in it.\"", "options": ["little", "a few", "a little", "few"], "answer": "A", "tag": "Lượng từ", "explain": "interest không đếm được; nghĩa phủ định (hầu như không) → little. a little = một chút (tích cực)."}, {"q": "It's a beautiful photo. I'm going to ___.", "options": ["get it enlarging", "have it enlarging", "have it enlarged", "set it enlarged"], "answer": "C", "tag": "Have sth done", "explain": "have + vật + V3 = nhờ người khác làm."}, {"q": "The ___ is just around the corner and you won't miss it.", "options": ["bicycle's shop", "bicycle shop", "bicycles shop", "bicycles' shop"], "answer": "B", "tag": "Danh từ ghép", "explain": "Danh từ ghép: danh từ đứng trước làm tính từ, để số ít, không 's: a bicycle shop."}, {"q": "___ these plants regularly or they will die.", "options": ["Water", "If you water", "Unless you water", "Because you water"], "answer": "A", "tag": "Câu mệnh lệnh", "explain": "Mệnh lệnh + or + hậu quả. If you water … or … không hợp nghĩa."}, {"q": "Our parents join hands to give us ___ nice house and ___ happy home.", "options": ["a / the", "a / a", "Ø / Ø", "the / a"], "answer": "B", "tag": "Mạo từ", "explain": "Nhắc lần đầu, danh từ đếm được số ít → a … a …"}, {"q": "I wish I ___ work today. I'm so tired.", "options": ["mustn't", "needn't", "don't have to", "didn't have to"], "answer": "D", "tag": "Câu ước", "explain": "Ước trái hiện tại → wish + V2: didn't have to."}, {"q": "Just think! This time tomorrow we ___ on a beach in Nha Trang.", "options": ["will be", "are lying", "will be lying", "will have lain"], "answer": "C", "tag": "Tương lai tiếp diễn", "explain": "This time tomorrow → will be + V-ing."}]}, {"key": "y2b", "title": "Part B. Error identification (46–55)", "directions": "Each sentence has four underlined parts marked [ ](A)–(D). Identify the ONE that should be corrected.", "start": 46, "items": [{"q": "[On June 14th](A), in Carmel, Indiana, [a woman](B) saw a [strange bright light](C) moving around [on](D) the sky.", "options": ["On June 14th", "a woman", "strange bright light", "on"], "answer": "D", "tag": "Giới từ", "explain": "in the sky, không phải on the sky."}, {"q": "We [were listening](A) to the radio when suddenly the music [stopped](B) and the announcer [warned](C) that a severe storm [approached](D) the area.", "options": ["were listening", "stopped", "warned", "approached"], "answer": "D", "tag": "Thì động từ", "explain": "Cơn bão đang tiến tới vào lúc đó → was approaching."}, {"q": "[As soon as](A) Cecil got home, she [turned on](B) her computer to check her e-mail, [even if](C) she was [really](D) tired.", "options": ["As soon as", "turned on", "even if", "really"], "answer": "C", "tag": "Liên từ", "explain": "Sự thật đã xảy ra (cô ấy mệt thật) → even though. even if dùng cho giả định."}, {"q": "I was born and grew up in France [but](A) Italy is the country [where](B) I have grown to love and [where](C) I [now live](D).", "options": ["but", "where (B: the country where)", "where (C: and where)", "now live"], "answer": "B", "tag": "Mệnh đề quan hệ", "explain": "grown to love (yêu cái gì?) THIẾU tân ngữ → which/that. Chữ where thứ hai đúng vì I now live đã đủ nghĩa. Đây chính là lỗi where/which của bạn."}, {"q": "[Wood](A) from the ash tree becomes extremely [flexibly](B) when [it](C) is [exposed](D) to steam.", "options": ["Wood", "flexibly", "it", "exposed"], "answer": "B", "tag": "Cấu tạo từ", "explain": "Sau become cần tính từ → flexible."}, {"q": "Since the world [began](A), nations [have had](B) difficulty [to keep](C) peace [with](D) their neighbours.", "options": ["began", "have had", "to keep", "with"], "answer": "C", "tag": "V-ing / to V", "explain": "have difficulty + V-ing → keeping."}, {"q": "[To think](A) that Rick was a liar, Barbara refused [even](B) to listen to him [even though](C) Harriet explained that he really was [telling the truth](D).", "options": ["To think", "even", "even though", "telling the truth"], "answer": "A", "tag": "Rút gọn mệnh đề", "explain": "Nghĩa nguyên nhân (vì nghĩ rằng…) → Thinking (= Because she thought)."}, {"q": "John [tried](A) to finish [his research](B) but he [found](C) only part of [information](D) that he needed.", "options": ["tried", "his research", "found", "information"], "answer": "D", "tag": "Mạo từ", "explain": "Thông tin được xác định bằng mệnh đề that he needed → the information."}, {"q": "The problem is [that](A) we don't have [room enough](B) in the car to [take](C) your mother [with](D) us.", "options": ["that", "room enough", "take", "with"], "answer": "B", "tag": "Too / enough", "explain": "enough đứng TRƯỚC danh từ: enough room."}, {"q": "John had [so interesting](A) and creative [plans](B) that everyone [wanted](C) to work [with him](D).", "options": ["so interesting", "plans", "wanted", "with him"], "answer": "A", "tag": "So / such", "explain": "Có danh từ (plans) → such + adj + N: such interesting and creative plans."}]}, {"key": "y2c", "title": "Part C. Cloze (56–65)", "directions": "Fill each numbered blank with the best word (A, B, C or D).", "start": 56, "passageTitle": "Global warming and wildlife", "passage": ["Despite the wealth of information campaigns telling people about global warming and its causes, most people have yet to realize (56) ___. Coming climate changes could alter as much as (57) ___ of plant and animal habitats by the end of the 22nd century. These changes could in (58) ___ cause widespread extinctions among plant and animal (59) ___ around the globe.", "Coastal and island habitats are perhaps in the greatest danger (60) ___ they face the combined threats of warming oceans and rising sea (61) ___. As habitats change, many animals will come (62) ___ intense pressure to find more suitable homes for themselves. Mass migrations of at least some animals are certainly to be expected, but the fact remains that many animals will simply not be able to move fast enough.", "Such dire predictions (63) ___ sound alarming, but they are based on the rather moderate estimate (64) ___ the amount of carbon dioxide in the atmosphere will double by 2100. Many scientists believe, however, that this figure is actually very conservative, and they claim that a tripling is far more (65) ___. If they are correct, the effects on nature will be even more dramatic."], "items": [{"q": "Chỗ trống (56)", "options": ["how the problem is severe", "how severe is the problem", "how severe the problem is", "the problem is how severe"], "answer": "C", "tag": "Câu hỏi gián tiếp", "explain": "Mệnh đề danh từ: how + adj + S + V (không đảo)."}, {"q": "Chỗ trống (57)", "options": ["one-thirds", "one-third", "one-three", "the third"], "answer": "B", "tag": "Từ vựng", "explain": "Phân số 1/3 = one-third (tử số 1 → mẫu số số ít)."}, {"q": "Chỗ trống (58)", "options": ["turn", "result", "order", "line"], "answer": "A", "tag": "Collocation", "explain": "in turn = đến lượt nó, rồi từ đó."}, {"q": "Chỗ trống (59)", "options": ["types", "genres", "categories", "species"], "answer": "D", "tag": "Từ vựng", "explain": "plant and animal species = các loài động thực vật."}, {"q": "Chỗ trống (60)", "options": ["although", "since", "providing", "therefore"], "answer": "B", "tag": "Liên từ", "explain": "since = bởi vì (nêu lý do vùng ven biển nguy hiểm nhất)."}, {"q": "Chỗ trống (61)", "options": ["heights", "altitudes", "levels", "tides"], "answer": "C", "tag": "Collocation", "explain": "sea levels = mực nước biển."}, {"q": "Chỗ trống (62)", "options": ["from", "under", "across", "by"], "answer": "B", "tag": "Giới từ", "explain": "come under pressure = chịu áp lực."}, {"q": "Chỗ trống (63)", "options": ["may", "must", "can", "ought to"], "answer": "A", "tag": "Động từ khuyết thiếu", "explain": "may … but … = có thể nghe đáng sợ, nhưng… (nhượng bộ)."}, {"q": "Chỗ trống (64)", "options": ["which", "what", "that", "why"], "answer": "C", "tag": "Mệnh đề", "explain": "the estimate that + mệnh đề đầy đủ = ước tính rằng…"}, {"q": "Chỗ trống (65)", "options": ["truthful", "proper", "exact", "realistic"], "answer": "D", "tag": "Từ vựng", "explain": "far more realistic = sát thực tế hơn nhiều."}]}, {"key": "y2d", "title": "Part D. Sentence transformation (66–70)", "directions": "Finish each sentence so that it means the same as the sentence before it.", "start": 66, "transform": [{"source": "The film was so funny that I burst out laughing.", "start": "It was such", "answers": ["It was such a funny film that I burst out laughing."], "tag": "So / such", "explain": "so + adj ⇔ such + a + adj + N + that."}, {"source": "I first met my boyfriend in 2016.", "start": "I have", "answers": ["I have known my boyfriend since 2016."], "tag": "Hiện tại hoàn thành", "explain": "first met … in 2016 → have known … since 2016. Dùng know (quen biết) chứ không phải have met."}, {"source": "Peter advised me to sell the shares immediately.", "start": "Peter suggested", "answers": ["Peter suggested that I should sell the shares immediately.", "Peter suggested that I sell the shares immediately.", "Peter suggested I should sell the shares immediately.", "Peter suggested selling the shares immediately.", "Peter suggested I sell the shares immediately."], "tag": "Suggest", "explain": "suggest that + S + (should) +
