nibar → khách sạn.", "script": ["Man: I'd like to check out, please. Room three-oh-five.", "Woman: Certainly, sir. Did you take anything from the minibar?"]}, {"q": "Where are the speakers?", "options": ["In the office.", "At a restaurant.", "In a cab.", "On a bus."], "answer": "C", "tag": "Nghe", "explain": "Khách bảo tài xế chở tới khách sạn → taxi (cab).", "script": ["Woman: Could you take us to the Rex Hotel, please?", "Man: Sure. With this traffic, it'll take about twenty minutes."]}, {"q": "Where did the man put the umbrella?", "options": ["Upstairs.", "By the front door.", "Outside.", "Near the elevator."], "answer": "B", "tag": "Nghe", "explain": "I put it by the front door. Bẫy: upstairs là chỗ cô ấy đoán.", "script": ["Woman: Have you seen my umbrella? Is it upstairs?", "Man: No, I put it by the front door when you came in."]}, {"q": "Where are the speakers?", "options": ["On a bus.", "In a cab.", "At a fair.", "In a store."], "answer": "D", "tag": "Nghe", "explain": "Hỏi giá áo, giảm giá, mặc thử → cửa hàng.", "script": ["Man: How much is this shirt?", "Woman: It's three hundred thousand dong, but it's twenty percent off today. Would you like to try it on?"]}, {"q": "Where are the speakers?", "options": ["In a grocery store.", "In a restaurant.", "In a kitchen.", "On an airplane."], "answer": "A", "tag": "Nghe", "explain": "Tìm trứng ở quầy số 5, cạnh sữa → siêu thị, cửa hàng thực phẩm.", "script": ["Man: Excuse me, where can I find the eggs?", "Woman: In aisle five, next to the milk. And the bread is on special offer today."]}, {"q": "Where is the woman going?", "options": ["To a bookstore.", "To the library.", "To school.", "To the police station."], "answer": "B", "tag": "Nghe", "explain": "Trả sách trước khi quá hạn, mượn thêm → thư viện. Bẫy: bookstore cũng có sách nhưng không mượn được.", "script": ["Man: Where are you off to?", "Woman: I need to return these books before they're overdue, and maybe borrow a few more."]}, {"q": "Where is the man?", "options": ["In Los Angeles.", "At an airport.", "At a travel agency.", "On an airplane."], "answer": "C", "tag": "Nghe", "explain": "Nhân viên đặt vé máy bay và khách sạn cho anh ấy → công ty du lịch. Bẫy: Los Angeles là nơi anh ấy SẼ đến.", "script": ["Woman: I can book you a flight to Los Angeles on Friday, and a hotel near the beach.", "Man: Great. How much would that be altogether?"]}, {"q": "Where are the speakers?", "options": ["In an office.", "In a gym.", "In a garage.", "In a park."], "answer": "B", "tag": "Nghe", "explain": "work out, running machine, lift weights → phòng tập.", "script": ["Woman: How often do you come here to work out?", "Man: Three times a week. I usually do half an hour on the running machine and then lift some weights."]}]}, {"key": "y3b", "title": "Part B. Long conversation (81–85)", "directions": "You will hear an interview with Angela Morgan, who has recently flown around the world in a helicopter.", "start": 81, "script": ["Interviewer: Angela, you've just flown around the world in a helicopter. Why did you do it?", "Angela: Well, it was a great adventure, of course, but the main reason was to raise money for a children's hospital. We collected over two hundred thousand pounds.", "Interviewer: You're fifty-eight now. Do you feel older after such a long trip?", "Angela: Not at all! My children have all left home, and I hate sitting around. I like to be busy all the time, so the trip was perfect for me.", "Interviewer: When did you learn to fly?", "Angela: Three years ago. I did a five-month course at a flying school near my home. My teacher, Jenny, came with me on the trip. My husband thought we were crazy!", "Interviewer: Did you see much of the countries you visited?", "Angela: Sadly, no. We usually stayed only one night in each place, so there was almost no time for sightseeing. We just ate, slept and checked the helicopter.", "Interviewer: What did you enjoy most?", "Angela: Flying over the desert was a bit frightening, but the best thing was watching the land below us change, from mountains to forests to the sea."], "items": [{"q": "The main reason for Angela's trip was to ___.", "options": ["make money for her business", "make money for other people", "have an exciting adventure", "do it before she was too old"], "answer": "B", "tag": "Nghe", "explain": "the main reason was to raise money for a children's hospital. Bẫy: great adventure được nói trước."}, {"q": "About her life now, Angela ___.", "options": ["feels much older", "likes to be active and busy", "is lonely without her children", "feels different inside"], "answer": "B", "tag": "Nghe", "explain": "I like to be busy all the time."}, {"q": "When Angela had flying lessons, ___.", "options": ["her course lasted five months", "it took her three years to be able to fly", "she got to know her teacher well", "her husband took lessons as well"], "answer": "A", "tag": "Nghe", "explain": "a five-month course. Bẫy: three years ago là thời điểm học, không phải thời gian học."}, {"q": "During the trip, Angela and her teacher ___.", "options": ["did very little sightseeing", "carried all the water they needed", "had engine problems several times", "spent many days in each country"], "answer": "A", "tag": "Nghe", "explain": "almost no time for sightseeing; chỉ ở 1 đêm mỗi nơi."}, {"q": "On the trip, Angela most enjoyed ___.", "options": ["flying at night", "walking in the desert", "watching the changes in the scenery", "having frightening experiences"], "answer": "C", "tag": "Nghe", "explain": "the best thing was watching the land below us change."}]}, {"key": "y3c", "title": "Part C. Talk (86–90)", "directions": "You will hear a recorded message about an arts festival.", "start": 86, "script": ["Speaker: Thank you for calling the Bury Arts Festival information line. This year's festival runs from the twelfth to the twenty-eighth of May. At the Theatre Royal, there is opera on the eighteenth and twentieth of May, and on the nineteenth you can enjoy a new comedy by local writer Sam Holt. From Monday to Friday, there are free lunchtime jazz concerts at the Corn Exchange. Soft drinks and sandwiches are on sale, but please note that no wine is sold at lunchtime. In the cathedral, the Market Players will perform a play about the history of the town every evening at eight. Finally, on Sunday the twenty-fifth, there is a special day at Ickworth House: a guided walk through the gardens in the morning, followed by an afternoon concert on the lawn. Tickets for all events are available from the box office."], "items": [{"q": "When does the festival take place?", "options": ["12 to 18 May.", "12 to 20 May.", "12 to 28 May.", "20 to 28 May."], "answer": "C", "tag": "Nghe", "explain": "from the twelfth to the twenty-eighth of May."}, {"q": "What is on at the Theatre Royal on 19 May?", "options": ["Jazz.", "A comedy.", "Opera.", "Classical music."], "answer": "B", "tag": "Nghe", "explain": "Opera vào ngày 18 và 20; ngày 19 là a new comedy."}, {"q": "What do they sell during lunchtime jazz concerts at the Corn Exchange?", "options": ["Soft drinks and sandwiches.", "Wine and sandwiches.", "Soft drinks and light meals.", "Wine and soft drinks."], "answer": "A", "tag": "Nghe", "explain": "Soft drinks and sandwiches; no wine."}, {"q": "What is on at the cathedral?", "options": ["Music.", "Poetry.", "Films.", "A play."], "answer": "D", "tag": "Nghe", "explain": "perform a play about the history of the town."}, {"q": "What does the programme offer at Ickworth?", "options": ["A walk and a book reading.", "A concert and a meal.", "A walk and a concert.", "A concert and a book reading."], "answer": "C", "tag": "Nghe", "explain": "a guided walk … followed by an afternoon concert."}]}]}], "speaking": {"intro": "Please introduce yourself.", "topic": "Bốc thăm: The environment (được đổi 1 lần sang: Technology in your life)", "questions": ["What environmental problems are there in your city?", "What do you do to protect the environment?", "Should the government ban plastic bags? Why or why not?", "What will your city be like in 20 years?"]}}}, "7": {"day": 7, "grammarTopic": "Tổng ôn + làm lại câu đã sai", "vocabTopic": "20 mẫu viết lại câu", "speakingTopic": "Giới thiệu + bộ ý dùng chung", "plan": [{"time": "0:00 – 0:20", "step": "Tổng ôn 1 trang", "content": "Tab Tổng ôn: dấu hiệu thì, where/which, 20 mẫu viết lại, 6 bước soát lỗi"}, {"time": "0:20 – 1:00", "step": "Làm lại câu đã sai", "content": "Tab Luyện thêm: các câu bạn từng sai từ ngày 1 + câu viết lại"}, {"time": "1:00 – 1:10", "step": "Nghỉ", "content": ""}, {"time": "1:10 – 1:35", "step": "20 mẫu viết lại", "content": "12 câu theo mẫu trong tài liệu trường (tab Luyện thêm, cuối trang)"}, {"time": "1:35 – 1:50", "step": "Đọc 1 bài bấm giờ", "content": "Tom Cruise (Test 2), 10 phút"}, {"time": "1:50 – 2:10", "step": "Nói", "content": "Nói to bài giới thiệu 3 lần + 1 chủ đề ngẫu nhiên với Claude"}, {"time": "2:10 – 2:20", "step": "Quiz cuối", "content": "10 câu, rồi nghỉ sớm, ngủ đủ"}], "grammar": {"sections": [{"title": "Thì: 1 câu hỏi chốt", "headers": ["Thấy", "Dùng", "Không dùng"], "rows": [["yesterday, ago, last…, in 2019, when I was young", "Quá khứ đơn (V2)", "have/has + V3"], ["so far, since, for, yet, already, ever, … times", "have/has + V3", "V2"], ["by + mốc quá khứ, before/when + V2 (việc xảy ra trước)", "had + V3", "have/has + V3"], ["Câu chủ động (người tự làm)", "have + V3", "have BEEN + V3 (đó là bị động)"]]}, {"title": "Where hay which: nhìn PHÍA SAU chỗ trống", "headers": ["Sau chỗ trống", "Chọn", "Ví dụ"], "rows": [["Động từ ngay sau", "which", "Da Lat, which is famous for flowers"], ["S + V còn thiếu tân ngữ", "which", "the hotel which we booked · the country which I love"], ["S + V đã đủ nghĩa", "where", "the hotel where we stayed · the café where I meet friends"]]}, {"title": "20 mẫu viết lại câu (tài liệu trường)", "headers": ["Mẫu", "Công thức"], "rows": [["1. although ↔ despite", "Although + S + V ⇔ Despite / In spite of + N / V-ing"], ["2. So sánh", "not as … as ⇔ -er than (đổi chủ ngữ) · No one … -er than ⇔ the -est"], ["3. enough / so…that / such…that", "so + adj + that ⇔ such + a + adj + N + that ⇔ (not) adj enough to V"], ["4. It is + adj + to V", "It is hard to learn ⇔ Learning … is hard"], ["5. ago / since / for", "started … ago ⇔ have V3 for · last V2 in ⇔ haven't V3 since"], ["6–7. should / had better / advise", "should V ⇔ had better V · If I were you, I'd V ⇔ I advise you to V"], ["8. too … to", "too + adj + to V ⇔ not + adj trái nghĩa + enough to V"], ["9. If (loại 2, 3)", "Hiện tại → If + V2, would V · Quá khứ → If + had V3, would have V3"], ["10. if ↔ unless", "If … not ⇔ Unless (bỏ not)"], ["11. wish", "Hiện tại → wish + V2 · Quá khứ → wish + had V3"], ["12. Bị động", "be + V3 theo đúng thì; vật làm chủ ngữ"], ["13. Nhờ bảo", "have + vật + V3 · have + người + V · get + người + to V"], ["14. because ↔ because of", "because + mệnh đề ⇔ because of / due to + N"], ["15. It takes ↔ spend", "It takes sb + time + to V ⇔ sb spends + time + V-ing"], ["16. It is … since", "haven't V3 for + time ⇔ It is + time + since + S + last V2"], ["17. The more … the more", "The + -er + S + V, the + -er + S + V"], ["18. suggest", "Why don't you V? ⇔ suggested that + S + (should) V"], ["19. Let's ↔ Why don't we", "Let's V ⇔ Why don't we V?"], ["20. Câu gián tiếp", "asked if / wh- + S + V (không đảo, lùi thì) · told sb (not) to V"]]}], "notes": ["Viết lại câu: chép lại phần KHÔNG đổi (tên, đồ vật, thời gian), chỉ thay phần cấu trúc. Đọc lại câu xem có thừa từ (ago, last, been) không.", "Tìm lỗi sai: thì → loại từ → liên từ → số ít/nhiều → mạo từ → đại từ quan hệ.", "Ngày thi: đến sớm, đi vệ sinh trước giờ thi. Paper 1 làm 4 bài đọc trước khi quá mệt, câu từ vựng nhanh."], "traps": [{"title": "have/has khi có mốc quá khứ (bạn sai nhiều nhất)", "wrong": "He has gone to work by motorbike every day last year.", "right": "He went to work by motorbike every day last year.", "why": "last year là mốc đã qua → quá khứ đơn."}, {"title": "Thêm been vào câu chủ động", "wrong": "I have been learned English for five years.", "right": "I have learned English for five years.", "why": "have been + V3 = bị động. Người tự học → have + V3."}, {"title": "Viết lại câu điều kiện thiếu would / had", "wrong": "If she taken the medicine, she had getten better.", "right": "If she had taken the medicine, she would have got better.", "why": "Vế if: had + V3. Vế chính: would have + V3."}]}, "extra": {"title": "Làm lại câu đã sai + 20 mẫu viết lại", "note": "Phần đầu là đúng những câu bạn đã sai từ ngày 1 tới giờ (lấy từ Sổ lỗi sai). Giải thích có ghi lần trước bạn chọn gì. Phần cuối là 12 câu viết lại theo 20 mẫu của tài liệu trường.", "sets": [{"key": "redo", "title": "Làm lại câu đã sai", "items": [{"q": "If I ___ you, I would accept the job offer.", "options": ["am", "was being", "were", "had been"], "answer": "C", "tag": "Câu điều kiện", "explain": "Vế chính có would + V → loại 2 → If I were (dùng were cho mọi ngôi). (Lần trước bạn chọn: D. had been.)"}, {"q": "This is the first time I ___ sushi.", "options": ["have eaten", "eat", "am eating", "ate"], "answer": "A", "tag": "Hiện tại hoàn thành", "explain": "This is the first/second time + S + have/has + V3. (Lần trước bạn chọn: B. eat.)"}, {"q": "The train to Hue ___ at 7:30 tomorrow morning, according to the timetable.", "options": ["leave", "leaves", "will be left", "has left"], "answer": "B", "tag": "Hiện tại đơn", "explain": "Lịch trình cố định (timetable) → hiện tại đơn dù nói về tương lai. Chủ ngữ số ít → leaves. (Lần trước bạn chọn: C. will be left.)"}, {"q": "By the end of last year, he ___ enough money to buy a motorbike.", "options": ["saved", "has saved", "had saved", "was saving"], "answer": "C", "tag": "Quá khứ hoàn thành", "explain": "By + mốc quá khứ (by the end of last year) → quá khứ hoàn thành. (Lần trước bạn chọn: B. has saved.)"}, {"q": "He ___ to work by motorbike every day last year.", "options": ["has gone", "had gone", "has been going", "went"], "answer": "D", "tag": "Quá khứ đơn", "explain": "last year → quá khứ đơn, dù là thói quen (every day). (Lần trước bạn chọn: A. has gone.)"}, {"q": "When I got home, I realised I ___ my phone at the office.", "options": ["have left", "had left", "left", "was leaving"], "answer": "B", "tag": "Quá khứ hoàn thành", "explain": "Mốc: lúc về nhà (quá khứ). Để quên điện thoại xảy ra trước đó → had left. (Lần trước bạn chọn: A. have left.)"}, {"q": "By the time you come back, I ___ the report.", "options": ["finish", "finished", "will have finished", "have finished"], "answer": "C", "tag": "Tương lai hoàn thành", "explain": "By the time + hiện tại đơn (nói về tương lai) → will have + V3: sẽ xong trước lúc đó. (Lần trước bạn chọn: D. have finished.)"}, {"q": "When I was a child, I ___ in the river every summer.", "options": ["swam", "have swum", "was swimming", "had swum"], "answer": "A", "tag": "Quá khứ đơn", "explain": "Thói quen trong quá khứ (every summer, when I was a child) → quá khứ đơn (hoặc used to + V). (Lần trước bạn chọn: D. had swum.)"}, {"q": "Hanoi, ___ is the capital of Vietnam, has many old buildings.", "options": ["that", "who", "which", "where"], "answer": "C", "tag": "Mệnh đề quan hệ", "explain": "Có dấu phẩy → không dùng that. Sau là động từ (is) → which. where cần S + V phía sau. (Lần trước bạn chọn: D. where.)"}, {"q": "Water ___ at 100 degrees Celsius.", "options": ["boiled", "boils", "is boiling", "has boiled"], "answer": "B", "tag": "Hiện tại đơn", "explain": "Sự thật hiển nhiên → hiện tại đơn: boils. (Lần trước bạn chọn: D. has boiled.)"}, {"q": "Da Lat, ___ is famous for its flowers, attracts many tourists.", "options": ["which", "where", "that", "who"], "answer": "A", "tag": "Mệnh đề quan hệ", "explain": "Ngay sau là động từ (is) → which làm chủ ngữ. where cần S + V phía sau. Có dấu phẩy → không dùng that. (Lần trước bạn chọn: B. where.)"}, {"q": "This is the house ___ my grandparents used to live.", "options": ["which", "that", "where", "when"], "answer": "C", "tag": "Mệnh đề quan hệ", "explain": "Sau chỗ trống: my grandparents used to live, đã đủ S + V, không thiếu tân ngữ → where (= in which). (Lần trước bạn chọn: A. which.)"}, {"q": "I ___ in Ho Chi Minh City for five years before I moved to Hanoi.", "options": ["have lived", "am living", "lived", "had lived"], "answer": "D", "tag": "Quá khứ hoàn thành", "explain": "Việc kéo dài và kết thúc trước một việc quá khứ khác (moved) → had + V3. (Lần trước bạn chọn: A. have lived.)"}, {"q": "I ___ to London twice, but I have never been to Paris.", "options": ["went", "have been", "had been", "was going"], "answer": "B", "tag": "Hiện tại hoàn thành", "explain": "Số lần trải nghiệm tính đến nay (twice) → have been. Giống lỗi \"three times so far\" ngày 1. (Lần trước bạn chọn: A. went.)"}, {"q": "My grandfather ___ in the army when he was young.", "options": ["has served", "was serving", "had served", "served"], "answer": "D", "tag": "Quá khứ đơn", "explain": "Việc đã xong trong một giai đoạn quá khứ (when he was young) → quá khứ đơn. (Lần trước bạn chọn: A. has served.)"}, {"q": "Listen! Someone ___ at the door.", "options": ["knocks", "is knocking", "has knocked", "knocked"], "answer": "B", "tag": "Hiện tại tiếp diễn", "explain": "\"Listen!\" → việc đang xảy ra ngay lúc nói → am/is/are + V-ing. (Lần trước bạn chọn: C. has knocked.)"}, {"q": "This is the café ___ I often meet my friends.", "options": ["which", "that", "where", "whom"], "answer": "C", "tag": "Mệnh đề quan hệ", "explain": "I often meet my friends đã đủ S + V + tân ngữ → where (= at which). (Lần trước bạn chọn: A. which.)"}, {"q": "She ___ in Da Nang when she was a student.", "options": ["lived", "has lived", "has been lived", "had been living"], "answer": "A", "tag": "Quá khứ đơn", "explain": "when she was a student → giai đoạn đã qua → quá khứ đơn. (Lần trước bạn chọn: B. has lived.)"}, {"q": "After she ___ her homework, she went to bed.", "options": ["was finishing", "had finished", "has finished", "finishes"], "answer": "B", "tag": "Quá khứ hoàn thành", "explain": "Việc xảy ra trước một việc khác trong quá khứ → had + V3. (Lần trước bạn chọn: C. has finished.)"}, {"q": "Mai ___ her leg when she was skiing last winter.", "options": ["broke", "has broken", "was breaking", "had broken"], "answer": "A", "tag": "Quá khứ đơn", "explain": "Việc ngắn xen vào (broke) khi việc khác đang diễn ra (was skiing) → quá khứ đơn. (Lần trước bạn chọn: B. has broken.)"}, {"q": "You can borrow my laptop ___ you promise to take care of it.", "options": ["as long as", "unless", "although", "despite"], "answer": "A", "tag": "Câu điều kiện", "explain": "as long as = miễn là (điều kiện). unless = nếu không, sai nghĩa. (Lần trước bạn chọn: B. unless.)"}, {"q": "A new hospital ___ in our town at the moment.", "options": ["builds", "is building", "is being built", "was built"], "answer": "C", "tag": "Bị động", "explain": "'at the moment' → tiếp diễn; bệnh viện được xây → bị động tiếp diễn: is being built. (Lần trước bạn chọn: D. was built.)"}, {"q": "I ___ to Da Lat three times so far.", "options": ["go", "went", "am going", "have been"], "answer": "D", "tag": "Hiện tại hoàn thành", "explain": "'three times', 'so far' → hiện tại hoàn thành: have been. (Lần trước bạn chọn: B. went.)"}, {"q": "We ___ three units of the book so far.", "options": ["finished", "had finished", "have finished", "have been finished"], "answer": "C", "tag": "Hiện tại hoàn thành", "explain": "so far → have + V3. Người tự làm → không có been. (Lần trước bạn chọn: D. have been finished.)"}, {"q": "Look at those dark clouds! It ___ rain.", "options": ["is going to", "will", "rains", "is raining"], "answer": "A", "tag": "Be going to", "explain": "Có dấu hiệu rõ ràng trước mắt (dark clouds) → be going to. (Lần trước bạn chọn: B. will.)"}, {"q": "What ___ at 8 p.m. last night? I called you but you didn't answer.", "options": ["did you do", "have you done", "were you doing", "do you do"], "answer": "C", "tag": "Quá khứ tiếp diễn", "explain": "Một giờ cụ thể trong quá khứ (8 p.m. last night) → hỏi việc đang làm lúc đó → was/were + V-ing. (Lần trước bạn chọn: A. did you do.)"}]}, {"key": "t2read", "title": "Đọc bấm giờ · Tom Cruise (Test 2 · 30–35)", "directions": "Read the passage and choose the best answer. Giới hạn 10 phút.", "passageTitle": "TOM CRUISE", "passage": ["Over the years, Tom Cruise has become one of the most popular and successful actors in the world. Tom is now an international star, who gets paid millions of dollars for every film he makes. 'I'm lucky,' says Tom. 'I'm doing what I love, and I'm having a great time. Lots of people would love to do this job, but they didn't get the lucky breaks or chances that I did.' For many of us, however, Tom was more than just lucky or good-looking, as acting ability and great determination were needed for him to become one of Hollywood's biggest names.", "Is Tom happy with his success so far? He has a different outlook on his career than you might expect. 'I've always looked to the future,' says Tom. 'I feel I'm always developing as an actor. I'm looking for new things all the time. I want to challenge myself to be better and always try new things. I know I've made a lot of progress in my career, but I still have ambitions for the future.'", "After interviewing him, I understood that the real Tom Cruise is a man with a very interesting and agreeable personality. He has a mind of his own and he's not like the characters in his movies, even though they may reflect Tom's personal style in the way he plays them.", "The amazing success of Tom's career has been due to his talent as an actor and his personal strength and single-mindedness. Tom knew what he wanted to do with his life and gave his best to succeed."], "items": [{"q": "The purpose of this text is to ___.", "options": ["discuss Tom Cruise's success in acting", "discuss Tom Cruise's outlook on life", "tell the readers how Tom Cruise's strong personality is an important part of his success", "argue that Tom Cruise's success is mostly good luck"], "answer": "C", "tag": "Đọc: mục đích bài", "explain": "Đoạn cuối chốt: thành công nhờ tài năng + sức mạnh cá nhân, ý chí. A quá chung; D ngược ý người viết.", "type": "Mục đích bài", "evidence": "The amazing success of Tom's career has been due to his talent as an actor and his personal strength and single-mindedness"}, {"q": "Which of the following does NOT describe Tom Cruise?", "options": ["Ambitious.", "Pleasant.", "Determined.", "Conservative."], "answer": "D", "tag": "Đọc: NOT mentioned", "explain": "ambitions (A), agreeable personality (B), determination (C) đều có. Anh ấy luôn thử cái mới → không bảo thủ (conservative).", "type": "NOT", "evidence": "I want to challenge myself to be better and always try new things"}, {"q": "How does Tom compare himself to other people who try to become actors?", "options": ["He works harder than they do.", "He was more fortunate at certain points in his career.", "He had more qualities than they do to be a successful actor.", "He looks to the future more than they do."], "answer": "B", "tag": "Đọc: chi tiết", "explain": "they didn't get the lucky breaks or chances that I did → anh ấy may mắn hơn. C là ý của người viết, không phải lời Tom.", "type": "Chi tiết", "evidence": "they didn't get the lucky breaks or chances that I did"}, {"q": "How does Tom describe his attitude to his work?", "options": ["He is now very satisfied with what he has achieved.", "He looks forward and wants to improve and develop.", "He has to face too many challenges.", "He is the characters in his movies."], "answer": "B", "tag": "Đọc: chi tiết", "explain": "I've always looked to the future … always developing … challenge myself to be better.", "type": "Chi tiết", "evidence": "I've always looked to the future"}, {"q": "The writer says that Tom Cruise ___.", "options": ["hides his real personality", "has a personality similar to the characters he plays", "has no personal style when acting", "is very likeable as a person"], "answer": "D", "tag": "Đọc: chi tiết", "explain": "agreeable personality = tính cách dễ mến → likeable. B ngược (he's not like the characters).", "type": "Chi tiết", "evidence": "a man with a very interesting and agreeable personality"}, {"q": "A synonym of 'single-mindedness' is ___.", "options": ["stubbornness", "concentration", "determination", "tirelessness"], "answer": "C", "tag": "Đọc: từ đồng nghĩa", "explain": "single-mindedness = chuyên tâm theo đuổi một mục tiêu = determination. Câu sau giải thích: knew what he wanted … gave his best.", "type": "Từ đồng nghĩa", "evidence": "Tom knew what he wanted to do with his life and gave his best to succeed"}]}], "transform": [{"source": "She didn't take the medicine, so she didn't get better.", "start": "If she", "answers": ["If she had taken the medicine, she would have got better.", "If she had taken the medicine, she would have gotten better."], "tag": "Câu điều kiện", "explain": "Thực tế quá khứ → loại 3: had + V3, would have + V3, đổi cả 2 vế sang khẳng định. (Lần trước bạn viết: If she taken the medicine, she had getten better.)"}, {"source": "It takes me 30 minutes to get to work.", "start": "I spend", "answers": ["I spend 30 minutes getting to work.", "I spend thirty minutes getting to work."], "tag": "It takes / spend", "explain": "It takes sb + time + to V ⇔ S + spend + time + V-ing. Hiện tại → spend (không phải spent). (Lần trước bạn viết: I spend 30 minutes to get to work.)"}, {"source": "I started working here two years ago.", "start": "I have", "answers": ["I have worked here for two years.", "I have been working here for two years."], "tag": "Hiện tại hoàn thành", "explain": "started … ago → have + V3 … for + khoảng thời gian. (Lần trước bạn viết: I have been started working here two years ago..)"}, {"source": "They will build a new school next year.", "start": "A new school", "answers": ["A new school will be built next year."], "tag": "Bị động", "explain": "Tương lai đơn bị động: will be + V3. Bỏ 'by them'. (Lần trước bạn viết: A new school will be built a new school next year..)"}, {"source": "People say that he is very rich.", "start": "It", "answers": ["It is said that he is very rich."], "tag": "Bị động", "explain": "People say that … → It is said that … (bị động với động từ tường thuật). (Lần trước bạn viết: It is said he was very rich.)"}, {"source": "The last time I saw her was in 2020.", "start": "I haven't", "answers": ["I haven't seen her since 2020."], "tag": "Hiện tại hoàn thành", "explain": "The last time + S + V2 + was + mốc → S + haven't + V3 + since + mốc. (Lần trước bạn viết: I haven't been seen her was since 2020.)"}, {"source": "It's two months since he last called me.", "start": "He hasn't", "answers": ["He hasn't called me for two months.", "He hasn't called me for two months now."], "tag": "Hiện tại hoàn thành", "explain": "It's + khoảng thời gian + since + S + last + V2 → S + hasn't + V3 + for + khoảng thời gian. (Lần trước bạn viết: He hasn't been last called me for two months.)"}, {"source": "I started learning English five years ago.", "start": "I have", "answers": ["I have learned English for five years.", "I have learnt English for five years.", "I have been learning English for five years."], "tag": "Hiện tại hoàn thành", "explain": "started … ago → have + V3 (hoặc have been + V-ing) + for + khoảng thời gian. Bỏ \"ago\". (Lần trước bạn viết: I have been learned English for five years.)"}, {"source": "My brother started working in Hanoi two years ago.", "start": "My brother has", "answers": ["My brother has worked in Hanoi for two years.", "My brother has been working in Hanoi for two years."], "tag": "Hiện tại hoàn thành", "explain": "started … ago → has + V3 (hoặc has been + V-ing) + for. Không viết has been worked. (Lần trước bạn viết: My brother has started working for two years in Hanoi.)"}, {"source": "I don't have a car, so I can't drive to work.", "start": "If I", "answers": ["If I had a car, I could drive to work.", "If I had a car, I would be able to drive to work.", "If I had a car, I would drive to work."], "tag": "Câu điều kiện", "explain": "Thực tế hiện tại → loại 2: don't have → had; can't → could (đổi phủ định thành khẳng định). (Lần trước bạn viết: If I had a car, I drove to work.)"}, {"source": "She last saw him when she was ten.", "start": "She hasn't", "answers": ["She hasn't seen him since she was ten."], "tag": "Ago / since / for", "explain": "last + V2 → hasn't + V3 + since. Không có been."}, {"source": "They haven't written emails for two months.", "start": "They last", "answers": ["They last wrote emails two months ago.", "They last wrote an email two months ago.", "They last wrote email two months ago."], "tag": "Ago / since / for", "explain": "haven't V3 for … → last + V2 + … ago."}, {"source": "My brother didn't buy that car because he didn't have enough money.", "start": "If my brother", "answers": ["If my brother had had enough money, he would have bought that car."], "tag": "Câu điều kiện", "explain": "Quá khứ → loại 3: had had (đúng, 2 chữ had) … would have bought."}, {"source": "People don't understand him because he doesn't speak clearly.", "start": "If he spoke", "answers": ["If he spoke clearly, people would understand him."], "tag": "Câu điều kiện", "explain": "Hiện tại → loại 2: spoke … would understand."}, {"source": "I didn't know that she was ill.", "start": "I wish", "answers": ["I wish I had known that she was ill.", "I wish I had known she was ill."], "tag": "Câu ước", "explain": "Tiếc về quá khứ → wish + had V3."}, {"source": "They have cancelled the meeting.", "start": "The meeting", "answers": ["The meeting has been cancelled.", "The meeting has been cancelled by them."], "tag": "Bị động", "explain": "Hiện tại hoàn thành bị động: has been + V3 (vật → có been)."}, {"source": "An engineer repaired my computer a week ago.", "start": "I got an", "answers" async function connect() {
  if (!window.claude || !window.claude.use) return;
  try {
    const [d, s] = await Promise.all([window.claude.use("db"), window.claude.use("sample")]);
    state.sample = s;
    if (d) {
      db = d;
      document.getElementById("syncState").textContent = "Đã đồng bộ với Claude";
      document.getElementById("syncState").classList.add("on");
      db.collection("mistakes").orderBy("at", "desc").limit(500).onSnapshot(snap => {
        state.mistakes = snap.docs.map(x => x.data()); rerenderIf(["summary", "log"]);
      }, () => {});
      db.collection("scores").onSnapshot(snap => {
        const o = {}; snap.docs.forEach(x => o[x.id] = x.data()); state.scores = o; rerenderIf(["summary", "log"]);
      }, () => {});
      db.collection("progress").onSnapshot(snap => {
        const o = {}; snap.docs.forEach(x => o[x.id] = x.data()); state.progress = o; rerenderIf(["plan", "schedule"]);
      }, () => {});
      db.collection("known").onSnapshot(snap => {
        const o = {}; snap.docs.forEach(x => o[x.id] = x.data()); state.known = o; rerenderIf(["vocab"]);
      }, () => {});
    }
    render();
  } catch {}
}

/* ---------- helpers ---------- */
const $ = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null) el.append(k.nodeType ? k : document.createTextNode(k));
  return el;
};
const blank = s => s.replace(/___/g, "______");
const norm = s => s.toLowerCase().replace(/[’']/g, "'").replace(/[.,!?;:]/g, "").replace(/\s+/g, " ").trim();
const D = () => DATA.days[state.day];
const TAB_DATA = { grammar: "grammar", grammarEx: "grammarMcq", extra: "extra", vocab: "vocab", vocabEx: "vocabMcq", reading: "reading", exam: "exam", speaking: "speaking", summary: "reviewQuiz" };
const hasTab = (d, k) => !TAB_DATA[k] || !!d[TAB_DATA[k]];
function rerenderIf(tabs) { if (tabs.includes(state.tab)) render(); }

async function askClaude(prompt, out, btn) {
  if (!state.sample) return;
  btn.disabled = true; out.textContent = "Claude đang đọc…";
  try {
    const r = await state.sample(prompt, { onText: ({ text }) => { out.textContent = text.replace(/\*\*/g, ""); }, modelTier: "default" });
    out.textContent = r.text.replace(/\*\*/g, "");
  } catch (e) {
    out.textContent = e && e.code === "rate_limited" ? "Claude đang bận. Đợi một phút rồi bấm lại." : "Không gọi được Claude ở chế độ xem này.";
  } finally { btn.disabled = false; }
}

/* ---------- MCQ block (answer-sheet bubbles) ---------- */
function mcq(key, items, opts = {}) {
  const box = $("div");
  const ans = state.answers[key] || (state.answers[key] = {});
  const graded = state.graded[key];
  items.forEach((it, i) => {
    const q = $("div", { class: "q" },
      $("div", { class: "qn" }, String((opts.start || 1) + i) + "."),
      $("div", {}, it.type ? $("div", { class: "qtype" }, it.type) : null, blank(it.q)));
    const os = $("div", { class: "opts", role: "radiogroup" });
    it.options.forEach((o, j) => {
      const L = LETTERS[j];
      const cls = ["opt"];
      if (graded) { if (L === it.answer) cls.push("is-correct"); else if (ans[i] === L) cls.push("is-wrong"); }
      os.append($("label", { class: cls.join(" ") },
        $("input", { type: "radio", name: key + "-" + i, value: L, checked: ans[i] === L, disabled: !!graded,
          onchange: () => { ans[i] = L; } }),
        $("span", { class: "bubble" }, L), $("span", {}, o)));
    });
    q.append(os);
    if (graded) {
      const ok = ans[i] === it.answer;
      q.append($("div", { class: "feedback " + (ok ? "ok" : "bad") },
        $("div", { class: "tag" }, (ok ? "Đúng" : ans[i] ? "Sai · bạn chọn " + ans[i] : "Bỏ trống") + " · Đáp án " + it.answer + " · " + it.tag),
        $("div", {}, it.explain),
        it.evidence ? $("div", { class: "evidence" }, "Câu chứa đáp án: “" + it.evidence + "”") : null));
    }
    box.append(q);
  });
  const total = items.length;
  const right = graded ? items.filter((it, i) => ans[i] === it.answer).length : 0;
  box.append($("div", { class: "actions" },
    graded ? $("span", { class: "score" }, right + "/" + total) : null,
    graded ? $("button", { class: "btn ghost", onclick: () => { delete state.graded[key]; state.answers[key] = {}; render(); } }, "Làm lại")
      : $("button", { class: "btn", onclick: () => {
          const unanswered = items.filter((_, i) => !ans[i]).length;
          state.graded[key] = true;
          const wrong = items.map((it, i) => ({ it, i })).filter(({ it, i }) => ans[i] !== it.answer);
          Store.addMistakes(wrong.map(({ it, i }) => ({ day: state.day, section: opts.section, tag: it.tag, q: it.q,
            chosen: ans[i] ? ans[i] + ". " + it.options[LETTERS.indexOf(ans[i])] : "(bỏ trống)",
            answer: it.answer + ". " + it.options[LETTERS.indexOf(it.answer)], at: Date.now() })));
          Store.setScore("d" + state.day + "-" + key, { day: state.day, section: opts.section, score: total - wrong.length, total, at: Date.now() });
          if (opts.onGraded) opts.onGraded();
          render();
        } }, "Nộp bài"),
    graded ? null : $("span", { class: "note" }, "Đáp án chỉ hiện sau khi nộp.")));
  return box;
}

function transformBlock(tkey, list, start, section = "Viết lại câu") {

    const ok = tg && t.answers.some(a => norm(a) === norm(tans[i] || ""));
    const row = $("div", { class: "tq" },
      $("div", {}, $("b", {}, (start + i) + ". "), t.source),
      $("div", { class: "start" }, $("b", {}, "→"),
        $("input", { type: "text", id: "tf-" + state.day + "-" + tkey + "-" + i, value: tans[i] || (t.start + " "), disabled: !!tg, "aria-label": "Viết lại câu " + (start + i),
          oninput: e => { tans[i] = e.target.value; } })));

          "\nHọc viên viết: " + (tans[i] || "") + "\nCâu của học viên có đúng ngữ pháp và giữ nguyên nghĩa không? Trả lời bằng tiếng Việt, tối đa 3 câu, không dùng markdown.", out, b) }, "Nhờ Claude xem câu này");
        row.append($("div", { class: "actions" }, b), out);

    ? $("button", { class: "btn ghost", onclick: () => { delete state.graded[tkey]; state.answers[tkey] = {}; render(); } }, "Làm lại")
    : $("button", { class: "btn", onclick: () => {
        state.graded[tkey] = true;
        const wrong = list.map((t, i) => ({ t, i })).filter(({ t, i }) => !t.answers.some(a => norm(a) === norm(tans[i] || "")));
        Store.addMistakes(wrong.map(({ t, i }) => ({ day: state.day, section, tag: t.tag, q: t.source + " → " + t.start + "…",
          chosen: tans[i] || "(bỏ trống)", answer: t.answers[0], at: Date.now() })));
        Store.setScore("d" + state.day + "-" + tkey, { day: state.day, section, score: list.length - wrong.length, total: list.length, at: Date.now() });
        render(); } }, "Nộp bài")));
  return tbox;
}

const TTS = window.speechSynthesis;
function speakLines(lines, btn) {
  if (!TTS) return;
  if (TTS.speaking) { TTS.cancel(); return; }
  const voices = TTS.getVoices().filter(v => /^en[-_]/i.test(v.lang));
  const female = voices.find(v => /female|samantha|zira|susan|serena|karen|moira|tessa|libby|sonia|aria|jenny/i.test(v.name)) || voices[0];
  const male = voices.find(v => v !== female && /male|daniel|david|alex|fred|george|guy|ryan|mark/i.test(v.name)) || voices.find(v => v !== female) || female;
  const who = {};
  const queue = [];
  for (let round = 0; round < 2; round++) lines.forEach(l => {
    const m = l.match(/^([A-Z][a-z]+):\s*(.*)$/);
    const name = m ? m[1] : "", text = m ? m[2] : l;
    if (!(name in who)) who[name] = /^(Woman|Lan|Speaker|Mai|Hoa)$/.test(name) ? "f" : name === "" ? "f" : "m";
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-GB"; u.rate = 0.92;
    const v = who[name] === "f" ? female : male; if (v) u.voice = v;
    u.pitch = who[name] === "f" ? 1.1 : 0.9;
    queue.push(u);
  });

    const rubric = $("section", { class: "sheet" }, $("h2", {}, "Tiêu chí chấm (15 điểm)"), $("ul", { class: "plain" }, sp.rubric.map(r => $("li", {}, r))),
      state.sample ? $("div", { class: "actions" }, totalBtn) : $("p", { class: "note" }, "Mở trang này trên claude.ai để Claude sửa bài và chấm điểm, hoặc dán câu trả lời vào cuộc trò chuyện."),
      totalOut);
    return [intro, qs, rubric];
  },
  summary(d) {
    const mine = state.mistakes.filter(m => m.day === state.day);
    return [summaryBlock(mine, "Lỗi sai ngày " + d.day),
      $("section", { class: "sheet" }, $("div", { class: "head-row" }, $("h2", {}, "Quiz ôn tập"), $("span", { class: "meta" }, "10 câu trộn ngữ pháp + từ vựng")),
        mcq("reviewQuiz", d.reviewQuiz, { section: "Quiz tổng kết" }))];
  }
};

function summaryBlock(list, title) {
  const by = {};
  list.forEach(m => { (by[m.tag] = by[m.tag] || []).push(m); });
  const tags = Object.keys(by).sort((a, b) => by[b].length - by[a].length);
  const s = $("section", { class: "sheet" }, $("div", { class: "head-row" }, $("h2", {}, title), $("span", { class: "meta" }, list.length + " lỗi")));
  if (!tags.length) { s.append($("p", { class: "note" }, "Chưa có lỗi nào. Nộp các bài tập, câu sai sẽ tự ghi vào đây theo chủ điểm.")); return s; }
  s.append($("div", { class: "chips" }, tags.map(t => $("span", { class: "chip" }, t + " × " + by[t].length))));
  tags.forEach(t => {
    s.append($("h3", {}, t));
    s.append($("ul", { class: "plain" }, by[t].map(m => $("li", {}, blank(m.q), " — ", $("span", { class: "wrong" }, m.chosen), " → ", $("span", { class: "right" }, m.answer),
      $("span", { class: "note" }, "  (ngày " + m.day + " · " + m.section + ")")))));
  });
  return s;
}

function scheduleView() {
  const t = $("table", {}, $("thead", {}, $("tr", {}, ["Ngày", "Ngữ pháp", "Từ vựng", "Đề / Nói", ""].map(h => $("th", {}, h)))),
    $("tbody", {}, SCHEDULE.map((r, i) => {
      const n = i + 1, ready = !!DATA.days[n], done = ((state.progress["d" + n] || {}).done || []).length;
      return $("tr", {}, $("td", {}, $("b", {}, n)), r.map(c => $("td", {}, c)),
        $("td", {}, $("span", { class: "status" + (ready ? " on" : "") }, ready ? (done ? done + " bước xong" : "Sẵn sàng") : "Chưa soạn")));
    })));
  return [$("section", { class: "sheet" }, $("h2", {}, "Lịch 7 ngày"), $("div", { class: "scroll" }, t),
    $("p", { class: "note" }, "Ngày 4 thi thử 70 câu, ngày 6 thi thử đúng format đề thật 90 câu (có Tìm lỗi sai, 4 bài đọc). Từ ngày 2 mỗi ngày viết lại 5 câu. Ngày chưa soạn: gõ “Bắt đầu ngày N” với Claude để soạn và cập nhật trang này."))];
}
function logView() {
  const scores = Object.values(state.scores).sort((a, b) => a.day - b.day || a.at - b.at);
  const st = $("section", { class: "sheet" }, $("h2", {}, "Điểm các bài đã nộp"),
    scores.length ? $("div", { class: "scroll" }, $("table", {}, $("tbody", {}, scores.map(s => $("tr", {}, $("td", {}, "Ngày " + s.day), $("td", {}, s.section),
      $("td", { style: "font-variant-numeric: tabular-nums; font-weight: 700" }, s.score + "/" + s.total))))))
      : $("p", { class: "note" }, "Chưa nộp bài nào."));
  return [summaryBlock(state.mistakes, "Sổ lỗi sai (tất cả các ngày)"), st];
}

/* ---------- render ---------- */
function render() {
  const days = document.getElementById("days"); days.replaceChildren();
  for (let n = 1; n <= 7; n++) days.append($("button", { class: "day-btn", "aria-pressed": String(state.day === n && !["schedule", "log"].includes(state.tab)),
    onclick: () => { if (state.day !== n) { state.answers = {}; state.graded = {}; state.showScript = {}; if (TTS) TTS.cancel(); } state.day = n; if (["schedule", "log"].includes(state.tab)) state.tab = "plan"; LS.set("khtn.day", n); LS.set("khtn.tab", state.tab); render(); } },
    $("span", { class: "dot" + (DATA.days[n] ? " ready" : "") }), "Ngày " + n));
  const tabs = document.getElementById("tabs"); tabs.replaceChildren();
  const d = D();
  if (d) TABS.filter(([k]) => hasTab(d, k)).forEach(([k, label]) => tabs.append($("button", { class: "tab", role: "tab", "aria-selected": String(state.tab === k), onclick: () => { state.tab = k; LS.set("khtn.tab", k); render(); window.scrollTo({ top: 0 }); } }, label)));
  [["schedule", "Lịch 7 ngày"], ["log", "Sổ lỗi sai"]].forEach(([k, label]) => tabs.append($("button", { class: "tab global", role: "tab", "aria-selected": String(state.tab === k), onclick: () => { state.tab = k; LS.set("khtn.tab", k); render(); } }, label)));
  const main = document.getElementById("main");
  let nodes;
  if (state.tab === "schedule") nodes = scheduleView();
  else if (state.tab === "log") nodes = logView();
  else if (!d) nodes = [$("section", { class: "sheet" }, $("h2", {}, "Ngày " + state.day + " chưa được soạn"),
    $("p", {}, "Gõ “Bắt đầu ngày " + state.day + "” với Claude. Bài học sẽ được thêm vào trang này."), $("p", { class: "note" }, SCHEDULE[state.day - 1].join(" · ")))];
  else nodes = (hasTab(d, state.tab) && views[state.tab] || views.plan)(d);
  main.replaceChildren(...nodes.filter(Boolean));
}
if (!DATA.days[state.day]) state.day = 1;
render();
connect();
</script>
