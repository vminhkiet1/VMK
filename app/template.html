<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:wght@500;600;700&family=Noto+Sans:wght@400&display=swap">
<style>
/* Layout: phiếu ôn thi — one centered answer sheet, sticky tab rail, bubbles like an OMR answer form, red pen for corrections */
:root {
  --paper: #EEF2F6;
  --sheet: #FFFFFF;
  --ink: #18264A;
  --muted: #5A6782;
  --line: #D3DBE6;
  --accent: #2547A8;
  --accent-soft: #E3E9F8;
  --red: #C2362F;
  --red-soft: #FBE9E7;
  --ok: #2B7A4B;
  --ok-soft: #E3F3E9;
  --font-display: "Lora", Georgia, "Times New Roman", serif;
  --font-body: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --font-ipa: "Noto Sans", "Segoe UI", "Lucida Sans Unicode", sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1320; --sheet: #161D2C; --ink: #E3E8F2; --muted: #9AA6BD; --line: #2A3448;
    --accent: #8AA4F2; --accent-soft: #1F2A47; --red: #F1857B; --red-soft: #3A1F1F;
    --ok: #74CC98; --ok-soft: #173326; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E1320; --sheet: #161D2C; --ink: #E3E8F2; --muted: #9AA6BD; --line: #2A3448;
  --accent: #8AA4F2; --accent-soft: #1F2A47; --red: #F1857B; --red-soft: #3A1F1F;
  --ok: #74CC98; --ok-soft: #173326; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.wrap { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { padding-block: 28px 12px; display: grid; gap: 14px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1 { font-family: var(--font-display); font-size: clamp(26px, 5vw, 36px); line-height: 1.15; margin: 0; text-wrap: balance; }
h2 { font-family: var(--font-display); font-size: 22px; margin: 0; text-wrap: balance; }
h3 { font-size: 15px; margin: 0; font-weight: 700; }
.goal { display: flex; flex-wrap: wrap; gap: 8px 18px; color: var(--muted); font-size: 13.5px; }
.goal b { color: var(--ink); font-variant-numeric: tabular-nums; }
.days { display: flex; gap: 6px; flex-wrap: wrap; }
.day-btn { font: inherit; font-weight: 600; border: 1.5px solid var(--line); background: var(--sheet); color: var(--ink); border-radius: 999px; padding: 4px 12px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.day-btn[aria-pressed="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.day-btn .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.day-btn .dot.ready { background: var(--ok); }
nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); }
nav.tabs .wrap { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tab { font: inherit; font-size: 14px; font-weight: 500; white-space: nowrap; border: 0; background: none; color: var(--muted); padding: 11px 10px 9px; border-bottom: 2.5px solid transparent; cursor: pointer; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 700; }
.tab.global { margin-left: auto; }
.tab.global ~ .tab.global { margin-left: 0; }
main { padding-block: 22px 60px; display: grid; gap: 18px; }
.sheet { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 22px clamp(16px, 4vw, 28px); display: grid; gap: 16px; min-width: 0; }
.head-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.meta { color: var(--muted); font-size: 13px; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
td.formula { font-weight: 600; color: var(--accent); white-space: nowrap; }
.ipa { font-family: var(--font-ipa); color: var(--muted); font-size: 13.5px; }
ul.plain { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.trap { border-left: 3px solid var(--red); padding: 4px 0 4px 14px; display: grid; gap: 4px; }
.wrong { color: var(--red); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.right { color: var(--ok); font-weight: 600; }
.btn { font: inherit; font-weight: 600; font-size: 14px; border-radius: 8px; padding: 8px 16px; cursor: pointer; border: 1.5px solid var(--ink); background: var(--ink); color: var(--sheet); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn:disabled { opacity: .45; cursor: default; }
.btn:focus-visible, .tab:focus-visible, .day-btn:focus-visible, .opt input:focus-visible + .bubble, textarea:focus-visible, input[type=text]:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.score { font-family: var(--font-display); font-size: 22px; font-weight: 700; color: var(--red); font-variant-numeric: tabular-nums; }
.q { display: grid; grid-template-columns: 34px 1fr; gap: 4px 10px; padding-block: 12px; border-bottom: 1px dashed var(--line); }
.q:last-of-type { border-bottom: 0; }
.qn { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted); padding-top: 1px; }
.qtype { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 6px 14px; margin-top: 6px; grid-column: 2; }
.opt { display: flex; align-items: flex-start; gap: 8px; cursor: pointer; padding: 3px 4px; border-radius: 6px; }
.opt input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.bubble { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--muted); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--muted); }
.opt input:checked + .bubble { background: var(--ink); border-color: var(--ink); color: var(--sheet); }
.opt.is-correct .bubble { box-shadow: 0 0 0 3px var(--ok); }
.opt.is-wrong .bubble { background: var(--red); border-color: var(--red); color: var(--sheet); }
.opt.is-wrong span:last-child { color: var(--red); text-decoration: line-through; }
.feedback { grid-column: 2; font-size: 14px; margin-top: 6px; padding: 8px 12px; border-radius: 8px; }
.feedback.ok { background: var(--ok-soft); }
.feedback.bad { background: var(--red-soft); }
.feedback .tag { font-size: 12px; font-weight: 600; color: var(--muted); }
.evidence { font-style: italic; color: var(--muted); }
.passage { font-family: var(--font-display); font-size: 16.5px; line-height: 1.75; max-width: 65ch; display: grid; gap: 12px; }
.passage p { margin: 0; }
.passage .pn { font-family: var(--font-body); font-size: 12px; color: var(--muted); font-weight: 600; margin-right: 6px; }
mark { background: var(--accent-soft); color: inherit; padding: 0 2px; border-radius: 3px; }
.timer { font-family: var(--font-display); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.timer.low { color: var(--red); }
input[type=text], textarea { font: inherit; width: 100%; border: 1.5px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--paper); color: var(--ink); }
textarea { min-height: 90px; resize: vertical; }
.paper-title { font-size: 15px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 28px 4px 10px; }
.tq { display: grid; gap: 6px; padding-block: 12px; border-bottom: 1px dashed var(--line); }
.tq .start { display: flex; gap: 8px; align-items: center; }
.tq .start b { white-space: nowrap; }
.checklist { display: grid; gap: 0; }
.ck { display: grid; grid-template-columns: 26px 110px 1fr; gap: 10px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.ck input { accent-color: var(--accent); width: 17px; height: 17px; }
.ck .t { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13.5px; }
.ck.done .what { color: var(--muted); text-decoration: line-through; }
.ck.rest { cursor: default; }
.ck.rest .what { color: var(--muted); font-style: italic; }
.card-stage { display: grid; place-items: center; gap: 14px; }
.flash { width: min(100%, 440px); min-height: 190px; border: 1.5px solid var(--line); border-radius: var(--r); background: var(--paper); display: grid; place-items: center; text-align: center; padding: 22px; cursor: pointer; gap: 6px; font: inherit; color: var(--ink); }
.flash .big { font-family: var(--font-display); font-size: 26px; font-weight: 700; }
tr.known-row td { opacity: .5; }
tr.known-row td:first-child { opacity: 1; }
.ck-known { accent-color: var(--ok); width: 17px; height: 17px; cursor: pointer; }
.btn.ok { background: var(--ok); border-color: var(--ok); color: var(--sheet); }
.toggle { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); cursor: pointer; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 12.5px; font-weight: 600; padding: 2px 10px; border-radius: 999px; background: var(--red-soft); color: var(--red); }
.chip.n { background: var(--accent-soft); color: var(--accent); }
.ai-out { white-space: pre-wrap; font-size: 14px; background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; }
.ai-out:empty { display: none; }
.intro-line { padding: 6px 0; border-bottom: 1px dashed var(--line); }
.note { font-size: 13px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.grid2 > * { min-width: 0; }
.status { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--paper); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.status.on { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
@media (max-width: 520px) {
  .q { grid-template-columns: 26px 1fr; }
  .opts { grid-column: 1 / -1; }
  .feedback { grid-column: 1 / -1; }
  .ck { grid-template-columns: 24px 1fr; }
  .ck .t { grid-column: 2; }
  .ck .what { grid-column: 2; }
}
@media (prefers-reduced-motion: no-preference) { .flash { transition: transform .15s; } .flash:active { transform: scale(.98); } }
</style>

<header class="wrap top">
  <div class="eyebrow">Tiếng Anh đầu vào thạc sĩ · ĐH Khoa học Tự nhiên · ĐHQG-HCM</div>
  <h1>Luyện thi 7 ngày</h1>
  <div class="goal">
    <span>Mục tiêu <b>≥ 55/100</b></span><span>Đậu khi <b>≥ 50</b></span><span>Trình độ <b>B1</b></span><span id="syncState" class="status">Lưu trên trình duyệt</span>
  </div>
  <div class="days" id="days" role="group" aria-label="Chọn ngày"></div>
</header>
<nav class="tabs" aria-label="Các bước"><div class="wrap" id="tabs" role="tablist"></div></nav>
<main class="wrap" id="main"></main>

<script>
const DATA = /*__DATA__*/{"days":{}};
const SCHEDULE = [
  ["Thì + bị động", "Collocation make/do/take/have", "Bài giới thiệu bản thân; làm Paper 1"],
  ["Mệnh đề quan hệ + liên từ", "Phrasal verb nhóm 1", "Làm đề mẫu (điểm xuất phát); 1 chủ đề nói"],
  ["Câu điều kiện + unless + câu ước", "Từ dễ nhầm", "Viết lại câu chuyên sâu; 2 chủ đề nói"],
  ["V-ing/to V + so sánh", "Phrasal verb nhóm 2 + giới từ", "Thi thử đề 1; 1 chủ đề nói"],
  ["Gián tiếp + suggest / had better", "Cấu tạo từ", "Tìm lỗi sai; viết lại 20 mẫu; đọc 2 bài; nói với Claude"],
  ["Ôn tổng hợp qua đề", "—", "Thi thử 2 đúng format 90 câu; nói thử toàn bộ"],
  ["Ôn lỗi sai", "Ôn 20 mẫu viết lại", "Đọc 1 bài; giới thiệu 4–5 câu; nghỉ sớm"]
];
const TABS = [
  ["plan", "Kế hoạch"], ["grammar", "Ngữ pháp"], ["grammarEx", "Bài tập NP"], ["extra", "Luyện thêm"], ["vocab", "Từ vựng"],
  ["vocabEx", "Bài tập TV"], ["reading", "Đọc"], ["exam", "Đề thi"], ["speaking", "Nói"], ["summary", "Tổng kết"]
];
const LETTERS = ["A", "B", "C", "D"];

/* ---------- storage: db capability when available, browser storage otherwise ---------- */
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const state = {
  day: LS.get("khtn.day", 1), tab: LS.get("khtn.tab", "plan"),
  mistakes: LS.get("khtn.mistakes", []), scores: LS.get("khtn.scores", {}), progress: LS.get("khtn.progress", {}),
  known: LS.get("khtn.known", {}), showKnown: false,
  answers: {}, graded: {}, showScript: {}, sample: null
};
let db = null;
const Store = {
  addMistakes(list) {
    if (!list.length) return;
    if (db) { list.forEach(m => db.collection("mistakes").add(m).catch(() => {})); }
    else { state.mistakes = [...list, ...state.mistakes].slice(0, 500); LS.set("khtn.mistakes", state.mistakes); }
  },
  setScore(id, obj) {
    state.scores[id] = obj;
    if (db) db.doc("scores/" + id).set(obj).catch(() => {});
    else LS.set("khtn.scores", state.scores);
  },
  setProgress(day, done) {
    state.progress["d" + day] = { done };
    if (db) db.doc("progress/d" + day).set({ done }).catch(() => {});
    else LS.set("khtn.progress", state.progress);
  },
  setKnown(day, items) {
    state.known["d" + day] = { items };
    if (db) db.doc("known/d" + day).set({ items }).catch(() => {});
    else LS.set("khtn.known", state.known);
  }
};
async function connect() {
  if (!window.claude || !window.claude.use) return;
  try {
    const [d, s] = await Promise.all([window.claude.use("db"), window.claude.use("sample")]);
    state.sample = s;
    if (d) {
      db = d;
      document.getElementById("syncState").textContent = "Đã đồng bộ với Claude";
      document.getElementById("syncState").classList.add("on");
      db.collection("mistakes").orderBy("at", "desc").limit(500).onSnapshot(snap => {
        state.mistakes = snap.docs.map(x => x.data()); rerenderIf(["summary", "log"]);
      }, () => {});
      db.collection("scores").onSnapshot(snap => {
        const o = {}; snap.docs.forEach(x => o[x.id] = x.data()); state.scores = o; rerenderIf(["summary", "log"]);
      }, () => {});
      db.collection("progress").onSnapshot(snap => {
        const o = {}; snap.docs.forEach(x => o[x.id] = x.data()); state.progress = o; rerenderIf(["plan", "schedule"]);
      }, () => {});
      db.collection("known").onSnapshot(snap => {
        const o = {}; snap.docs.forEach(x => o[x.id] = x.data()); state.known = o; rerenderIf(["vocab"]);
      }, () => {});
    }
    render();
  } catch {}
}

/* ---------- helpers ---------- */
const $ = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null) el.append(k.nodeType ? k : document.createTextNode(k));
  return el;
};
const blank = s => s.replace(/___/g, "______");
const norm = s => s.toLowerCase().replace(/[’']/g, "'").replace(/[.,!?;:]/g, "").replace(/\s+/g, " ").trim();
const D = () => DATA.days[state.day];
const TAB_DATA = { grammar: "grammar", grammarEx: "grammarMcq", extra: "extra", vocab: "vocab", vocabEx: "vocabMcq", reading: "reading", exam: "exam", speaking: "speaking", summary: "reviewQuiz" };
const hasTab = (d, k) => !TAB_DATA[k] || !!d[TAB_DATA[k]];
function rerenderIf(tabs) { if (tabs.includes(state.tab)) render(); }

async function askClaude(prompt, out, btn) {
  if (!state.sample) return;
  btn.disabled = true; out.textContent = "Claude đang đọc…";
  try {
    const r = await state.sample(prompt, { onText: ({ text }) => { out.textContent = text.replace(/\*\*/g, ""); }, modelTier: "default" });
    out.textContent = r.text.replace(/\*\*/g, "");
  } catch (e) {
    out.textContent = e && e.code === "rate_limited" ? "Claude đang bận. Đợi một phút rồi bấm lại." : "Không gọi được Claude ở chế độ xem này.";
  } finally { btn.disabled = false; }
}

/* ---------- MCQ block (answer-sheet bubbles) ---------- */
function mcq(key, items, opts = {}) {
  const box = $("div");
  const ans = state.answers[key] || (state.answers[key] = {});
  const graded = state.graded[key];
  items.forEach((it, i) => {
    const q = $("div", { class: "q" },
      $("div", { class: "qn" }, String((opts.start || 1) + i) + "."),
      $("div", {}, it.type ? $("div", { class: "qtype" }, it.type) : null, blank(it.q)));
    const os = $("div", { class: "opts", role: "radiogroup" });
    it.options.forEach((o, j) => {
      const L = LETTERS[j];
      const cls = ["opt"];
      if (graded) { if (L === it.answer) cls.push("is-correct"); else if (ans[i] === L) cls.push("is-wrong"); }
      os.append($("label", { class: cls.join(" ") },
        $("input", { type: "radio", name: key + "-" + i, value: L, checked: ans[i] === L, disabled: !!graded,
          onchange: () => { ans[i] = L; } }),
        $("span", { class: "bubble" }, L), $("span", {}, o)));
    });
    q.append(os);
    if (graded) {
      const ok = ans[i] === it.answer;
      q.append($("div", { class: "feedback " + (ok ? "ok" : "bad") },
        $("div", { class: "tag" }, (ok ? "Đúng" : ans[i] ? "Sai · bạn chọn " + ans[i] : "Bỏ trống") + " · Đáp án " + it.answer + " · " + it.tag),
        $("div", {}, it.explain),
        it.evidence ? $("div", { class: "evidence" }, "Câu chứa đáp án: “" + it.evidence + "”") : null));
    }
    box.append(q);
  });
  const total = items.length;
  const right = graded ? items.filter((it, i) => ans[i] === it.answer).length : 0;
  box.append($("div", { class: "actions" },
    graded ? $("span", { class: "score" }, right + "/" + total) : null,
    graded ? $("button", { class: "btn ghost", onclick: () => { delete state.graded[key]; state.answers[key] = {}; render(); } }, "Làm lại")
      : $("button", { class: "btn", onclick: () => {
          const unanswered = items.filter((_, i) => !ans[i]).length;
          state.graded[key] = true;
          const wrong = items.map((it, i) => ({ it, i })).filter(({ it, i }) => ans[i] !== it.answer);
          Store.addMistakes(wrong.map(({ it, i }) => ({ day: state.day, section: opts.section, tag: it.tag, q: it.q,
            chosen: ans[i] ? ans[i] + ". " + it.options[LETTERS.indexOf(ans[i])] : "(bỏ trống)",
            answer: it.answer + ". " + it.options[LETTERS.indexOf(it.answer)], at: Date.now() })));
          Store.setScore("d" + state.day + "-" + key, { day: state.day, section: opts.section, score: total - wrong.length, total, at: Date.now() });
          if (opts.onGraded) opts.onGraded();
          render();
        } }, "Nộp bài"),
    graded ? null : $("span", { class: "note" }, "Đáp án chỉ hiện sau khi nộp.")));
  return box;
}

function transformBlock(tkey, list, start, section = "Viết lại câu") {
  const tans = state.answers[tkey] || (state.answers[tkey] = {});
  const tg = state.graded[tkey];
  const tbox = $("div");
  list.forEach((t, i) => {
    const ok = tg && t.answers.some(a => norm(a) === norm(tans[i] || ""));
    const row = $("div", { class: "tq" },
      $("div", {}, $("b", {}, (start + i) + ". "), t.source),
      $("div", { class: "start" }, $("b", {}, "→"),
        $("input", { type: "text", id: "tf-" + state.day + "-" + tkey + "-" + i, value: tans[i] || (t.start + " "), disabled: !!tg, "aria-label": "Viết lại câu " + (start + i),
          oninput: e => { tans[i] = e.target.value; } })));
    if (tg) {
      const out = $("div", { class: "ai-out" });
      row.append($("div", { class: "feedback " + (ok ? "ok" : "bad") },

const TTS = window.speechSynthesis;
function speakLines(lines, btn) {
  if (!TTS) return;
  if (TTS.speaking) { TTS.cancel(); return; }
  const voices = TTS.getVoices().filter(v => /^en[-_]/i.test(v.lang));
  const female = voices.find(v => /female|samantha|zira|susan|serena|karen|moira|tessa|libby|sonia|aria|jenny/i.test(v.name)) || voices[0];
  const male = voices.find(v => v !== female && /male|daniel|david|alex|fred|george|guy|ryan|mark/i.test(v.name)) || voices.find(v => v !== female) || female;
  const who = {};
  const queue = [];
  for (let round = 0; round < 2; round++) lines.forEach(l => {
    const m = l.match(/^([A-Z][a-z]+):\s*(.*)$/);
    const name = m ? m[1] : "", text = m ? m[2] : l;
    if (!(name in who)) who[name] = /^(Woman|Lan|Speaker|Mai|Hoa)$/.test(name) ? "f" : name === "" ? "f" : "m";

    const v = who[name] === "f" ? female : male; if (v) u.voice = v;
    u.pitch = who[name] === "f" ? 1.1 : 0.9;
    queue.push(u);
  });
  const label = btn.textContent;
  btn.textContent = "■ Dừng";
  queue[queue.length - 1].onend = queue[queue.length - 1].onerror = () => { btn.textContent = label; };
  queue.forEach(u => TTS.speak(u));
}

      $("label", { for: "intro-" + state.day, class: "note" }, "Viết bài của bạn (điền vào chỗ trống, nói to 3 lần):"),
      $("textarea", { id: "intro-" + state.day, oninput: e => { state.answers.intro = e.target.value; LS.set("khtn.intro." + state.day, e.target.value); } }, draft),
      state.sample ? $("div", { class: "actions" }, introBtn) : null, introOut);
    if (!state.answers.intro && draft) state.answers.intro = draft;
    const sa = state.answers.speak || (state.answers.speak = {});
    const qs = $("section", { class: "sheet" }, $("div", { class: "head-row" }, $("h2", {}, "Giám khảo hỏi: " + d.speakingTopic), $("span", { class: "meta" }, sp.questions.length + " câu · nói 40–60 giây mỗi câu")),
      $("div", { class: "grid2" },
        $("div", {}, $("h3", {}, "Khung trả lời"), $("p", { class: "note" }, sp.frame)),
        $("div", {}, $("h3", {}, "Câu cứu nguy"), $("ul", { class: "plain note" }, sp.rescue.map(r => $("li", {}, r))))));
    sp.questions.forEach((q, i) => {
      const out = $("div", { class: "ai-out" });
      const b = $("button", { class: "btn ghost", onclick: () => askClaude(
        "Bạn là giám khảo nói tiếng Anh đầu vào thạc sĩ, trình độ B1.\nCâu hỏi: " + q.q + "\nThí sinh trả lời: " + (sa[i] || "") +
        "\nHãy: 1) sửa lỗi ngữ pháp/từ vựng, giải thích ngắn bằng tiếng Việt; 2) gợi ý 1 câu trả lời hay hơn ngắn gọn (2–3 câu tiếng Anh B1). Gạch đầu dòng, không dùng markdown heading.", out, b) }, "Nhờ Claude sửa");
      qs.append($("div", { class: "tq" },
        $("div", {}, $("b", {}, (i + 1) + ". " + q.q)), $("div", { class: "note" }, q.hint),
        $("textarea", { id: "sp-" + state.day + "-" + i, placeholder: "Nói to trước, sau đó gõ lại câu trả lời của bạn ở đây", oninput: e => { sa[i] = e.target.value; } }, sa[i] || ""),
        state.sample ? $("div", { class: "actions" }, b) : null, out));
    });
    const totalOut = $("div", { class: "ai-out" });
    const totalBtn = $("button", { class: "btn", onclick: () => askClaude(
      "Bạn là giám khảo nói tiếng Anh đầu vào thạc sĩ ĐH KHTN, trình độ B1. Phần hội thoại chấm trên 15 điểm theo tiêu chí: " + sp.rubric.join("; ") +
      ".\n\n" + sp.questions.map((q, i) => "Hỏi: " + q.q + "\nĐáp: " + (sa[i] || "(không trả lời)")).join("\n\n") +
      "\n\nHãy chấm điểm ước tính /15, rồi nêu đúng 3 điểm cần cải thiện, bằng tiếng Việt, ngắn gọn, không dùng markdown heading.", totalOut, totalBtn) }, "Chấm điểm ước tính /15");
    const rubric = $("section", { class: "sheet" }, $("h2", {}, "Tiêu chí chấm (15 điểm)"), $("ul", { class: "plain" }, sp.rubric.map(r => $("li", {}, r))),
      state.sample ? $("div", { class: "actions" }, totalBtn) : $("p", { class: "note" }, "Mở trang này trên claude.ai để Claude sửa bài và chấm điểm, hoặc dán câu trả lời vào cuộc trò chuyện."),
      totalOut);
    return [intro, qs, rubric];
  },
  summary(d) {
    const mine = state.mistakes.filter(m => m.day === state.day);
    return [summaryBlock(mine, "Lỗi sai ngày " + d.day),
      $("section", { class: "sheet" }, $("div", { class: "head-row" }, $("h2", {}, "Quiz ôn tập"), $("span", { class: "meta" }, "10 câu trộn ngữ pháp + từ vựng")),
        mcq("reviewQuiz", d.reviewQuiz, { section: "Quiz tổng kết" }))];
  }
};

function summaryBlock(list, title) {
  const by = {};
  list.forEach(m => { (by[m.tag] = by[m.tag] || []).push(m); });
  const tags = Object.keys(by).sort((a, b) => by[b].length - by[a].length);
  const s = $("section", { class: "sheet" }, $("div", { class: "head-row" }, $("h2", {}, title), $("span", { class: "meta" }, list.length + " lỗi")));
  if (!tags.length) { s.append($("p", { class: "note" }, "Chưa có lỗi nào. Nộp các bài tập, câu sai sẽ tự ghi vào đây theo chủ điểm.")); return s; }
  s.append($("div", { class: "chips" }, tags.map(t => $("span", { class: "chip" }, t + " × " + by[t].length))));
  tags.forEach(t => {
    s.append($("h3", {}, t));
    s.append($("ul", { class: "plain" }, by[t].map(m => $("li", {}, blank(m.q), " — ", $("span", { class: "wrong" }, m.chosen), " → ", $("span", { class: "right" }, m.answer),
      $("span", { class: "note" }, "  (ngày " + m.day + " · " + m.section + ")")))));
  });
  return s;
}

function scheduleView() {
  const t = $("table", {}, $("thead", {}, $("tr", {}, ["Ngày", "Ngữ pháp", "Từ vựng", "Đề / Nói", ""].map(h => $("th", {}, h)))),
    $("tbody", {}, SCHEDULE.map((r, i) => {
      const n = i + 1, ready = !!DATA.days[n], done = ((state.progress["d" + n] || {}).done || []).length;
      return $("tr", {}, $("td", {}, $("b", {}, n)), r.map(c => $("td", {}, c)),
        $("td", {}, $("span", { class: "status" + (ready ? " on" : "") }, ready ? (done ? done + " bước xong" : "Sẵn sàng") : "Chưa soạn")));
    })));
  return [$("section", { class: "sheet" }, $("h2", {}, "Lịch 7 ngày"), $("div", { class: "scroll" }, t),
    $("p", { class: "note" }, "Ngày 4 thi thử 70 câu, ngày 6 thi thử đúng format đề thật 90 câu (có Tìm lỗi sai, 4 bài đọc). Từ ngày 2 mỗi ngày viết lại 5 câu. Ngày chưa soạn: gõ “Bắt đầu ngày N” với Claude để soạn và cập nhật trang này."))];
}
function logView() {
  const scores = Object.values(state.scores).sort((a, b) => a.day - b.day || a.at - b.at);
  const st = $("section", { class: "sheet" }, $("h2", {}, "Điểm các bài đã nộp"),
    scores.length ? $("div", { class: "scroll" }, $("table", {}, $("tbody", {}, scores.map(s => $("tr", {}, $("td", {}, "Ngày " + s.day), $("td", {}, s.section),
      $("td", { style: "font-variant-numeric: tabular-nums; font-weight: 700" }, s.score + "/" + s.total))))))
      : $("p", { class: "note" }, "Chưa nộp bài nào."));
  return [summaryBlock(state.mistakes, "Sổ lỗi sai (tất cả các ngày)"), st];
}

/* ---------- render ---------- */
function render() {
  const days = document.getElementById("days"); days.replaceChildren();
  for (let n = 1; n <= 7; n++) days.append($("button", { class: "day-btn", "aria-pressed": String(state.day === n && !["schedule", "log"].includes(state.tab)),
    onclick: () => { if (state.day !== n) { state.answers = {}; state.graded = {}; state.showScript = {}; if (TTS) TTS.cancel(); } state.day = n; if (["schedule", "log"].includes(state.tab)) state.tab = "plan"; LS.set("khtn.day", n); LS.set("khtn.tab", state.tab); render(); } },
    $("span", { class: "dot" + (DATA.days[n] ? " ready" : "") }), "Ngày " + n));
  const tabs = document.getElementById("tabs"); tabs.replaceChildren();
  const d = D();
  if (d) TABS.filter(([k]) => hasTab(d, k)).forEach(([k, label]) => tabs.append($("button", { class: "tab", role: "tab", "aria-selected": String(state.tab === k), onclick: () => { state.tab = k; LS.set("khtn.tab", k); render(); window.scrollTo({ top: 0 }); } }, label)));
  [["schedule", "Lịch 7 ngày"], ["log", "Sổ lỗi sai"]].forEach(([k, label]) => tabs.append($("button", { class: "tab global", role: "tab", "aria-selected": String(state.tab === k), onclick: () => { state.tab = k; LS.set("khtn.tab", k); render(); } }, label)));
  const main = document.getElementById("main");
  let nodes;
  if (state.tab === "schedule") nodes = scheduleView();
  else if (state.tab === "log") nodes = logView();
  else if (!d) nodes = [$("section", { class: "sheet" }, $("h2", {}, "Ngày " + state.day + " chưa được soạn"),
    $("p", {}, "Gõ “Bắt đầu ngày " + state.day + "” với Claude. Bài học sẽ được thêm vào trang này."), $("p", { class: "note" }, SCHEDULE[state.day - 1].join(" · ")))];
  else nodes = (hasTab(d, state.tab) && views[state.tab] || views.plan)(d);
  main.replaceChildren(...nodes.filter(Boolean));
}
if (!DATA.days[state.day]) state.day = 1;
